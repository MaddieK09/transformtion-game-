<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game Prototype V4</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 10px);
      left: 10px;
      right: 10px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 470px;
      margin: 0 auto;
      padding: 11px 13px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.58);
      color: white;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .status {
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.92;
    }

    .bar {
      margin-top: 9px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
    }

    #barFill {
      width: 0%;
      height: 100%;
      background: white;
      border-radius: 999px;
    }

    #bottomUI {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(env(safe-area-inset-bottom) + 12px);
      z-index: 30;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      color: #111;
      background: white;
      min-width: 126px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    button:active {
      transform: scale(0.97);
    }

    button.secondary {
      min-width: 88px;
      background: rgba(255,255,255,0.84);
    }

    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 76px);
      left: 8px;
      right: 8px;
      text-align: center;
      color: rgba(255,255,255,0.92);
      font-size: 12px;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 5px rgba(0,0,0,0.7);
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game â Rig Test V4</div>
      <div id="status" class="status">
        You are in the starter body. Drag to look around, or tap LOOK DOWN.
      </div>
      <div class="bar">
        <div id="barFill"></div>
      </div>
    </div>
  </div>

  <div id="hint">Your camera is attached to the character's head â¢ body stays below you</div>

  <div id="bottomUI">
    <button id="lookBtn" class="secondary">LOOK DOWN</button>
    <button id="transformBtn">TRANSFORM</button>
    <button id="resetBtn" class="secondary">RESET</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    // =========================================================
    // ENGINE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x91d5f4);

    const camera = new THREE.PerspectiveCamera(
      78,
      window.innerWidth / window.innerHeight,
      0.025,
      150
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.getElementById("game").appendChild(renderer.domElement);

    // =========================================================
    // ROOM
    // =========================================================

    scene.add(new THREE.HemisphereLight(0xffffff, 0x53616e, 2.1));

    const sun = new THREE.DirectionalLight(0xffffff, 2.4);
    sun.position.set(4, 9, 4);
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({
        color: 0x92979c,
        roughness: 0.95
      })
    );

    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function worldBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.84
        })
      );

      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      scene.add(mesh);
      return mesh;
    }

    // Simple room.
    worldBox(0, 1.5, -6.3, 10, 3, 0.22, 0xdce0e3);
    worldBox(-5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);
    worldBox(5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);

    // Height-reference furniture.
    worldBox(-2.6, 0.45, -3.5, 1.45, 0.9, 0.75, 0x9b7755);
    worldBox(2.6, 0.88, -3.9, 0.72, 1.76, 0.72, 0x6d7c8f);

    // =========================================================
    // PLAYER RIG
    //
    // IMPORTANT:
    // This is now an actual hierarchy.
    //
    // player
    //   âââ yawBone
    //       âââ skeletonRoot
    //           âââ pelvisBone
    //           â   âââ leftHip -> thigh -> knee -> shin -> foot
    //           â   âââ rightHip -> thigh -> knee -> shin -> foot
    //           â   âââ chestBone
    //           â       âââ shoulders -> arms -> hands
    //           â       âââ headBone -> cameraPitch -> camera
    //
    // The camera lives in the head.
    // Looking down rotates ONLY the camera/head view, not the torso.
    // =========================================================

    const player = new THREE.Group();
    player.position.set(0, 0, 2.6);
    scene.add(player);

    const yawBone = new THREE.Group();
    player.add(yawBone);

    const skeletonRoot = new THREE.Group();
    yawBone.add(skeletonRoot);

    const pelvisBone = new THREE.Group();
    pelvisBone.position.set(0, 1.00, 0);
    skeletonRoot.add(pelvisBone);

    const chestBone = new THREE.Group();
    chestBone.position.set(0, 0.39, -0.015);
    pelvisBone.add(chestBone);

    const headBone = new THREE.Group();
    headBone.position.set(0, 0.29, -0.005);
    chestBone.add(headBone);

    const cameraPitch = new THREE.Group();
    // Eyes sit just slightly toward the front of the body.
    cameraPitch.position.set(0, 0, -0.025);
    headBone.add(cameraPitch);
    cameraPitch.add(camera);

    // =========================================================
    // MATERIALS
    // =========================================================

    const skinMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8a37c,
      roughness: 0.72
    });

    const shirtMaterial = new THREE.MeshStandardMaterial({
      color: 0x3f608f,
      roughness: 0.86
    });

    const pantsMaterial = new THREE.MeshStandardMaterial({
      color: 0x222b37,
      roughness: 0.91
    });

    const shoeMaterial = new THREE.MeshStandardMaterial({
      color: 0x171717,
      roughness: 0.96
    });

    // =========================================================
    // BODY-MESH HELPERS
    // =========================================================

    function ellipsoid(material) {
      return new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 20, 16),
        material
      );
    }

    function capsule(material) {
      // Base capsule is approximately 1 unit tall.
      return new THREE.Mesh(
        new THREE.CapsuleGeometry(0.10, 0.80, 7, 12),
        material
      );
    }

    function setCapsuleDimensions(mesh, radius, length) {
      // Base capsule radius is 0.10 and total height is 1.0.
      mesh.scale.set(
        radius / 0.10,
        length,
        radius / 0.10
      );
    }

    // =========================================================
    // TORSO MESHES
    // =========================================================

    const pelvisMesh = ellipsoid(pantsMaterial);
    pelvisBone.add(pelvisMesh);

    const abdomenMesh = ellipsoid(shirtMaterial);
    abdomenMesh.position.set(0, 0.15, -0.015);
    pelvisBone.add(abdomenMesh);

    const chestMesh = ellipsoid(shirtMaterial);
    chestMesh.position.set(0, 0, -0.025);
    chestBone.add(chestMesh);

    // These are clothed chest-contour meshes.
    // They start almost flat and gradually project more in the target profile.
    const leftChestContour = ellipsoid(shirtMaterial);
    const rightChestContour = ellipsoid(shirtMaterial);

    chestBone.add(leftChestContour, rightChestContour);

    // =========================================================
    // LEG RIG
    // =========================================================

    function createLeg(side) {
      const sign = side === "left" ? -1 : 1;

      const hip = new THREE.Group();
      pelvisBone.add(hip);

      const thigh = capsule(pantsMaterial);
      hip.add(thigh);

      const knee = new THREE.Group();
      hip.add(knee);

      const shin = capsule(pantsMaterial);
      knee.add(shin);

      const ankle = new THREE.Group();
      knee.add(ankle);

      const foot = ellipsoid(shoeMaterial);
      ankle.add(foot);

      return {
        sign,
        hip,
        thigh,
        knee,
        shin,
        ankle,
        foot
      };
    }

    const leftLeg = createLeg("left");
    const rightLeg = createLeg("right");

    // =========================================================
    // ARM RIG
    // =========================================================

    function createArm(side) {
      const sign = side === "left" ? -1 : 1;

      const shoulder = new THREE.Group();
      chestBone.add(shoulder);

      const upperArm = capsule(skinMaterial);
      shoulder.add(upperArm);

      const elbow = new THREE.Group();
      shoulder.add(elbow);

      const forearm = capsule(skinMaterial);
      elbow.add(forearm);

      const wrist = new THREE.Group();
      elbow.add(wrist);

      const hand = ellipsoid(skinMaterial);
      wrist.add(hand);

      return {
        sign,
        shoulder,
        upperArm,
        elbow,
        forearm,
        wrist,
        hand
      };
    }

    const leftArm = createArm("left");
    const rightArm = createArm("right");

    // =========================================================
    // STARTER + TARGET PROFILES
    //
    // Later these will come from the character creator / chosen target.
    // For now they prove that one rig can smoothly become another.
    // =========================================================

    const BASE_HEIGHT = 1.80;

    const starter = {
      name: "Starter",
      height: 1.80,

      shoulders: 0.48,
      chestWidth: 0.43,
      chestHeight: 0.34,
      chestDepth: 0.27,
      chestProjection: 0.015,

      waistWidth: 0.325,
      waistDepth: 0.225,

      hipWidth: 0.37,
      hipDepth: 0.27,
      pelvisHeight: 0.20,

      upperArmRadius: 0.061,
      forearmRadius: 0.052,
      handWidth: 0.105,
      handLength: 0.145,

      thighRadius: 0.087,
      shinRadius: 0.070,
      footWidth: 0.145,
      footLength: 0.28,

      skin: new THREE.Color(0xd8a37c),
      shirt: new THREE.Color(0x3f608f),
      pants: new THREE.Color(0x222b37)
    };

    const target = {
      name: "Target",
      height: 1.55,

      shoulders: 0.385,
      chestWidth: 0.395,
      chestHeight: 0.33,
      chestDepth: 0.30,
      chestProjection: 0.115,

      waistWidth: 0.265,
      waistDepth: 0.215,

      hipWidth: 0.49,
      hipDepth: 0.345,
      pelvisHeight: 0.22,

      upperArmRadius: 0.050,
      forearmRadius: 0.045,
      handWidth: 0.091,
      handLength: 0.128,

      thighRadius: 0.116,
      shinRadius: 0.078,
      footWidth: 0.135,
      footLength: 0.255,

      skin: new THREE.Color(0xb97554),
      shirt: new THREE.Color(0x923e88),
      pants: new THREE.Color(0x2a2230)
    };

    function mix(a, b, t) {
      return a + (b - a) * t;
    }

    // =========================================================
    // APPLY CURRENT BODY
    // =========================================================

    function applyBody(progress) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);

      // ----- Height -----
      const height = mix(starter.height, target.height, p);
      const heightScale = height / BASE_HEIGHT;

      // All vertical bone spacing, including the head/camera, scales together.
      skeletonRoot.scale.set(1, heightScale, 1);

      // ----- Torso dimensions -----
      const shoulders = mix(starter.shoulders, target.shoulders, p);

      const chestWidth = mix(starter.chestWidth, target.chestWidth, p);
      const chestHeight = mix(starter.chestHeight, target.chestHeight, p);
      const chestDepth = mix(starter.chestDepth, target.chestDepth, p);
      const chestProjection = mix(starter.chestProjection, target.chestProjection, p);

      const waistWidth = mix(starter.waistWidth, target.waistWidth, p);
      const waistDepth = mix(starter.waistDepth, target.waistDepth, p);

      const hipWidth = mix(starter.hipWidth, target.hipWidth, p);
      const hipDepth = mix(starter.hipDepth, target.hipDepth, p);
      const pelvisHeight = mix(starter.pelvisHeight, target.pelvisHeight, p);

      chestMesh.scale.set(
        chestWidth,
        chestHeight,
        chestDepth
      );

      abdomenMesh.scale.set(
        waistWidth,
        0.245,
        waistDepth
      );

      pelvisMesh.scale.set(
        hipWidth,
        pelvisHeight,
        hipDepth
      );

      // Clothed chest contour becomes more projected gradually.
      const contourWidth = 0.135;
      const contourHeight = 0.13;
      const contourDepth = Math.max(0.02, chestProjection);

      leftChestContour.position.set(
        -chestWidth * 0.22,
        -0.015,
        -(chestDepth * 0.44 + chestProjection * 0.28)
      );

      rightChestContour.position.set(
        chestWidth * 0.22,
        -0.015,
        -(chestDepth * 0.44 + chestProjection * 0.28)
      );

      leftChestContour.scale.set(
        contourWidth,
        contourHeight,
        contourDepth
      );

      rightChestContour.scale.copy(leftChestContour.scale);

      // ----- Arms -----
      const upperArmRadius = mix(starter.upperArmRadius, target.upperArmRadius, p);
      const forearmRadius = mix(starter.forearmRadius, target.forearmRadius, p);
      const handWidth = mix(starter.handWidth, target.handWidth, p);
      const handLength = mix(starter.handLength, target.handLength, p);

      const upperArmLength = 0.34;
      const forearmLength = 0.30;

      function updateArm(arm) {
        arm.shoulder.position.set(
          arm.sign * shoulders * 0.53,
          0.075,
          -0.012
        );

        setCapsuleDimensions(
          arm.upperArm,
          upperArmRadius,
          upperArmLength
        );

        arm.upperArm.position.set(
          0,
          -upperArmLength * 0.50,
          0
        );

        arm.elbow.position.set(
          0,
          -upperArmLength,
          0
        );

        setCapsuleDimensions(
          arm.forearm,
          forearmRadius,
          forearmLength
        );

        arm.forearm.position.set(
          0,
          -forearmLength * 0.50,
          -0.01
        );

        arm.wrist.position.set(
          0,
          -forearmLength,
          -0.015
        );

        arm.hand.scale.set(
          handWidth,
          handLength,
          handWidth * 0.58
        );

        arm.hand.position.set(
          0,
          -handLength * 0.46,
          -0.02
        );
      }

      updateArm(leftArm);
      updateArm(rightArm);

      // ----- Legs -----
      const thighRadius = mix(starter.thighRadius, target.thighRadius, p);
      const shinRadius = mix(starter.shinRadius, target.shinRadius, p);
      const footWidth = mix(starter.footWidth, target.footWidth, p);
      const footLength = mix(starter.footLength, target.footLength, p);

      const thighLength = 0.44;
      const shinLength = 0.42;

      function updateLeg(leg) {
        leg.hip.position.set(
          leg.sign * hipWidth * 0.22,
          -0.05,
          0.015
        );

        setCapsuleDimensions(
          leg.thigh,
          thighRadius,
          thighLength
        );

        leg.thigh.position.set(
          0,
          -thighLength * 0.50,
          0.015
        );

        leg.knee.position.set(
          0,
          -thighLength,
          0.01
        );

        setCapsuleDimensions(
          leg.shin,
          shinRadius,
          shinLength
        );

        leg.shin.position.set(
          0,
          -shinLength * 0.50,
          0.01
        );

        leg.ankle.position.set(
          0,
          -shinLength,
          0.005
        );

        leg.foot.scale.set(
          footWidth,
          0.095,
          footLength
        );

        // Forward is -Z.
        leg.foot.position.set(
          0,
          -0.045,
          -footLength * 0.34
        );
      }

      updateLeg(leftLeg);
      updateLeg(rightLeg);

      // ----- Colors -----
      skinMaterial.color.copy(starter.skin).lerp(target.skin, p);
      shirtMaterial.color.copy(starter.shirt).lerp(target.shirt, p);
      pantsMaterial.color.copy(starter.pants).lerp(target.pants, p);
    }

    // =========================================================
    // TRANSFORMATION
    // =========================================================

    let progress = 0;
    let transforming = false;
    let transformStart = 0;

    // Long enough to actually watch the body change.
    const TRANSFORM_MS = 26000;

    const status = document.getElementById("status");
    const barFill = document.getElementById("barFill");
    const transformBtn = document.getElementById("transformBtn");

    function startTransformation() {
      if (transforming || progress >= 1) return;

      transforming = true;

      transformStart =
        performance.now() - progress * TRANSFORM_MS;

      transformBtn.textContent = "TRANSFORMINGâ¦";

      status.textContent =
        "Transformation started â keep looking down while the rig changes continuously.";
    }

    function resetTransformation() {
      transforming = false;
      progress = 0;

      applyBody(0);

      transformBtn.textContent = "TRANSFORM";
      barFill.style.width = "0%";

      status.textContent =
        "You are back in the starter body. Drag to look around, or tap LOOK DOWN.";
    }

    transformBtn.addEventListener("click", startTransformation);

    document.getElementById("resetBtn").addEventListener(
      "click",
      resetTransformation
    );

    // =========================================================
    // FIRST-PERSON LOOK
    // =========================================================

    let yaw = 0;
    let pitch = -0.23;

    const sensitivity = 0.0042;
    const minPitch = THREE.MathUtils.degToRad(-88);
    const maxPitch = THREE.MathUtils.degToRad(80);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    function setPitch(value) {
      pitch = THREE.MathUtils.clamp(
        value,
        minPitch,
        maxPitch
      );
    }

    function beginLook(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function moveLook(x, y) {
      if (!dragging) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      setPitch(pitch - dy * sensitivity);
    }

    function endLook() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      (e) => {
        if (e.touches.length === 1) {
          beginLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      (e) => {
        if (e.touches.length === 1) {
          e.preventDefault();

          moveLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endLook);
    renderer.domElement.addEventListener("touchcancel", endLook);

    renderer.domElement.addEventListener(
      "mousedown",
      (e) => {
        beginLook(e.clientX, e.clientY);
      }
    );

    window.addEventListener(
      "mousemove",
      (e) => {
        moveLook(e.clientX, e.clientY);
      }
    );

    window.addEventListener("mouseup", endLook);

    document.getElementById("lookBtn").addEventListener(
      "click",
      () => {
        // A reliable first-person downward view for testing.
        setPitch(THREE.MathUtils.degToRad(-72));
      }
    );

    // =========================================================
    // LOOP
    // =========================================================

    applyBody(0);

    function animate(now) {
      requestAnimationFrame(animate);

      yawBone.rotation.y = yaw;
      cameraPitch.rotation.x = pitch;

      if (transforming) {
        progress =
          (now - transformStart) / TRANSFORM_MS;

        progress = THREE.MathUtils.clamp(
          progress,
          0,
          1
        );

        // Smooth but still continuously changing every rendered frame.
        const smooth =
          progress * progress * (3 - 2 * progress);

        applyBody(smooth);

        const percent = Math.round(progress * 100);

        barFill.style.width = percent + "%";

        status.textContent =
          `Transformingâ¦ ${percent}% â height, torso, hips, limbs, skin and clothing are changing.`;

        if (progress >= 1) {
          transforming = false;

          transformBtn.textContent = "COMPLETE";

          status.textContent =
            "Transformation complete â the rig now matches the target profile.";
        }
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener(
      "resize",
      () => {
        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio, 2)
        );
      }
    );
  </script>
</body>
</html>
