<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game V22 - Curvy Athletic Endpoint Bridge</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101217;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 700px;
      margin: auto;
      padding: 11px 13px;
      border-radius: 17px;
      color: white;
      background: rgba(0,0,0,0.67);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .debug {
      margin-top: 4px;
      font-size: 10px;
      line-height: 1.35;
      opacity: 0.74;
      white-space: pre-line;
    }

    #controls {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      z-index: 30;
      max-height: 44vh;
      overflow: auto;
      border-radius: 18px;
      background: rgba(12,14,18,0.93);
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    #buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 11px;
      min-width: 92px;
      color: #111;
      background: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 800;
    }

    button:active {
      transform: scale(0.97);
    }

    .controlRow {
      padding: 9px 2px;
      border-top: 1px solid rgba(255,255,255,0.09);
    }

    .labelLine {
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .value {
      opacity: 0.8;
      min-width: 44px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #101217;
      color: white;
      font-size: 16px;
      font-weight: 800;
    }

    #fatal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 18%;
      left: 15px;
      right: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #761c1c;
      color: white;
      font: 700 13px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="game"></div>
  <div id="loading">Loading V22 and building the curvy-athletic weighted bone-volume bridge...</div>
  <div id="fatal"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game - V22 Curvy Athletic Endpoint Bridge</div>
      <div id="status" class="status">Loading both real endpoint humans...</div>
      <div id="debug" class="debug"></div>
    </div>
  </div>

  <div id="controls">
    <div id="buttons">
      <button id="bodyViewBtn">BODY VIEW</button>
      <button id="lookBtn">LOOK DOWN</button>
      <button id="resetBtn">RESET</button>
      <button id="playBtn">PLAY MORPH</button>
      <button id="maleRefBtn">MALE REF</button>
      <button id="femaleRefBtn">FEMALE REF</button>
      <button id="bridgeBtn">BRIDGE</button>
    </div>

    <div class="controlRow">
      <div class="labelLine">
        <span>WEIGHTED BODY TRANSFORMATION</span>
        <span id="progressValue" class="value">0%</span>
      </div>
      <input id="progressSlider" type="range" min="0" max="1" step="0.001" value="0">
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const loading = document.getElementById("loading");
    const fatal = document.getElementById("fatal");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const progressSlider = document.getElementById("progressSlider");
    const progressValue = document.getElementById("progressValue");

    function fail(error) {
      console.error(error);
      loading.style.display = "none";
      fatal.style.display = "block";
      fatal.textContent =
        "V20 ERROR\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nSend me a screenshot of this red box.";
    }

    window.addEventListener("error", e => {
      if (e.error) fail(e.error);
    });

    window.addEventListener("unhandledrejection", e => {
      fail(e.reason);
    });

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94d7f2);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.015,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById("game").appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x65727b, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(4, 8, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xdceaff, 1.0);
    fill.position.set(-4, 4, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xa2a5a8,
        roughness: 0.95
      })
    );

    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function roomBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.88
        })
      );

      mesh.position.set(x,y,z);
      mesh.scale.set(sx,sy,sz);
      scene.add(mesh);
    }

    roomBox(0, 1.5, -6, 10, 3, 0.2, 0xd8dde1);
    roomBox(-5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);
    roomBox(5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);

    // =========================================================
    // LOAD + MODEL HELPERS
    // =========================================================

    const loader = new GLTFLoader();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    }

    function getBounds(root) {
      root.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      return { box, size, center };
    }

    function normalizeModel(root, targetHeight) {
      let b = getBounds(root);

      if (!isFinite(b.size.y) || b.size.y <= 0.001) {
        throw new Error("Invalid model bounds.");
      }

      const scale = targetHeight / b.size.y;
      root.scale.multiplyScalar(scale);
      root.updateMatrixWorld(true);

      b = getBounds(root);

      root.position.x -= b.center.x;
      root.position.z -= b.center.z;
      root.position.y -= b.box.min.y;

      root.updateMatrixWorld(true);
    }

    function collectBones(root) {
      const map = new Map();

      root.traverse(obj => {
        if (obj.isBone && obj.name) {
          map.set(obj.name, obj);
        }
      });

      return map;
    }

    function getRenderableMeshes(root) {
      const out = [];

      root.traverse(obj => {
        if (
          (obj.isMesh || obj.isSkinnedMesh) &&
          obj.geometry?.attributes?.position
        ) {
          out.push(obj);
        }
      });

      return out;
    }

    // =========================================================
    // VERTEX / SKIN HELPERS
    // =========================================================

    const tmp = new THREE.Vector3();
    const tmp2 = new THREE.Vector3();
    const tmp3 = new THREE.Vector3();
    const accum = new THREE.Vector3();
    const inv = new THREE.Matrix4();

    function getWorldVertex(mesh, index, target) {
      target.fromBufferAttribute(
        mesh.geometry.attributes.position,
        index
      );

      if (mesh.isSkinnedMesh && mesh.skeleton) {
        mesh.applyBoneTransform(index, target);
      }

      return mesh.localToWorld(target);
    }

    function worldToBoneLocal(world, bone, target) {
      inv.copy(bone.matrixWorld).invert();
      return target.copy(world).applyMatrix4(inv);
    }

    function getSkinInfluences(mesh, index) {
      if (
        !mesh.isSkinnedMesh ||
        !mesh.skeleton ||
        !mesh.geometry.attributes.skinIndex ||
        !mesh.geometry.attributes.skinWeight
      ) {
        return [];
      }

      const si = mesh.geometry.attributes.skinIndex;
      const sw = mesh.geometry.attributes.skinWeight;

      const ids = [
        si.getX(index),
        si.getY(index),
        si.getZ(index),
        si.getW(index)
      ];

      const ws = [
        sw.getX(index),
        sw.getY(index),
        sw.getZ(index),
        sw.getW(index)
      ];

      const out = [];

      for (let k = 0; k < 4; k++) {
        const weight = ws[k];

        if (weight <= 0.00001) continue;

        const bone = mesh.skeleton.bones[ids[k]];

        if (!bone || !bone.name) continue;

        out.push({
          bone,
          boneName: bone.name,
          weight
        });
      }

      return out;
    }

    // =========================================================
    // BONE VOLUMES
    // =========================================================

    function ensureVolume(map, boneName) {
      let v = map.get(boneName);

      if (!v) {
        v = {
          boneName,
          min: new THREE.Vector3(
            +Infinity,+Infinity,+Infinity
          ),
          max: new THREE.Vector3(
            -Infinity,-Infinity,-Infinity
          ),
          count: 0
        };

        map.set(boneName, v);
      }

      return v;
    }

    function expandVolume(volume, p) {
      volume.min.min(p);
      volume.max.max(p);
      volume.count++;
    }

    function buildBoneVolumes(root, boneMap) {
      const volumes = new Map();
      const meshes = getRenderableMeshes(root);

      for (const mesh of meshes) {
        const count =
          mesh.geometry.attributes.position.count;

        for (let i = 0; i < count; i++) {
          const influences =
            getSkinInfluences(mesh, i);

          if (influences.length === 0) continue;

          getWorldVertex(mesh, i, tmp);

          for (const influence of influences) {
            // Ignore tiny weights when estimating anatomical volume.
            if (influence.weight < 0.02) continue;

            const bone =
              boneMap.get(influence.boneName);

            if (!bone) continue;

            worldToBoneLocal(
              tmp,
              bone,
              tmp2
            );

            const volume =
              ensureVolume(
                volumes,
                influence.boneName
              );

            expandVolume(
              volume,
              tmp2
            );
          }
        }
      }

      return volumes;
    }

    function normalizedInVolume(local, volume, target) {
      const sx =
        Math.max(
          1e-5,
          volume.max.x - volume.min.x
        );

      const sy =
        Math.max(
          1e-5,
          volume.max.y - volume.min.y
        );

      const sz =
        Math.max(
          1e-5,
          volume.max.z - volume.min.z
        );

      target.set(
        (local.x - volume.min.x) / sx,
        (local.y - volume.min.y) / sy,
        (local.z - volume.min.z) / sz
      );

      // Softly clamp outliers so one strange vertex cannot explode.
      target.x = THREE.MathUtils.clamp(target.x, -0.08, 1.08);
      target.y = THREE.MathUtils.clamp(target.y, -0.08, 1.08);
      target.z = THREE.MathUtils.clamp(target.z, -0.08, 1.08);

      return target;
    }

    function denormalizeInVolume(n, volume, target) {
      target.set(
        THREE.MathUtils.lerp(
          volume.min.x,
          volume.max.x,
          n.x
        ),
        THREE.MathUtils.lerp(
          volume.min.y,
          volume.max.y,
          n.y
        ),
        THREE.MathUtils.lerp(
          volume.min.z,
          volume.max.z,
          n.z
        )
      );

      return target;
    }

    // =========================================================
    // UNSKINNED MESH FALLBACK
    // =========================================================

    function meshInfo(mesh) {
      return {
        mesh,
        vertices:
          mesh.geometry.attributes.position.count,
        indices:
          mesh.geometry.index?.count || 0,
        name:
          mesh.name || "(unnamed)"
      };
    }

    function pairMeshesBySize(femaleMeshes, maleMeshes) {
      const maleInfo =
        maleMeshes.map(meshInfo);

      const used = new Set();
      const map = new Map();

      for (const female of femaleMeshes.map(meshInfo)) {
        let bestIndex = -1;
        let bestScore = Infinity;

        // Prefer exact mesh names when possible.
        for (let i = 0; i < maleInfo.length; i++) {
          if (used.has(i)) continue;

          const male = maleInfo[i];

          let score =
            Math.abs(female.vertices - male.vertices) +
            Math.abs(female.indices - male.indices) * 0.05;

          if (
            female.name !== "(unnamed)" &&
            female.name === male.name
          ) {
            score -= 100000;
          }

          if (score < bestScore) {
            bestScore = score;
            bestIndex = i;
          }
        }

        if (bestIndex >= 0) {
          used.add(bestIndex);
          map.set(
            female.mesh,
            maleInfo[bestIndex].mesh
          );
        }
      }

      return map;
    }

    function getMeshWorldBounds(mesh) {
      const count =
        mesh.geometry.attributes.position.count;

      const min =
        new THREE.Vector3(
          +Infinity,+Infinity,+Infinity
        );

      const max =
        new THREE.Vector3(
          -Infinity,-Infinity,-Infinity
        );

      for (let i = 0; i < count; i++) {
        getWorldVertex(mesh, i, tmp);
        min.min(tmp);
        max.max(tmp);
      }

      return { min, max };
    }

    function normalizeWorldInBounds(p, bounds, target) {
      const sx =
        Math.max(1e-5, bounds.max.x - bounds.min.x);
      const sy =
        Math.max(1e-5, bounds.max.y - bounds.min.y);
      const sz =
        Math.max(1e-5, bounds.max.z - bounds.min.z);

      return target.set(
        (p.x - bounds.min.x) / sx,
        (p.y - bounds.min.y) / sy,
        (p.z - bounds.min.z) / sz
      );
    }

    function denormalizeWorldInBounds(n, bounds, target) {
      return target.set(
        THREE.MathUtils.lerp(
          bounds.min.x,
          bounds.max.x,
          n.x
        ),
        THREE.MathUtils.lerp(
          bounds.min.y,
          bounds.max.y,
          n.y
        ),
        THREE.MathUtils.lerp(
          bounds.min.z,
          bounds.max.z,
          n.z
        )
      );
    }

    // =========================================================
    // BRIDGE DATA
    // =========================================================

    let maleRoot;
    let femaleRoot;

    let maleBones;
    let femaleBones;

    let maleVolumes;
    let femaleVolumes;

    let bridgeGroup;
    let bridgeParts = [];

    let showing = "bridge";

    let femaleToMaleMesh = new Map();
    let femaleMeshBounds = new Map();
    let maleMeshBounds = new Map();
    let femaleBodyBounds;

    const CURVE_PROFILE = {
      // Curvy athletic, not plus-size:
      // stronger chest projection, athletic waist/hips, less soft widening.
      chestOut: 0.030,
      chestForward: 0.145,
      hipsOut: 0.045,
      waistIn: 0.050,
      thighOut: 0.018,
      buttBack: 0.024,
      shoulderOut: 0.018,
      abdomenTighten: 0.020
    };

    function bandMask(v, a, b, c, d) {
      const rise = THREE.MathUtils.smoothstep(v, a, b);
      const fall = 1 - THREE.MathUtils.smoothstep(v, c, d);
      return THREE.MathUtils.clamp(rise * fall, 0, 1);
    }

    function stylizeCurvyFemaleWorld(world) {
      if (!femaleBodyBounds) return world.clone();

      const { box, size, center } = femaleBodyBounds;
      const out = world.clone();

      const halfW = Math.max(0.0001, size.x * 0.5);
      const halfD = Math.max(0.0001, size.z * 0.5);

      const nx = (world.x - center.x) / halfW;
      const ny = (world.y - box.min.y) / Math.max(0.0001, size.y);
      const nz = (world.z - center.z) / halfD;

      const absX = Math.abs(nx);
      const side = nx < 0 ? -1 : 1;

      // Athletic hourglass zones.
      const shoulderBand = bandMask(ny, 0.70, 0.76, 0.84, 0.90);
      const chestBand    = bandMask(ny, 0.55, 0.62, 0.74, 0.82);
      const waistBand    = bandMask(ny, 0.47, 0.54, 0.64, 0.70);
      const hipBand      = bandMask(ny, 0.37, 0.45, 0.56, 0.64);
      const thighBand    = bandMask(ny, 0.22, 0.30, 0.40, 0.50);
      const buttBand     = bandMask(ny, 0.35, 0.43, 0.56, 0.64);
      const abdomenBand  = bandMask(ny, 0.48, 0.55, 0.67, 0.75);

      // Two separate chest lobes, not a single torso blob.
      const bustSeparation = THREE.MathUtils.smoothstep(absX, 0.10, 0.24);
      const bustOuterFade = 1 - THREE.MathUtils.smoothstep(absX, 0.46, 0.88);
      const bustLobe = chestBand * bustSeparation * bustOuterFade;

      // Keep shoulders athletic instead of shrinking them too much.
      out.x += side * size.x * CURVE_PROFILE.shoulderOut * shoulderBand * (0.35 + absX * 0.65);

      // Athletic hips: visibly curvy, but not wide/soft.
      out.x += side * size.x * CURVE_PROFILE.hipsOut * hipBand * (0.25 + absX * 0.75);

      // Light thigh fullness only. This avoids the "fat" look.
      out.x += side * size.x * CURVE_PROFILE.thighOut * thighBand * (0.25 + absX * 0.75);

      // Waist pinch for athletic hourglass shape.
      out.x -= side * size.x * CURVE_PROFILE.waistIn * waistBand * (0.20 + absX * 0.80);

      // Chest width only on the lobes, not across the whole upper torso.
      out.x += side * size.x * CURVE_PROFILE.chestOut * bustLobe;

      // Stronger forward chest projection.
      // Camera/front direction for these models reads best with +Z here.
      const frontMask = THREE.MathUtils.smoothstep(nz, -0.10, 0.24);
      out.z += size.z * CURVE_PROFILE.chestForward * bustLobe * frontMask;

      // Slight lower-bust drop to make the chest read as volume instead of flat swelling.
      out.y -= size.y * 0.010 * bustLobe;

      // Tight athletic abdomen: flatten a bit instead of adding belly mass.
      out.z -= size.z * CURVE_PROFILE.abdomenTighten * abdomenBand * frontMask;

      // Small glute fullness, deliberately restrained.
      const backMask = 1 - THREE.MathUtils.smoothstep(nz, -0.22, 0.06);
      out.z -= size.z * CURVE_PROFILE.buttBack * buttBand * backMask;

      return out;
    }

    function mapFemaleVertexToMaleStart(femaleMesh, index, femaleWorld) {
      const influences =
        getSkinInfluences(femaleMesh, index);

      if (influences.length > 0) {
        accum.set(0,0,0);

        let totalWeight = 0;

        for (const influence of influences) {
          const boneName =
            influence.boneName;

          const femaleBone =
            femaleBones.get(boneName);

          const maleBone =
            maleBones.get(boneName);

          if (!femaleBone || !maleBone) {
            continue;
          }

          const fv =
            femaleVolumes.get(boneName);

          const mv =
            maleVolumes.get(boneName);

          // If volume information exists on both bodies:
          // female bone-local coordinate -> normalized anatomical volume
          // -> male anatomical volume -> male bone world coordinate.
          if (
            fv &&
            mv &&
            fv.count >= 2 &&
            mv.count >= 2
          ) {
            worldToBoneLocal(
              femaleWorld,
              femaleBone,
              tmp
            );

            normalizedInVolume(
              tmp,
              fv,
              tmp2
            );

            denormalizeInVolume(
              tmp2,
              mv,
              tmp3
            );

            tmp3.applyMatrix4(
              maleBone.matrixWorld
            );
          } else {
            // Shared-rig fallback:
            // preserve raw bone-local coordinates.
            worldToBoneLocal(
              femaleWorld,
              femaleBone,
              tmp3
            );

            tmp3.applyMatrix4(
              maleBone.matrixWorld
            );
          }

          accum.addScaledVector(
            tmp3,
            influence.weight
          );

          totalWeight +=
            influence.weight;
        }

        if (totalWeight > 0.00001) {
          accum.multiplyScalar(
            1 / totalWeight
          );

          return accum.clone();
        }
      }

      // Non-skinned fallback uses mesh-level normalized coordinates.
      const maleMesh =
        femaleToMaleMesh.get(femaleMesh);

      if (maleMesh) {
        const fb =
          femaleMeshBounds.get(femaleMesh);

        const mb =
          maleMeshBounds.get(maleMesh);

        if (fb && mb) {
          normalizeWorldInBounds(
            femaleWorld,
            fb,
            tmp
          );

          denormalizeWorldInBounds(
            tmp,
            mb,
            tmp2
          );

          return tmp2.clone();
        }
      }

      return femaleWorld.clone();
    }

    async function buildBridge() {
      const femaleMeshes =
        getRenderableMeshes(femaleRoot);

      const maleMeshes =
        getRenderableMeshes(maleRoot);

      femaleToMaleMesh =
        pairMeshesBySize(
          femaleMeshes,
          maleMeshes
        );

      // Precompute fallback world bounds once.
      for (const mesh of femaleMeshes) {
        femaleMeshBounds.set(
          mesh,
          getMeshWorldBounds(mesh)
        );
      }

      for (const mesh of maleMeshes) {
        maleMeshBounds.set(
          mesh,
          getMeshWorldBounds(mesh)
        );
      }

      bridgeGroup =
        new THREE.Group();

      bridgeGroup.name =
        "V20WeightedBoneVolumeBridge";

      scene.add(bridgeGroup);

      bridgeParts = [];

      let exactFemaleTargetVertices = 0;
      let weightedVertices = 0;
      let fallbackVertices = 0;

      for (
        let meshIndex = 0;
        meshIndex < femaleMeshes.length;
        meshIndex++
      ) {
        const femaleMesh =
          femaleMeshes[meshIndex];

        statusEl.textContent =
          `Building weighted bridge ${meshIndex + 1}/${femaleMeshes.length}...`;

        const count =
          femaleMesh.geometry.attributes.position.count;

        const start =
          new Float32Array(count * 3);

        const target =
          new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
          getWorldVertex(
            femaleMesh,
            i,
            tmp
          );

          const femaleWorld =
            tmp.clone();

          const k =
            i * 3;

          // Curvier endpoint: start from the real female world vertex,
          // then apply a stylized curvy-body enhancement so the transformation reads more clearly.
          const targetWorld =
            stylizeCurvyFemaleWorld(femaleWorld);

          target[k] =
            targetWorld.x;

          target[k + 1] =
            targetWorld.y;

          target[k + 2] =
            targetWorld.z;

          exactFemaleTargetVertices++;

          const influences =
            getSkinInfluences(
              femaleMesh,
              i
            );

          const maleStart =
            mapFemaleVertexToMaleStart(
              femaleMesh,
              i,
              femaleWorld
            );

          if (influences.length > 0) {
            weightedVertices++;
          } else {
            fallbackVertices++;
          }

          start[k] =
            maleStart.x;

          start[k + 1] =
            maleStart.y;

          start[k + 2] =
            maleStart.z;
        }

        const geometry =
          new THREE.BufferGeometry();

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(
            new Float32Array(start),
            3
          )
        );

        // Keep female topology the whole time.
        // This guarantees the bridge is EXACT female geometry at 100%.
        if (femaleMesh.geometry.index) {
          geometry.setIndex(
            femaleMesh.geometry.index.clone()
          );
        }

        if (femaleMesh.geometry.attributes.uv) {
          geometry.setAttribute(
            "uv",
            femaleMesh.geometry.attributes.uv.clone()
          );
        }

        geometry.computeVertexNormals();

        let material;

        if (Array.isArray(femaleMesh.material)) {
          material =
            femaleMesh.material.map(
              m => m.clone()
            );
        } else if (femaleMesh.material) {
          material =
            femaleMesh.material.clone();
        } else {
          material =
            new THREE.MeshStandardMaterial({
              color: 0xd7aa8c,
              roughness: 0.74
            });
        }

        const bridgeMesh =
          new THREE.Mesh(
            geometry,
            material
          );

        bridgeMesh.frustumCulled =
          false;

        bridgeGroup.add(
          bridgeMesh
        );

        bridgeParts.push({
          mesh: bridgeMesh,
          start,
          target
        });

        await new Promise(
          resolve =>
            setTimeout(resolve, 0)
        );
      }

      const sharedBones =
        [...femaleBones.keys()]
          .filter(name =>
            maleBones.has(name)
          ).length;

      debugEl.textContent =
        `shared bones: ${sharedBones}\n` +
        `female bone volumes: ${femaleVolumes.size}\n` +
        `male bone volumes: ${maleVolumes.size}\n` +
        `weighted vertices: ${weightedVertices}\n` +
        `mesh fallback vertices: ${fallbackVertices}\n` +
        `exact female target vertices: ${exactFemaleTargetVertices}\n` +
        `correspondence: full skin-weight blend + normalized bone volume\n` +
        `rank sorting: NONE\n` +
        `nearest-point matching: NONE\n` +
        `100% target: curvy athletic female geometry\n` +
        `curve profile: athletic shoulders + bigger chest + trim waist + moderate hips`;

      maleRoot.visible =
        false;

      femaleRoot.visible =
        false;

      bridgeGroup.visible =
        true;
    }

    // =========================================================
    // MORPH
    // =========================================================

    function smootherstep(t) {
      return t*t*t*(t*(t*6 - 15) + 10);
    }

    let normalFrame = 0;

    function applyProgress(raw) {
      const p =
        THREE.MathUtils.clamp(
          raw,
          0,
          1
        );

      const t =
        smootherstep(p);

      for (const part of bridgeParts) {
        const live =
          part.mesh.geometry
            .attributes.position.array;

        const a =
          part.start;

        const b =
          part.target;

        for (
          let i = 0;
          i < live.length;
          i++
        ) {
          live[i] =
            a[i] +
            (b[i] - a[i]) * t;
        }

        part.mesh.geometry
          .attributes.position
          .needsUpdate = true;
      }

      normalFrame++;

      if (
        normalFrame % 3 === 0 ||
        p === 0 ||
        p === 1
      ) {
        for (const part of bridgeParts) {
          part.mesh.geometry
            .computeVertexNormals();
        }
      }

      progressSlider.value =
        String(p);

      progressValue.textContent =
        Math.round(p * 100) + "%";

      statusEl.textContent =
        `Weighted bone-volume transformation - ${Math.round(p * 100)}%`;
    }

    // =========================================================
    // VIEW MODES
    // =========================================================

    function activeVisual() {
      if (showing === "male") {
        return maleRoot;
      }

      if (showing === "female") {
        return femaleRoot;
      }

      return bridgeGroup;
    }

    function setShowing(mode) {
      showing =
        mode;

      bridgeGroup.visible =
        mode === "bridge";

      maleRoot.visible =
        mode === "male";

      femaleRoot.visible =
        mode === "female";

      setBodyView();

      if (mode === "bridge") {
        statusEl.textContent =
          "Bridge body - weighted bone-volume start, curvy athletic female target.";
      } else if (mode === "male") {
        statusEl.textContent =
          "Real male endpoint reference.";
      } else {
        statusEl.textContent =
          "Real female endpoint reference.";
      }
    }

    document.getElementById("maleRefBtn")
      .addEventListener(
        "click",
        () => {
          playing =
            false;

          setShowing(
            "male"
          );
        }
      );

    document.getElementById("femaleRefBtn")
      .addEventListener(
        "click",
        () => {
          playing =
            false;

          setShowing(
            "female"
          );
        }
      );

    document.getElementById("bridgeBtn")
      .addEventListener(
        "click",
        () => {
          setShowing(
            "bridge"
          );
        }
      );

    // =========================================================
    // PLAYBACK
    // =========================================================

    let playing =
      false;

    let playStart =
      0;

    const PLAY_MS =
      17000;

    document.getElementById("playBtn")
      .addEventListener(
        "click",
        () => {
          setShowing(
            "bridge"
          );

          playing =
            true;

          playStart =
            performance.now();

          applyProgress(
            0
          );
        }
      );

    document.getElementById("resetBtn")
      .addEventListener(
        "click",
        () => {
          playing =
            false;

          setShowing(
            "bridge"
          );

          applyProgress(
            0
          );
        }
      );

    progressSlider.addEventListener(
      "input",
      () => {
        playing =
          false;

        setShowing(
          "bridge"
        );

        applyProgress(
          Number(
            progressSlider.value
          )
        );
      }
    );

    // =========================================================
    // CAMERA
    // =========================================================

    let bodyView =
      true;

    let yaw =
      0;

    let pitch =
      THREE.MathUtils.degToRad(
        -7
      );

    function setBodyView() {
      bodyView =
        true;

      const visual =
        activeVisual();

      if (!visual) return;

      const b =
        getBounds(
          visual
        );

      camera.position.set(
        b.center.x + 1.5,
        b.box.min.y +
          b.size.y * 0.62,
        b.center.z + 3.0
      );

      camera.lookAt(
        b.center.x,
        b.box.min.y +
          b.size.y * 0.49,
        b.center.z
      );
    }

    function setFirstPerson() {
      bodyView =
        false;

      const visual =
        activeVisual();

      if (!visual) return;

      const b =
        getBounds(
          visual
        );

      camera.position.set(
        b.center.x,
        b.box.min.y +
          b.size.y * 0.925,
        b.center.z -
          b.size.z * 0.16
      );

      pitch =
        THREE.MathUtils.degToRad(
          -10
        );
    }

    function lookDown() {
      if (bodyView) {
        setFirstPerson();
      }

      pitch =
        THREE.MathUtils.degToRad(
          -66
        );

      statusEl.textContent =
        showing === "bridge"
          ? "LOOK DOWN - weighted bridge."
          : `LOOK DOWN - ${showing} reference.`;
    }

    document.getElementById("bodyViewBtn")
      .addEventListener(
        "click",
        () => {
          setBodyView();

          statusEl.textContent =
            showing === "bridge"
              ? "BODY VIEW - weighted bridge."
              : `BODY VIEW - ${showing} reference.`;
        }
      );

    document.getElementById("lookBtn")
      .addEventListener(
        "click",
        lookDown
      );

    let dragging =
      false;

    let lastX =
      0;

    let lastY =
      0;

    const sensitivity =
      0.004;

    function startDrag(x,y) {
      dragging =
        true;

      lastX =
        x;

      lastY =
        y;
    }

    function drag(x,y) {
      if (
        !dragging ||
        bodyView
      ) {
        return;
      }

      const dx =
        x - lastX;

      const dy =
        y - lastY;

      lastX =
        x;

      lastY =
        y;

      yaw -=
        dx * sensitivity;

      pitch -=
        dy * sensitivity;

      pitch =
        THREE.MathUtils.clamp(
          pitch,
          THREE.MathUtils.degToRad(-88),
          THREE.MathUtils.degToRad(70)
        );
    }

    function endDrag() {
      dragging =
        false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      e => {
        if (
          e.touches.length === 1
        ) {
          startDrag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive:false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      e => {
        if (
          e.touches.length === 1
        ) {
          e.preventDefault();

          drag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive:false }
    );

    renderer.domElement.addEventListener(
      "touchend",
      endDrag
    );

    renderer.domElement.addEventListener(
      "touchcancel",
      endDrag
    );

    const euler =
      new THREE.Euler(
        0,0,0,"YXZ"
      );

    // =========================================================
    // LOOP
    // =========================================================

    function animate(now) {
      requestAnimationFrame(
        animate
      );

      if (playing) {
        let p =
          (now - playStart) /
          PLAY_MS;

        if (p >= 1) {
          p =
            1;

          playing =
            false;
        }

        applyProgress(
          p
        );
      }

      if (!bodyView) {
        euler.set(
          pitch,
          yaw,
          0
        );

        camera.quaternion
          .setFromEuler(
            euler
          );
      }

      renderer.render(
        scene,
        camera
      );
    }

    animate();

    // =========================================================
    // SETUP
    // =========================================================

    async function setup() {
      statusEl.textContent =
        "Loading real male endpoint...";

      const maleGLTF =
        await loadGLB(
          "./adult-male-lod.glb"
        );

      statusEl.textContent =
        "Loading real female endpoint...";

      const femaleGLTF =
        await loadGLB(
          "./adult-female-lod.glb"
        );

      maleRoot =
        maleGLTF.scene;

      femaleRoot =
        femaleGLTF.scene;

      scene.add(
        maleRoot
      );

      scene.add(
        femaleRoot
      );

      normalizeModel(
        maleRoot,
        1.80
      );

      normalizeModel(
        femaleRoot,
        1.65
      );

      femaleBodyBounds =
        getBounds(femaleRoot);

      maleBones =
        collectBones(
          maleRoot
        );

      femaleBones =
        collectBones(
          femaleRoot
        );

      maleRoot.updateMatrixWorld(
        true
      );

      femaleRoot.updateMatrixWorld(
        true
      );

      statusEl.textContent =
        "Measuring male bone volumes...";

      maleVolumes =
        buildBoneVolumes(
          maleRoot,
          maleBones
        );

      statusEl.textContent =
        "Measuring female bone volumes...";

      femaleVolumes =
        buildBoneVolumes(
          femaleRoot,
          femaleBones
        );

      maleRoot.visible =
        false;

      femaleRoot.visible =
        false;

      await buildBridge();

      applyProgress(
        0
      );

      setShowing(
        "bridge"
      );

      loading.style.display =
        "none";

      statusEl.textContent =
        "V22 ready. Female topology starts in a male-shaped bridge, then transforms into a curvy athletic female endpoint: bigger chest, trim waist, moderate hips, not plus-size.";
    }

    setup().catch(
      fail
    );

    window.addEventListener(
      "resize",
      () => {
        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          Math.min(
            window.devicePixelRatio,
            2
          )
        );
      }
    );
  </script>
</body>
