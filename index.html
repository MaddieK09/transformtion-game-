<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game V15 - Rig Morph Prototype</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101217;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 620px;
      margin: auto;
      padding: 11px 13px;
      border-radius: 17px;
      color: white;
      background: rgba(0,0,0,0.66);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .debug {
      margin-top: 4px;
      font-size: 10px;
      opacity: 0.72;
      white-space: pre-line;
    }

    #controls {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      z-index: 30;
      max-height: 44vh;
      overflow: auto;
      border-radius: 18px;
      background: rgba(12,14,18,0.92);
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    #buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 11px;
      min-width: 96px;
      color: #111;
      background: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 800;
    }

    .controlRow {
      padding: 9px 2px;
      border-top: 1px solid rgba(255,255,255,0.09);
    }

    .labelLine {
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .value {
      opacity: 0.8;
      min-width: 44px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #101217;
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    #fatal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 25%;
      left: 15px;
      right: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #761c1c;
      color: white;
      font: 700 13px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="game"></div>
  <div id="loading">Loading V15 rig-morph prototypeâ¦</div>
  <div id="fatal"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game â V15 Shared-Rig Morph Prototype</div>
      <div id="status" class="status">Loading male and female rigsâ¦</div>
      <div id="debug" class="debug"></div>
    </div>
  </div>

  <div id="controls">
    <div id="buttons">
      <button id="bodyViewBtn">BODY VIEW</button>
      <button id="lookBtn">LOOK DOWN</button>
      <button id="resetBtn">RESET</button>
      <button id="playBtn">PLAY RIG MORPH</button>
    </div>

    <div class="controlRow">
      <div class="labelLine">
        <span>RIG TRANSFORMATION</span>
        <span id="progressValue" class="value">0%</span>
      </div>
      <input id="progressSlider" type="range" min="0" max="1" step="0.001" value="0">
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const loading = document.getElementById("loading");
    const fatal = document.getElementById("fatal");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const progressSlider = document.getElementById("progressSlider");
    const progressValue = document.getElementById("progressValue");

    function fail(error) {
      console.error(error);
      loading.style.display = "none";
      fatal.style.display = "block";
      fatal.textContent =
        "V15 ERROR\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nSend me a screenshot of this red box.";
    }

    window.addEventListener("error", e => {
      if (e.error) fail(e.error);
    });

    window.addEventListener("unhandledrejection", e => {
      fail(e.reason);
    });

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94d7f2);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.015,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById("game").appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x65727b, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(4, 8, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xdceaff, 1.0);
    fill.position.set(-4, 4, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xa2a5a8,
        roughness: 0.95
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function roomBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({ color, roughness: 0.88 })
      );
      mesh.position.set(x,y,z);
      mesh.scale.set(sx,sy,sz);
      scene.add(mesh);
    }

    roomBox(0, 1.5, -6, 10, 3, 0.2, 0xd8dde1);
    roomBox(-5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);
    roomBox(5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);

    // =========================================================
    // LOADING
    // =========================================================

    const loader = new GLTFLoader();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    }

    function getBounds(root) {
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      return { box, size, center };
    }

    function normalizeModel(root, targetHeight) {
      let b = getBounds(root);
      const scale = targetHeight / b.size.y;
      root.scale.multiplyScalar(scale);
      root.updateMatrixWorld(true);

      b = getBounds(root);

      root.position.x -= b.center.x;
      root.position.z -= b.center.z;
      root.position.y -= b.box.min.y;
      root.updateMatrixWorld(true);
    }

    // =========================================================
    // RIG MAPS
    // =========================================================

    function collectBones(root) {
      const map = new Map();

      root.traverse(obj => {
        if (obj.isBone && obj.name) {
          map.set(obj.name, obj);
        }
      });

      return map;
    }

    function cloneTransform(bone) {
      return {
        position: bone.position.clone(),
        quaternion: bone.quaternion.clone(),
        scale: bone.scale.clone()
      };
    }

    function collectRestTransforms(boneMap) {
      const out = new Map();

      for (const [name, bone] of boneMap) {
        out.set(name, cloneTransform(bone));
      }

      return out;
    }

    function lerpTransform(targetBone, a, b, t) {
      targetBone.position.lerpVectors(a.position, b.position, t);
      THREE.Quaternion.slerp(a.quaternion, b.quaternion, targetBone.quaternion, t);
      targetBone.scale.lerpVectors(a.scale, b.scale, t);
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    // =========================================================
    // MODELS
    // =========================================================

    let maleRoot;
    let femaleRoot;

    let maleBones;
    let femaleBones;

    let maleRest;
    let femaleRest;

    let sharedBoneNames = [];

    // We will DISPLAY ONLY the male mesh for this prototype.
    // Its real shared skeleton is gradually moved toward the female rig.
    //
    // That lets us physically test how far rig deformation alone can take
    // the male endpoint mesh before we build the surface bridge.
    let activeRoot;

    function setFemaleMorphInfluence(p) {
      if (!femaleRoot) return;

      femaleRoot.traverse(obj => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;
        if (!obj.morphTargetDictionary || !obj.morphTargetInfluences) return;

        for (const [name, idx] of Object.entries(obj.morphTargetDictionary)) {
          const n = name.toLowerCase();

          // During the final third, gently introduce body-shape morphs
          // on the hidden female reference model so we can later use
          // the same timing when we build the surface bridge.
          if (n.includes("skinny")) {
            obj.morphTargetInfluences[idx] = THREE.MathUtils.lerp(0.15, -0.10, p);
          } else if (n.includes("muscular")) {
            obj.morphTargetInfluences[idx] = THREE.MathUtils.lerp(0.12, 0.08, p);
          } else if (n.includes("obese")) {
            obj.morphTargetInfluences[idx] = THREE.MathUtils.lerp(-0.12, 0.20, p);
          }
        }
      });
    }

    function applyRigProgress(raw) {
      const t = smoothstep(THREE.MathUtils.clamp(raw, 0, 1));

      for (const name of sharedBoneNames) {
        const maleBone = maleBones.get(name);
        const a = maleRest.get(name);
        const b = femaleRest.get(name);

        if (!maleBone || !a || !b) continue;

        lerpTransform(maleBone, a, b, t);
      }

      // Global body height eases from male-normalized 1.80 to female-normalized 1.65.
      // We use Y scale only on the displayed model root, keeping X/Z untouched.
      const yScale = THREE.MathUtils.lerp(1.0, 1.65 / 1.80, t);
      maleRoot.scale.y = maleRoot.userData.baseScaleY * yScale;

      setFemaleMorphInfluence(t);

      progressSlider.value = String(raw);
      progressValue.textContent = Math.round(raw * 100) + "%";

      statusEl.textContent =
        `Shared-rig transformation â ${Math.round(raw * 100)}%`;
    }

    function resetRig() {
      playing = false;

      for (const name of sharedBoneNames) {
        const bone = maleBones.get(name);
        const a = maleRest.get(name);
        if (!bone || !a) continue;

        bone.position.copy(a.position);
        bone.quaternion.copy(a.quaternion);
        bone.scale.copy(a.scale);
      }

      maleRoot.scale.y = maleRoot.userData.baseScaleY;

      progressSlider.value = "0";
      progressValue.textContent = "0%";
      statusEl.textContent = "Rig reset to real male endpoint.";
    }

    progressSlider.addEventListener("input", () => {
      playing = false;
      applyRigProgress(Number(progressSlider.value));
    });

    // =========================================================
    // PLAYBACK
    // =========================================================

    let playing = false;
    let playStart = 0;
    const PLAY_MS = 12000;

    document.getElementById("playBtn")
      .addEventListener("click", () => {
        playing = true;
        playStart = performance.now();
        applyRigProgress(0);
      });

    document.getElementById("resetBtn")
      .addEventListener("click", resetRig);

    // =========================================================
    // CAMERA
    // =========================================================

    let bodyView = true;
    let yaw = 0;
    let pitch = THREE.MathUtils.degToRad(-7);

    function setBodyView() {
      bodyView = true;
      if (!activeRoot) return;

      const b = getBounds(activeRoot);

      camera.position.set(
        b.center.x + 1.5,
        b.box.min.y + b.size.y * 0.62,
        b.center.z + 3.0
      );

      camera.lookAt(
        b.center.x,
        b.box.min.y + b.size.y * 0.49,
        b.center.z
      );

      statusEl.textContent = "BODY VIEW â real male mesh, shared-rig deformation.";
    }

    function setFirstPerson() {
      bodyView = false;
      if (!activeRoot) return;

      const b = getBounds(activeRoot);

      camera.position.set(
        b.center.x,
        b.box.min.y + b.size.y * 0.925,
        b.center.z - b.size.z * 0.16
      );

      pitch = THREE.MathUtils.degToRad(-10);
      statusEl.textContent = "FIRST PERSON â rig morph active.";
    }

    function lookDown() {
      if (bodyView) setFirstPerson();
      pitch = THREE.MathUtils.degToRad(-66);
      statusEl.textContent = "LOOK DOWN â watch the rigged body deform.";
    }

    document.getElementById("bodyViewBtn")
      .addEventListener("click", setBodyView);

    document.getElementById("lookBtn")
      .addEventListener("click", lookDown);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const sensitivity = 0.004;

    function startDrag(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function drag(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      pitch -= dy * sensitivity;

      pitch = THREE.MathUtils.clamp(
        pitch,
        THREE.MathUtils.degToRad(-88),
        THREE.MathUtils.degToRad(70)
      );
    }

    function endDrag() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      e => {
        if (e.touches.length === 1) {
          startDrag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      e => {
        if (e.touches.length === 1) {
          e.preventDefault();
          drag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endDrag);
    renderer.domElement.addEventListener("touchcancel", endDrag);

    function setHeadVisibility(root, visible) {
      if (!root) return;

      root.traverse(obj => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;

        const n = (obj.name || "").toLowerCase();

        if (
          n.includes("head") ||
          n.includes("hair") ||
          n.includes("eye") ||
          n.includes("teeth")
        ) {
          obj.visible = visible;
        }
      });
    }

    const euler = new THREE.Euler(0,0,0,"YXZ");

    // =========================================================
    // LOOP
    // =========================================================

    function animate(now) {
      requestAnimationFrame(animate);

      if (playing) {
        let p = (now - playStart) / PLAY_MS;

        if (p >= 1) {
          p = 1;
          playing = false;
        }

        applyRigProgress(p);
      }

      if (!bodyView && activeRoot) {
        setHeadVisibility(activeRoot, false);
        euler.set(pitch, yaw, 0);
        camera.quaternion.setFromEuler(euler);
      } else if (activeRoot) {
        setHeadVisibility(activeRoot, true);
      }

      renderer.render(scene, camera);
    }

    animate();

    // =========================================================
    // SETUP
    // =========================================================

    async function setup() {
      statusEl.textContent = "Loading real male endpointâ¦";
      const maleGLTF = await loadGLB("./adult-male-lod.glb");

      statusEl.textContent = "Loading real female endpointâ¦";
      const femaleGLTF = await loadGLB("./adult-female-lod.glb");

      maleRoot = maleGLTF.scene;
      femaleRoot = femaleGLTF.scene;

      scene.add(maleRoot);
      scene.add(femaleRoot);

      normalizeModel(maleRoot, 1.80);
      normalizeModel(femaleRoot, 1.65);

      // Save normalized male root Y scale before animation alters it.
      maleRoot.userData.baseScaleY = maleRoot.scale.y;

      maleBones = collectBones(maleRoot);
      femaleBones = collectBones(femaleRoot);

      maleRest = collectRestTransforms(maleBones);
      femaleRest = collectRestTransforms(femaleBones);

      sharedBoneNames =
        [...maleBones.keys()]
        .filter(name => femaleBones.has(name));

      if (sharedBoneNames.length === 0) {
        throw new Error("No shared bone names found.");
      }

      // Female is reference-only for now.
      femaleRoot.visible = false;
      maleRoot.visible = true;
      activeRoot = maleRoot;

      debugEl.textContent =
        `shared bones: ${sharedBoneNames.length}\n` +
        `male bones: ${maleBones.size}\n` +
        `female bones: ${femaleBones.size}\n` +
        `display mesh: male endpoint only`;

      setBodyView();

      loading.style.display = "none";

      statusEl.textContent =
        "V15 ready. PLAY RIG MORPH deforms the real male mesh using the shared female rig.";

      applyRigProgress(0);
    }

    setup().catch(fail);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
