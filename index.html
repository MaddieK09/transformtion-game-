<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game V13 - Body Morph Controller</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101217;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 620px;
      margin: auto;
      padding: 11px 13px;
      border-radius: 17px;
      color: white;
      background: rgba(0,0,0,0.64);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .debug {
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.72;
      white-space: pre-line;
    }

    #controls {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      z-index: 30;
      max-height: 44vh;
      overflow: auto;
      border-radius: 18px;
      background: rgba(12,14,18,0.92);
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    #buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 11px;
      min-width: 96px;
      color: #111;
      background: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 800;
    }

    .controlRow {
      padding: 9px 2px;
      border-top: 1px solid rgba(255,255,255,0.09);
    }

    .controlRow:first-of-type {
      border-top: none;
    }

    .labelLine {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .value {
      opacity: 0.78;
      font-weight: 700;
      min-width: 44px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #101217;
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    #fatal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 25%;
      left: 15px;
      right: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #761c1c;
      color: white;
      font: 700 13px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="game"></div>
  <div id="loading">Loading V13 body morph controllerâ¦</div>
  <div id="fatal"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game â V13 Real Body Morph Controller</div>
      <div id="status" class="status">Loading the female body morph systemâ¦</div>
      <div id="debug" class="debug"></div>
    </div>
  </div>

  <div id="controls">
    <div id="buttons">
      <button id="bodyViewBtn">BODY VIEW</button>
      <button id="lookBtn">LOOK DOWN</button>
      <button id="resetBtn">RESET</button>
      <button id="playBtn">PLAY TEST MORPH</button>
    </div>

    <div class="controlRow">
      <div class="labelLine">
        <span>SKINNY</span>
        <span id="skinnyValue" class="value">0.00</span>
      </div>
      <input id="skinnySlider" type="range" min="-1" max="1" step="0.01" value="0">
    </div>

    <div class="controlRow">
      <div class="labelLine">
        <span>MUSCULAR</span>
        <span id="muscularValue" class="value">0.00</span>
      </div>
      <input id="muscularSlider" type="range" min="-1" max="1" step="0.01" value="0">
    </div>

    <div class="controlRow">
      <div class="labelLine">
        <span>OBESE</span>
        <span id="obeseValue" class="value">0.00</span>
      </div>
      <input id="obeseSlider" type="range" min="-1" max="1" step="0.01" value="0">
    </div>

    <div class="controlRow">
      <div class="labelLine">
        <span>TEST TRANSFORMATION PROGRESS</span>
        <span id="progressValue" class="value">0%</span>
      </div>
      <input id="progressSlider" type="range" min="0" max="1" step="0.001" value="0">
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const loading = document.getElementById("loading");
    const fatal = document.getElementById("fatal");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");

    const skinnySlider = document.getElementById("skinnySlider");
    const muscularSlider = document.getElementById("muscularSlider");
    const obeseSlider = document.getElementById("obeseSlider");
    const progressSlider = document.getElementById("progressSlider");

    const skinnyValue = document.getElementById("skinnyValue");
    const muscularValue = document.getElementById("muscularValue");
    const obeseValue = document.getElementById("obeseValue");
    const progressValue = document.getElementById("progressValue");

    function fail(error) {
      console.error(error);
      loading.style.display = "none";
      fatal.style.display = "block";
      fatal.textContent =
        "V13 ERROR\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nSend me a screenshot of this red box.";
    }

    window.addEventListener("error", e => {
      if (e.error) fail(e.error);
    });

    window.addEventListener("unhandledrejection", e => {
      fail(e.reason);
    });

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94d7f2);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.015,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.getElementById("game").appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x65727b, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(4, 8, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xdceaff, 1.0);
    fill.position.set(-4, 4, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xa2a5a8,
        roughness: 0.95
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function roomBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({ color, roughness: 0.88 })
      );

      mesh.position.set(x,y,z);
      mesh.scale.set(sx,sy,sz);
      scene.add(mesh);
    }

    roomBox(0, 1.5, -6, 10, 3, 0.2, 0xd8dde1);
    roomBox(-5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);
    roomBox(5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);

    // =========================================================
    // MODEL
    // =========================================================

    const loader = new GLTFLoader();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    }

    function bounds(root) {
      root.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      return { box, size, center };
    }

    function normalize(root, targetHeight = 1.65) {
      let b = bounds(root);

      const s = targetHeight / b.size.y;
      root.scale.multiplyScalar(s);
      root.updateMatrixWorld(true);

      b = bounds(root);

      root.position.x -= b.center.x;
      root.position.z -= b.center.z;
      root.position.y -= b.box.min.y;

      root.updateMatrixWorld(true);
    }

    let femaleRoot;

    // Each logical morph name can appear on several LOD meshes.
    const groupedMorphs = {
      skinny: [],
      muscular: [],
      obese: []
    };

    function normalizeMorphName(name) {
      return (name || "")
        .toLowerCase()
        .replace(/[^a-z]/g, "");
    }

    function collectGroupedMorphs(root) {
      groupedMorphs.skinny.length = 0;
      groupedMorphs.muscular.length = 0;
      groupedMorphs.obese.length = 0;

      root.traverse(obj => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;

        const dict = obj.morphTargetDictionary || {};
        const influences = obj.morphTargetInfluences || [];

        for (const [rawName, index] of Object.entries(dict)) {
          const name = normalizeMorphName(rawName);

          let group = null;

          if (name.includes("skinny")) group = "skinny";
          if (name.includes("muscular")) group = "muscular";
          if (name.includes("obese")) group = "obese";

          if (!group) continue;

          groupedMorphs[group].push({
            mesh: obj,
            index,
            influences,
            rawName
          });
        }
      });
    }

    function setGroupedMorph(group, value) {
      for (const item of groupedMorphs[group]) {
        item.influences[item.index] = value;
      }
    }

    function setShape(skinny, muscular, obese) {
      setGroupedMorph("skinny", skinny);
      setGroupedMorph("muscular", muscular);
      setGroupedMorph("obese", obese);

      skinnySlider.value = String(skinny);
      muscularSlider.value = String(muscular);
      obeseSlider.value = String(obese);

      skinnyValue.textContent = Number(skinny).toFixed(2);
      muscularValue.textContent = Number(muscular).toFixed(2);
      obeseValue.textContent = Number(obese).toFixed(2);
    }

    function updateManualShape() {
      const s = Number(skinnySlider.value);
      const m = Number(muscularSlider.value);
      const o = Number(obeseSlider.value);

      setGroupedMorph("skinny", s);
      setGroupedMorph("muscular", m);
      setGroupedMorph("obese", o);

      skinnyValue.textContent = s.toFixed(2);
      muscularValue.textContent = m.toFixed(2);
      obeseValue.textContent = o.toFixed(2);

      statusEl.textContent =
        `Manual body morph â skinny ${s.toFixed(2)}, muscular ${m.toFixed(2)}, obese ${o.toFixed(2)}`;
    }

    skinnySlider.addEventListener("input", updateManualShape);
    muscularSlider.addEventListener("input", updateManualShape);
    obeseSlider.addEventListener("input", updateManualShape);

    // =========================================================
    // TEST TRANSFORMATION CURVE
    // =========================================================
    //
    // This is NOT yet the male->female transformation.
    // It proves we can drive multiple REAL mesh morphs with
    // one smooth progress value.
    //
    // At 0%: slightly skinny/neutral
    // At 100%: fuller target build
    // =========================================================

    const testStart = {
      skinny: 0.35,
      muscular: 0.10,
      obese: -0.20
    };

    const testEnd = {
      skinny: -0.18,
      muscular: 0.12,
      obese: 0.34
    };

    function mix(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function applyProgress(raw) {
      const t = smoothstep(
        THREE.MathUtils.clamp(raw, 0, 1)
      );

      const skinny = mix(testStart.skinny, testEnd.skinny, t);
      const muscular = mix(testStart.muscular, testEnd.muscular, t);
      const obese = mix(testStart.obese, testEnd.obese, t);

      setShape(skinny, muscular, obese);

      progressSlider.value = String(raw);
      progressValue.textContent = Math.round(raw * 100) + "%";

      statusEl.textContent =
        `Real mesh transformation test â ${Math.round(raw * 100)}%`;
    }

    progressSlider.addEventListener("input", () => {
      playing = false;
      applyProgress(Number(progressSlider.value));
    });

    // =========================================================
    // AUTO PLAY
    // =========================================================

    let playing = false;
    let playStart = 0;
    const PLAY_MS = 10000;

    document.getElementById("playBtn")
      .addEventListener("click", () => {
        playing = true;
        playStart = performance.now();
        progressSlider.value = "0";
        applyProgress(0);
      });

    document.getElementById("resetBtn")
      .addEventListener("click", () => {
        playing = false;
        progressSlider.value = "0";
        progressValue.textContent = "0%";
        setShape(0,0,0);
        statusEl.textContent = "All grouped body morphs reset.";
      });

    // =========================================================
    // CAMERA
    // =========================================================

    let bodyView = true;
    let yaw = 0;
    let pitch = THREE.MathUtils.degToRad(-7);

    function setBodyView() {
      bodyView = true;
      if (!femaleRoot) return;

      const b = bounds(femaleRoot);

      camera.position.set(
        b.center.x + 1.5,
        b.box.min.y + b.size.y * 0.62,
        b.center.z + 3.0
      );

      camera.lookAt(
        b.center.x,
        b.box.min.y + b.size.y * 0.49,
        b.center.z
      );

      statusEl.textContent = "BODY VIEW â real female mesh.";
    }

    function setFirstPerson() {
      bodyView = false;
      if (!femaleRoot) return;

      const b = bounds(femaleRoot);

      camera.position.set(
        b.center.x,
        b.box.min.y + b.size.y * 0.925,
        b.center.z - b.size.z * 0.16
      );

      pitch = THREE.MathUtils.degToRad(-10);
      statusEl.textContent = "FIRST PERSON â drag to look.";
    }

    function lookDown() {
      if (bodyView) setFirstPerson();
      pitch = THREE.MathUtils.degToRad(-66);
      statusEl.textContent = "LOOK DOWN â real female body.";
    }

    document.getElementById("bodyViewBtn")
      .addEventListener("click", setBodyView);

    document.getElementById("lookBtn")
      .addEventListener("click", lookDown);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const sensitivity = 0.004;

    function startDrag(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function drag(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      pitch -= dy * sensitivity;

      pitch = THREE.MathUtils.clamp(
        pitch,
        THREE.MathUtils.degToRad(-88),
        THREE.MathUtils.degToRad(70)
      );
    }

    function endDrag() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      e => {
        if (e.touches.length === 1) {
          startDrag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      e => {
        if (e.touches.length === 1) {
          e.preventDefault();
          drag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endDrag);
    renderer.domElement.addEventListener("touchcancel", endDrag);

    function setHeadVisibility(root, visible) {
      if (!root) return;

      root.traverse(obj => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;

        const n = (obj.name || "").toLowerCase();

        if (
          n.includes("head") ||
          n.includes("hair") ||
          n.includes("eye") ||
          n.includes("teeth")
        ) {
          obj.visible = visible;
        }
      });
    }

    const euler = new THREE.Euler(0,0,0,"YXZ");

    // =========================================================
    // LOOP
    // =========================================================

    function animate(now) {
      requestAnimationFrame(animate);

      if (playing) {
        let p = (now - playStart) / PLAY_MS;

        if (p >= 1) {
          p = 1;
          playing = false;
        }

        applyProgress(p);
      }

      if (!bodyView && femaleRoot) {
        setHeadVisibility(femaleRoot, false);
        euler.set(pitch, yaw, 0);
        camera.quaternion.setFromEuler(euler);
      } else if (femaleRoot) {
        setHeadVisibility(femaleRoot, true);
      }

      renderer.render(scene, camera);
    }

    animate();

    // =========================================================
    // SETUP
    // =========================================================

    async function setup() {
      const gltf = await loadGLB("./adult-female-lod.glb");

      femaleRoot = gltf.scene;
      scene.add(femaleRoot);

      normalize(femaleRoot, 1.65);
      collectGroupedMorphs(femaleRoot);

      debugEl.textContent =
        `Skinny targets: ${groupedMorphs.skinny.length}\n` +
        `Muscular targets: ${groupedMorphs.muscular.length}\n` +
        `Obese targets: ${groupedMorphs.obese.length}\n` +
        `Total grouped targets: ${
          groupedMorphs.skinny.length +
          groupedMorphs.muscular.length +
          groupedMorphs.obese.length
        }`;

      setShape(0,0,0);
      setBodyView();

      loading.style.display = "none";
      statusEl.textContent =
        "V13 ready. Three repeated LOD morphs are now controlled as one body shape.";
    }

    setup().catch(fail);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
