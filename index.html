<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game V11 - Real Human Models</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101217;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 560px;
      margin: auto;
      padding: 11px 13px;
      border-radius: 17px;
      color: white;
      background: rgba(0,0,0,0.64);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .debug {
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.72;
      white-space: pre-line;
    }

    #bottomUI {
      position: fixed;
      left: 7px;
      right: 7px;
      bottom: calc(env(safe-area-inset-bottom) + 9px);
      z-index: 30;
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 12px 13px;
      min-width: 102px;
      color: #111;
      background: rgba(255,255,255,0.94);
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 6px 20px rgba(0,0,0,0.26);
    }

    button:active {
      transform: scale(0.97);
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #101217;
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    #fatal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 26%;
      left: 15px;
      right: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #761c1c;
      color: white;
      font: 700 13px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="loading">
    Loading the real male + female GLB modelsâ¦
  </div>

  <div id="fatal"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game â V11 Real Human Models</div>
      <div id="status" class="status">Loading real GLB humansâ¦</div>
      <div id="debug" class="debug"></div>
    </div>
  </div>

  <div id="bottomUI">
    <button id="bodyViewBtn">BODY VIEW</button>
    <button id="lookBtn">LOOK DOWN</button>
    <button id="maleBtn">MALE</button>
    <button id="femaleBtn">FEMALE</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const loading = document.getElementById("loading");
    const fatal = document.getElementById("fatal");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");

    function fail(error) {
      console.error(error);
      loading.style.display = "none";
      fatal.style.display = "block";
      fatal.textContent =
        "V11 ERROR\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nSend me a screenshot of this red box.";
    }

    window.addEventListener("error", e => {
      if (e.error) fail(e.error);
    });

    window.addEventListener("unhandledrejection", e => {
      fail(e.reason);
    });

    // =========================================================
    // THREE.JS SETUP
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94d7f2);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.015,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.getElementById("game").appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x64707a, 2.5);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffffff, 3.0);
    key.position.set(4, 8, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xd8e7ff, 1.3);
    fill.position.set(-4, 3, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0x9ea2a5,
        roughness: 0.94
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Simple room reference objects.
    function box(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({ color, roughness: 0.88 })
      );
      mesh.position.set(x,y,z);
      mesh.scale.set(sx,sy,sz);
      scene.add(mesh);
    }

    box(0, 1.5, -6, 10, 3, 0.2, 0xd8dde1);
    box(-5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);
    box(5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);

    // =========================================================
    // MODEL LOADING
    // =========================================================

    const loader = new GLTFLoader();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        loader.load(
          url,
          gltf => resolve(gltf),
          undefined,
          reject
        );
      });
    }

    function getBounds(object) {
      object.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(object);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      return { box, size, center };
    }

    function normalizeModel(root, targetHeight = 1.75) {
      root.updateMatrixWorld(true);

      let data = getBounds(root);

      if (!isFinite(data.size.y) || data.size.y <= 0.001) {
        throw new Error("Model bounding box height is invalid.");
      }

      const scale = targetHeight / data.size.y;
      root.scale.multiplyScalar(scale);

      root.updateMatrixWorld(true);
      data = getBounds(root);

      // Center left/right and move feet to y=0.
      root.position.x -= data.center.x;
      root.position.z -= data.center.z;
      root.position.y -= data.box.min.y;

      root.updateMatrixWorld(true);

      return getBounds(root);
    }

    function makeMaterialsOpaque(root) {
      root.traverse(obj => {
        if (!obj.isMesh) return;

        obj.frustumCulled = false;

        const materials = Array.isArray(obj.material)
          ? obj.material
          : [obj.material];

        for (const mat of materials) {
          if (!mat) continue;
          mat.transparent = false;
          mat.opacity = 1;
          mat.depthWrite = true;
          mat.side = THREE.FrontSide;
          mat.needsUpdate = true;
        }
      });
    }

    function collectStats(root) {
      const rows = [];

      root.traverse(obj => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;

        const geometry = obj.geometry;
        const pos = geometry?.attributes?.position;
        const morphCount =
          geometry?.morphAttributes?.position?.length || 0;

        rows.push({
          name: obj.name || "(unnamed)",
          skinned: !!obj.isSkinnedMesh,
          vertices: pos?.count || 0,
          morphTargets: morphCount
        });
      });

      return rows;
    }

    function topologySignature(stats) {
      return stats
        .map(x => `${x.vertices}:${x.morphTargets}`)
        .sort()
        .join("|");
    }

    let maleRoot;
    let femaleRoot;
    let maleBounds;
    let femaleBounds;

    let activeRoot = null;
    let currentSex = "male";

    let maleStats = [];
    let femaleStats = [];
    let likelyCompatible = false;

    async function setupModels() {
      statusEl.textContent = "Loading adult-male-lod.glbâ¦";
      const maleGLTF = await loadGLB("./adult-male-lod.glb");

      statusEl.textContent = "Loading adult-female-lod.glbâ¦";
      const femaleGLTF = await loadGLB("./adult-female-lod.glb");

      maleRoot = maleGLTF.scene;
      femaleRoot = femaleGLTF.scene;

      maleRoot.name = "MaleRealHuman";
      femaleRoot.name = "FemaleRealHuman";

      scene.add(maleRoot);
      scene.add(femaleRoot);

      makeMaterialsOpaque(maleRoot);
      makeMaterialsOpaque(femaleRoot);

      maleBounds = normalizeModel(maleRoot, 1.80);
      femaleBounds = normalizeModel(femaleRoot, 1.65);

      maleStats = collectStats(maleRoot);
      femaleStats = collectStats(femaleRoot);

      likelyCompatible =
        topologySignature(maleStats) === topologySignature(femaleStats);

      femaleRoot.visible = false;
      maleRoot.visible = true;
      activeRoot = maleRoot;

      setBodyView();

      loading.style.display = "none";

      statusEl.textContent =
        "REAL GLB HUMANS LOADED. Start by checking BODY VIEW.";

      const maleVerts = maleStats.reduce((n, x) => n + x.vertices, 0);
      const femaleVerts = femaleStats.reduce((n, x) => n + x.vertices, 0);
      const maleMorphs = maleStats.reduce((n, x) => n + x.morphTargets, 0);
      const femaleMorphs = femaleStats.reduce((n, x) => n + x.morphTargets, 0);

      debugEl.textContent =
        `male meshes ${maleStats.length} â¢ vertices ${maleVerts} â¢ morph targets ${maleMorphs}\n` +
        `female meshes ${femaleStats.length} â¢ vertices ${femaleVerts} â¢ morph targets ${femaleMorphs}\n` +
        `same raw topology signature: ${likelyCompatible ? "YES" : "NO"}`;

      console.log("MALE MODEL STATS", maleStats);
      console.log("FEMALE MODEL STATS", femaleStats);
      console.log("SAME TOPOLOGY SIGNATURE?", likelyCompatible);
    }

    // =========================================================
    // MODEL SWITCHING
    // =========================================================

    function showMale() {
      currentSex = "male";
      maleRoot.visible = true;
      femaleRoot.visible = false;
      activeRoot = maleRoot;

      statusEl.textContent = "Real adult male model.";

      if (!bodyView) setFirstPerson();
    }

    function showFemale() {
      currentSex = "female";
      maleRoot.visible = false;
      femaleRoot.visible = true;
      activeRoot = femaleRoot;

      statusEl.textContent = "Real adult female model.";

      if (!bodyView) setFirstPerson();
    }

    document.getElementById("maleBtn").addEventListener("click", showMale);
    document.getElementById("femaleBtn").addEventListener("click", showFemale);

    // =========================================================
    // CAMERA
    // =========================================================

    let bodyView = true;
    let yaw = 0;
    let pitch = THREE.MathUtils.degToRad(-6);

    const bodyTarget = new THREE.Vector3();

    function activeBounds() {
      if (!activeRoot) return null;
      return getBounds(activeRoot);
    }

    function setBodyView() {
      bodyView = true;

      if (!activeRoot) return;

      const b = activeBounds();

      camera.position.set(
        b.center.x + 1.55,
        b.box.min.y + b.size.y * 0.62,
        b.center.z + 3.0
      );

      bodyTarget.set(
        b.center.x,
        b.box.min.y + b.size.y * 0.49,
        b.center.z
      );

      camera.lookAt(bodyTarget);

      statusEl.textContent =
        currentSex === "male"
          ? "BODY VIEW â real adult male model."
          : "BODY VIEW â real adult female model.";
    }

    function setFirstPerson() {
      bodyView = false;

      if (!activeRoot) return;

      const b = activeBounds();

      // Estimate eye position from model bounds.
      const eyeY = b.box.min.y + b.size.y * 0.925;

      camera.position.set(
        b.center.x,
        eyeY,
        b.center.z - b.size.z * 0.16
      );

      pitch = THREE.MathUtils.degToRad(-10);

      statusEl.textContent =
        "FIRST PERSON â drag to look, or press LOOK DOWN.";
    }

    function setLookDown() {
      if (!activeRoot) return;

      if (bodyView) {
        setFirstPerson();
      }

      pitch = THREE.MathUtils.degToRad(-66);

      statusEl.textContent =
        "LOOK DOWN â inspecting the real model from estimated eye height.";
    }

    document.getElementById("bodyViewBtn")
      .addEventListener("click", setBodyView);

    document.getElementById("lookBtn")
      .addEventListener("click", setLookDown);

    // =========================================================
    // DRAG LOOK
    // =========================================================

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    const sensitivity = 0.004;

    function startDrag(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function drag(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      pitch -= dy * sensitivity;

      pitch = THREE.MathUtils.clamp(
        pitch,
        THREE.MathUtils.degToRad(-88),
        THREE.MathUtils.degToRad(70)
      );
    }

    function endDrag() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      e => {
        if (e.touches.length === 1) {
          startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      e => {
        if (e.touches.length === 1) {
          e.preventDefault();
          drag(e.touches[0].clientX, e.touches[0].clientY);
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endDrag);
    renderer.domElement.addEventListener("touchcancel", endDrag);

    // =========================================================
    // FIRST-PERSON HEAD HIDING
    // =========================================================

    function setHeadVisibility(root, visible) {
      if (!root) return;

      root.traverse(obj => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;

        const n = (obj.name || "").toLowerCase();

        // Only hide meshes explicitly named like head/hair/eyes in first person.
        if (
          n.includes("head") ||
          n.includes("hair") ||
          n.includes("eye") ||
          n.includes("teeth")
        ) {
          obj.visible = visible;
        }
      });
    }

    // =========================================================
    // LOOP
    // =========================================================

    const euler = new THREE.Euler(0, 0, 0, "YXZ");

    function animate() {
      requestAnimationFrame(animate);

      if (!bodyView && activeRoot) {
        setHeadVisibility(maleRoot, currentSex !== "male");
        setHeadVisibility(femaleRoot, currentSex !== "female");

        euler.set(pitch, yaw, 0);
        camera.quaternion.setFromEuler(euler);
      } else {
        if (maleRoot) setHeadVisibility(maleRoot, true);
        if (femaleRoot) setHeadVisibility(femaleRoot, true);
      }

      renderer.render(scene, camera);
    }

    animate();

    setupModels().catch(fail);

    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
