<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game Prototype V9</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 9px);
      left: 9px;
      right: 9px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 500px;
      margin: 0 auto;
      padding: 10px 13px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.57);
      color: white;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .status {
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .bar {
      margin-top: 8px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
    }

    #barFill {
      width: 0%;
      height: 100%;
      background: white;
      border-radius: 999px;
    }

    #bottomUI {
      position: fixed;
      left: 7px;
      right: 7px;
      bottom: calc(env(safe-area-inset-bottom) + 9px);
      z-index: 30;
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 12px 13px;
      font-size: 14px;
      font-weight: 800;
      color: #111;
      background: white;
      min-width: 108px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    button:active {
      transform: scale(0.97);
    }

    button.secondary {
      background: rgba(255,255,255,0.85);
      min-width: 94px;
    }

    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 76px);
      left: 8px;
      right: 8px;
      text-align: center;
      color: rgba(255,255,255,0.92);
      font-size: 12px;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 5px rgba(0,0,0,0.7);
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game - V9 Morph Target Humanoid</div>
      <div id="status" class="status">
        Starter form. V9 uses real vertex morph targets instead of blobs.
      </div>
      <div class="bar">
        <div id="barFill"></div>
      </div>
    </div>
  </div>

  <div id="hint">
    V9: human-shaped mesh parts with vertex-level morphing
  </div>

  <div id="bottomUI">
    <button id="lookBtn" class="secondary">LOOK DOWN</button>
    <button id="viewBtn" class="secondary">BODY VIEW</button>
    <button id="transformBtn">TRANSFORM</button>
    <button id="resetBtn" class="secondary">RESET</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    // =========================================================
    // ENGINE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x91d5f4);

    const camera = new THREE.PerspectiveCamera(
      68,
      window.innerWidth / window.innerHeight,
      0.025,
      150
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = false;

    document.getElementById("game").appendChild(renderer.domElement);

    // =========================================================
    // ROOM
    // =========================================================

    scene.add(new THREE.HemisphereLight(0xffffff, 0x53616e, 2.15));

    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(4, 9, 4);
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({
        color: 0x92979c,
        roughness: 0.95
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function worldBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.84
        })
      );

      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      scene.add(mesh);
      return mesh;
    }

    worldBox(0, 1.5, -6.3, 10, 3, 0.22, 0xdce0e3);
    worldBox(-5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);
    worldBox(5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);

    worldBox(-2.6, 0.45, -3.5, 1.45, 0.9, 0.75, 0x9b7755);
    worldBox(2.6, 0.88, -3.9, 0.72, 1.76, 0.72, 0x6d7c8f);

    // =========================================================
    // PLAYER RIG
    // =========================================================

    const player = new THREE.Group();
    player.position.set(0, 0, 2.6);
    scene.add(player);

    const yawRoot = new THREE.Group();
    player.add(yawRoot);

    const bodyRoot = new THREE.Group();
    yawRoot.add(bodyRoot);

    // =========================================================
    // MATERIALS
    // =========================================================

    const skinMaterial = new THREE.MeshStandardMaterial({
      color: 0xd6a079,
      roughness: 0.72
    });

    const torsoMaterial = new THREE.MeshStandardMaterial({
      color: 0x41618f,
      roughness: 0.84
    });

    const lowerMaterial = new THREE.MeshStandardMaterial({
      color: 0x222b37,
      roughness: 0.90
    });

    const shoeMaterial = new THREE.MeshStandardMaterial({
      color: 0x161616,
      roughness: 0.96
    });

    // =========================================================
    // PROFILE DATA
    // =========================================================

    const starter = {
      height: 1.80,
      eyeHeight: 1.69,

      torsoHeight: 0.66,
      shoulderW: 0.46,
      upperChestW: 0.42,
      chestW: 0.39,
      ribW: 0.35,
      waistW: 0.30,
      highHipW: 0.34,
      hipW: 0.37,
      lowHipW: 0.31,

      shoulderD: 0.20,
      chestD: 0.22,
      ribD: 0.20,
      waistD: 0.18,
      highHipD: 0.22,
      hipD: 0.25,
      lowHipD: 0.22,

      chestFront: 0.018,
      bellyFront: 0.012,
      gluteBack: 0.035,

      upperArmLength: 0.32,
      forearmLength: 0.29,
      upperArmTop: 0.060,
      upperArmBottom: 0.050,
      forearmTop: 0.048,
      forearmBottom: 0.038,

      handW: 0.090,
      handH: 0.145,
      handD: 0.046,

      thighLength: 0.43,
      shinLength: 0.40,
      thighTop: 0.102,
      thighBottom: 0.074,
      shinTop: 0.072,
      shinBottom: 0.050,

      footW: 0.135,
      footH: 0.080,
      footL: 0.270,

      neckW: 0.115,
      neckD: 0.105,
      headW: 0.155,
      headH: 0.205,
      headD: 0.165,

      skin: new THREE.Color(0xd6a079),
      torsoColor: new THREE.Color(0x41618f),
      lowerColor: new THREE.Color(0x222b37)
    };

    const target = {
      height: 1.55,
      eyeHeight: 1.45,

      torsoHeight: 0.61,
      shoulderW: 0.385,
      upperChestW: 0.365,
      chestW: 0.37,
      ribW: 0.31,
      waistW: 0.255,
      highHipW: 0.42,
      hipW: 0.47,
      lowHipW: 0.39,

      shoulderD: 0.18,
      chestD: 0.245,
      ribD: 0.19,
      waistD: 0.17,
      highHipD: 0.28,
      hipD: 0.32,
      lowHipD: 0.29,

      chestFront: 0.070,
      bellyFront: 0.020,
      gluteBack: 0.085,

      upperArmLength: 0.29,
      forearmLength: 0.265,
      upperArmTop: 0.050,
      upperArmBottom: 0.042,
      forearmTop: 0.041,
      forearmBottom: 0.033,

      handW: 0.082,
      handH: 0.126,
      handD: 0.042,

      thighLength: 0.39,
      shinLength: 0.365,
      thighTop: 0.126,
      thighBottom: 0.087,
      shinTop: 0.079,
      shinBottom: 0.048,

      footW: 0.126,
      footH: 0.074,
      footL: 0.245,

      neckW: 0.102,
      neckD: 0.094,
      headW: 0.145,
      headH: 0.194,
      headD: 0.154,

      skin: new THREE.Color(0xb87555),
      torsoColor: new THREE.Color(0x914188),
      lowerColor: new THREE.Color(0x2a2230)
    };

    function mix(a, b, t) {
      return a + (b - a) * t;
    }

    // =========================================================
    // MORPH-TARGET HELPERS
    // =========================================================

    function makeMorphSphere(startDims, targetDims, material, segments = 24) {
      const geometry = new THREE.SphereGeometry(0.5, segments, 18);
      const base = geometry.attributes.position;
      const targetArray = new Float32Array(base.count * 3);

      for (let i = 0; i < base.count; i++) {
        const x = base.getX(i);
        const y = base.getY(i);
        const z = base.getZ(i);

        targetArray[i * 3 + 0] = x * targetDims.x;
        targetArray[i * 3 + 1] = y * targetDims.y;
        targetArray[i * 3 + 2] = z * targetDims.z;
      }

      for (let i = 0; i < base.count; i++) {
        base.setXYZ(
          i,
          base.getX(i) * startDims.x,
          base.getY(i) * startDims.y,
          base.getZ(i) * startDims.z
        );
      }

      geometry.morphAttributes.position = [
        new THREE.Float32BufferAttribute(targetArray, 3)
      ];

      const mesh = new THREE.Mesh(geometry, material);
      mesh.morphTargetInfluences[0] = 0;

      return mesh;
    }

    function makeMorphCylinder(start, target, material, radial = 20) {
      // Build normalized cylinder, then map each vertex to start/target shape.
      const geometry = new THREE.CylinderGeometry(
        1, 1, 1,
        radial, 6,
        false
      );

      const base = geometry.attributes.position;
      const targetArray = new Float32Array(base.count * 3);

      for (let i = 0; i < base.count; i++) {
        const x = base.getX(i);
        const y = base.getY(i);
        const z = base.getZ(i);

        const u = y + 0.5; // 0 bottom -> 1 top

        const sr = mix(start.bottomR, start.topR, u);
        const tr = mix(target.bottomR, target.topR, u);

        base.setXYZ(
          i,
          x * sr,
          y * start.length,
          z * sr
        );

        targetArray[i * 3 + 0] = x * tr;
        targetArray[i * 3 + 1] = y * target.length;
        targetArray[i * 3 + 2] = z * tr;
      }

      geometry.morphAttributes.position = [
        new THREE.Float32BufferAttribute(targetArray, 3)
      ];

      const mesh = new THREE.Mesh(geometry, material);
      mesh.morphTargetInfluences[0] = 0;

      return mesh;
    }

    function buildTorsoGeometry(profile) {
      const rings = [
        { y: 0.00, w: profile.lowHipW, d: profile.lowHipD },
        { y: 0.08, w: profile.hipW * 0.94, d: profile.hipD * 0.95 },
        { y: 0.17, w: profile.hipW, d: profile.hipD },
        { y: 0.28, w: profile.highHipW, d: profile.highHipD },
        { y: 0.40, w: profile.waistW * 1.04, d: profile.waistD * 1.03 },
        { y: 0.50, w: profile.waistW, d: profile.waistD },
        { y: 0.61, w: profile.ribW, d: profile.ribD },
        { y: 0.71, w: profile.chestW * 0.95, d: profile.chestD },
        { y: 0.80, w: profile.chestW, d: profile.chestD },
        { y: 0.89, w: profile.upperChestW, d: profile.shoulderD },
        { y: 0.96, w: profile.shoulderW * 0.92, d: profile.shoulderD * 0.95 },
        { y: 1.00, w: profile.neckW * 1.25, d: profile.neckD * 1.20 }
      ];

      const radial = 32;
      const vertices = [];
      const indices = [];
      const uvs = [];

      for (let r = 0; r < rings.length; r++) {
        const ring = rings[r];

        for (let i = 0; i < radial; i++) {
          const a = (i / radial) * Math.PI * 2;
          const c = Math.cos(a);
          const s = Math.sin(a);

          let x = c * ring.w * 0.5;
          let z = s * ring.d * 0.5;

          const front = Math.max(0, -s);
          const back = Math.max(0, s);

          if (ring.y >= 0.68 && ring.y <= 0.88) {
            z -= profile.chestFront * front;
          }

          if (ring.y >= 0.36 && ring.y <= 0.60) {
            z -= profile.bellyFront * front;
          }

          if (ring.y <= 0.28) {
            z += profile.gluteBack * back;
          }

          vertices.push(
            x,
            ring.y * profile.torsoHeight,
            z
          );

          uvs.push(i / radial, ring.y);
        }
      }

      for (let r = 0; r < rings.length - 1; r++) {
        for (let i = 0; i < radial; i++) {
          const next = (i + 1) % radial;

          const a = r * radial + i;
          const b = r * radial + next;
          const c = (r + 1) * radial + i;
          const d = (r + 1) * radial + next;

          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(vertices, 3)
      );

      geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(uvs, 2)
      );

      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return geometry;
    }

    function makeMorphTorso(start, target, material) {
      const startGeo = buildTorsoGeometry(start);
      const targetGeo = buildTorsoGeometry(target);

      const targetPos = targetGeo.attributes.position;

      startGeo.morphAttributes.position = [
        new THREE.Float32BufferAttribute(
          targetPos.array.slice(),
          3
        )
      ];

      const mesh = new THREE.Mesh(startGeo, material);
      mesh.morphTargetInfluences[0] = 0;

      targetGeo.dispose();

      return mesh;
    }

    // =========================================================
    // BODY CONSTRUCTION
    // =========================================================

    const torso = makeMorphTorso(starter, target, torsoMaterial);
    bodyRoot.add(torso);
    torso.position.set(0, 0.83, 0.035);

    const neck = makeMorphCylinder(
      {
        topR: starter.neckW * 0.48,
        bottomR: starter.neckW * 0.58,
        length: 0.115
      },
      {
        topR: target.neckW * 0.48,
        bottomR: target.neckW * 0.58,
        length: 0.105
      },
      skinMaterial
    );
    bodyRoot.add(neck);

    const head = makeMorphSphere(
      new THREE.Vector3(starter.headW, starter.headH, starter.headD),
      new THREE.Vector3(target.headW, target.headH, target.headD),
      skinMaterial,
      28
    );
    bodyRoot.add(head);

    function createArm(sign) {
      const group = new THREE.Group();
      bodyRoot.add(group);

      const upper = makeMorphCylinder(
        {
          topR: starter.upperArmTop,
          bottomR: starter.upperArmBottom,
          length: starter.upperArmLength
        },
        {
          topR: target.upperArmTop,
          bottomR: target.upperArmBottom,
          length: target.upperArmLength
        },
        skinMaterial
      );

      const forearm = makeMorphCylinder(
        {
          topR: starter.forearmTop,
          bottomR: starter.forearmBottom,
          length: starter.forearmLength
        },
        {
          topR: target.forearmTop,
          bottomR: target.forearmBottom,
          length: target.forearmLength
        },
        skinMaterial
      );

      const hand = makeMorphSphere(
        new THREE.Vector3(starter.handW, starter.handH, starter.handD),
        new THREE.Vector3(target.handW, target.handH, target.handD),
        skinMaterial,
        20
      );

      group.add(upper, forearm, hand);

      return { sign, group, upper, forearm, hand };
    }

    const leftArm = createArm(-1);
    const rightArm = createArm(1);

    function createLeg(sign) {
      const group = new THREE.Group();
      bodyRoot.add(group);

      const thigh = makeMorphCylinder(
        {
          topR: starter.thighTop,
          bottomR: starter.thighBottom,
          length: starter.thighLength
        },
        {
          topR: target.thighTop,
          bottomR: target.thighBottom,
          length: target.thighLength
        },
        lowerMaterial,
        22
      );

      const shin = makeMorphCylinder(
        {
          topR: starter.shinTop,
          bottomR: starter.shinBottom,
          length: starter.shinLength
        },
        {
          topR: target.shinTop,
          bottomR: target.shinBottom,
          length: target.shinLength
        },
        lowerMaterial,
        22
      );

      const foot = makeMorphSphere(
        new THREE.Vector3(starter.footW, starter.footH, starter.footL),
        new THREE.Vector3(target.footW, target.footH, target.footL),
        shoeMaterial,
        20
      );

      group.add(thigh, shin, foot);

      return { sign, group, thigh, shin, foot };
    }

    const leftLeg = createLeg(-1);
    const rightLeg = createLeg(1);

    // =========================================================
    // APPLY MORPH
    // =========================================================

    function applyMorph(p) {
      const t = THREE.MathUtils.clamp(p, 0, 1);

      torso.morphTargetInfluences[0] = t;
      neck.morphTargetInfluences[0] = t;
      head.morphTargetInfluences[0] = t;

      for (const arm of [leftArm, rightArm]) {
        arm.upper.morphTargetInfluences[0] = t;
        arm.forearm.morphTargetInfluences[0] = t;
        arm.hand.morphTargetInfluences[0] = t;
      }

      for (const leg of [leftLeg, rightLeg]) {
        leg.thigh.morphTargetInfluences[0] = t;
        leg.shin.morphTargetInfluences[0] = t;
        leg.foot.morphTargetInfluences[0] = t;
      }

      // Colors
      skinMaterial.color.copy(starter.skin).lerp(target.skin, t);
      torsoMaterial.color.copy(starter.torsoColor).lerp(target.torsoColor, t);
      lowerMaterial.color.copy(starter.lowerColor).lerp(target.lowerColor, t);

      // Torso stays anchored near pelvis.
      torso.position.y = mix(0.83, 0.78, t);

      // Neck and head.
      const torsoTop =
        torso.position.y +
        mix(starter.torsoHeight, target.torsoHeight, t);

      neck.position.set(
        0,
        torsoTop + 0.050,
        -0.005
      );

      head.position.set(
        0,
        torsoTop + 0.165,
        0.005
      );

      // Arms.
      const shoulderW = mix(starter.shoulderW, target.shoulderW, t);
      const upperArmLength = mix(starter.upperArmLength, target.upperArmLength, t);
      const forearmLength = mix(starter.forearmLength, target.forearmLength, t);

      for (const arm of [leftArm, rightArm]) {
        const sx = arm.sign * shoulderW * 0.54;

        arm.upper.position.set(
          sx,
          torsoTop - 0.055 - upperArmLength * 0.50,
          0.015
        );

        arm.forearm.position.set(
          sx + arm.sign * 0.012,
          torsoTop - 0.055 - upperArmLength - forearmLength * 0.50,
          0.002
        );

        arm.hand.position.set(
          sx + arm.sign * 0.018,
          torsoTop - 0.055 - upperArmLength - forearmLength - mix(starter.handH, target.handH, t) * 0.45,
          -0.008
        );
      }

      // Legs.
      const hipW = mix(starter.hipW, target.hipW, t);
      const thighLength = mix(starter.thighLength, target.thighLength, t);
      const shinLength = mix(starter.shinLength, target.shinLength, t);

      for (const leg of [leftLeg, rightLeg]) {
        const lx = leg.sign * hipW * 0.21;

        leg.thigh.position.set(
          lx,
          torso.position.y - thighLength * 0.50 + 0.015,
          0.020
        );

        leg.shin.position.set(
          lx,
          torso.position.y - thighLength - shinLength * 0.50 + 0.015,
          0.010
        );

        leg.foot.position.set(
          lx,
          0.055,
          -mix(starter.footL, target.footL, t) * 0.25
        );
      }
    }

    // =========================================================
    // CAMERA
    // =========================================================

    const cameraPivot = new THREE.Group();
    yawRoot.add(cameraPivot);
    cameraPivot.add(camera);

    let yaw = 0;
    let pitch = -0.10;
    let bodyView = false;

    const sensitivity = 0.0040;

    const minPitch = THREE.MathUtils.degToRad(-89);
    const maxPitch = THREE.MathUtils.degToRad(70);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    function updateFirstPersonCamera(t) {
      const eyeHeight = mix(starter.eyeHeight, target.eyeHeight, t);

      cameraPivot.position.set(
        0,
        eyeHeight,
        -0.11
      );
    }

    function setPitch(value) {
      pitch = THREE.MathUtils.clamp(value, minPitch, maxPitch);
    }

    function beginLook(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function moveLook(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      setPitch(pitch - dy * sensitivity);
    }

    function endLook() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      (e) => {
        if (e.touches.length === 1) {
          beginLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      (e) => {
        if (e.touches.length === 1) {
          e.preventDefault();
          moveLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endLook);
    renderer.domElement.addEventListener("touchcancel", endLook);

    renderer.domElement.addEventListener(
      "mousedown",
      (e) => beginLook(e.clientX, e.clientY)
    );

    window.addEventListener(
      "mousemove",
      (e) => moveLook(e.clientX, e.clientY)
    );

    window.addEventListener("mouseup", endLook);

    document.getElementById("lookBtn").addEventListener(
      "click",
      () => {
        bodyView = false;
        document.getElementById("viewBtn").textContent = "BODY VIEW";
        setPitch(THREE.MathUtils.degToRad(-68));
      }
    );

    document.getElementById("viewBtn").addEventListener(
      "click",
      () => {
        bodyView = !bodyView;

        document.getElementById("viewBtn").textContent =
          bodyView ? "FIRST PERSON" : "BODY VIEW";

        status.textContent =
          bodyView
            ? "Body view active. Inspect the actual morph-target humanoid."
            : "First person restored. Use LOOK DOWN to inspect your body.";
      }
    );

    // =========================================================
    // TRANSFORMATION
    // =========================================================

    let progress = 0;
    let transforming = false;
    let transformStart = 0;

    const TRANSFORM_MS = 30000;

    const status = document.getElementById("status");
    const barFill = document.getElementById("barFill");
    const transformBtn = document.getElementById("transformBtn");

    function startTransformation() {
      if (transforming || progress >= 1) return;

      transforming = true;
      transformStart =
        performance.now() - progress * TRANSFORM_MS;

      transformBtn.textContent = "TRANSFORMING";

      status.textContent =
        "Transformation started. Real mesh vertices are morphing toward the target.";
    }

    function resetTransformation() {
      transforming = false;
      progress = 0;

      applyMorph(0);
      updateFirstPersonCamera(0);

      transformBtn.textContent = "TRANSFORM";
      barFill.style.width = "0%";

      status.textContent =
        "Starter form restored. V9 uses real vertex morph targets instead of blobs.";
    }

    transformBtn.addEventListener("click", startTransformation);
    document.getElementById("resetBtn").addEventListener("click", resetTransformation);

    // =========================================================
    // LOOP
    // =========================================================

    applyMorph(0);
    updateFirstPersonCamera(0);

    function animate(now) {
      requestAnimationFrame(animate);

      yawRoot.rotation.y = yaw;

      if (transforming) {
        progress =
          (now - transformStart) / TRANSFORM_MS;

        progress = THREE.MathUtils.clamp(
          progress,
          0,
          1
        );

        const smooth =
          progress * progress * (3 - 2 * progress);

        applyMorph(smooth);
        updateFirstPersonCamera(smooth);

        const percent = Math.round(progress * 100);
        barFill.style.width = percent + "%";

        status.textContent =
          "Transforming... " + percent +
          "% - real body mesh vertices are moving toward the target form.";

        if (progress >= 1) {
          transforming = false;
          transformBtn.textContent = "COMPLETE";
          status.textContent =
            "Transformation complete. The target humanoid mesh is fully applied.";
        }
      }

      if (!bodyView) {
        if (camera.parent !== cameraPivot) {
          cameraPivot.add(camera);
          camera.position.set(0, 0, 0);
        }

        camera.rotation.set(pitch, 0, 0);

        // Hide head and neck from first person so they do not block the view.
        head.visible = false;
        neck.visible = false;
      } else {
        head.visible = true;
        neck.visible = true;

        if (camera.parent !== scene) {
          scene.attach(camera);
        }

        const h = mix(starter.height, target.height, progress);

        camera.position.set(
          player.position.x + 1.5,
          h * 0.70,
          player.position.z + 3.15
        );

        camera.lookAt(
          new THREE.Vector3(
            player.position.x,
            h * 0.48,
            player.position.z
          )
        );
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener(
      "resize",
      () => {
        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio, 2)
        );
      }
    );
  </script>
</body>
</html>
