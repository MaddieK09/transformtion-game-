<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game V17 - Anatomical Bone Bridge</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101217;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 650px;
      margin: auto;
      padding: 11px 13px;
      border-radius: 17px;
      color: white;
      background: rgba(0,0,0,0.67);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .debug {
      margin-top: 4px;
      font-size: 10px;
      line-height: 1.35;
      opacity: 0.72;
      white-space: pre-line;
    }

    #controls {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      z-index: 30;
      max-height: 43vh;
      overflow: auto;
      border-radius: 18px;
      background: rgba(12,14,18,0.93);
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    #buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 11px;
      min-width: 94px;
      color: #111;
      background: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 800;
    }

    button:active {
      transform: scale(0.97);
    }

    .controlRow {
      padding: 9px 2px;
      border-top: 1px solid rgba(255,255,255,0.09);
    }

    .labelLine {
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .value {
      opacity: 0.8;
      min-width: 44px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #101217;
      color: white;
      font-size: 16px;
      font-weight: 800;
    }

    #fatal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 20%;
      left: 15px;
      right: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #761c1c;
      color: white;
      font: 700 13px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="game"></div>
  <div id="loading">Loading V17 and building the anatomical bone-space bridgeâ¦</div>
  <div id="fatal"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game - V17 Anatomical Bone Bridge</div>
      <div id="status" class="status">Loading both endpoint humansâ¦</div>
      <div id="debug" class="debug"></div>
    </div>
  </div>

  <div id="controls">
    <div id="buttons">
      <button id="bodyViewBtn">BODY VIEW</button>
      <button id="lookBtn">LOOK DOWN</button>
      <button id="resetBtn">RESET</button>
      <button id="playBtn">PLAY MORPH</button>
      <button id="femaleRefBtn">FEMALE REFERENCE</button>
      <button id="bridgeBtn">BRIDGE BODY</button>
    </div>

    <div class="controlRow">
      <div class="labelLine">
        <span>ANATOMICAL TRANSFORMATION</span>
        <span id="progressValue" class="value">0%</span>
      </div>
      <input id="progressSlider" type="range" min="0" max="1" step="0.001" value="0">
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const loading = document.getElementById("loading");
    const fatal = document.getElementById("fatal");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const progressSlider = document.getElementById("progressSlider");
    const progressValue = document.getElementById("progressValue");

    function fail(error) {
      console.error(error);
      loading.style.display = "none";
      fatal.style.display = "block";
      fatal.textContent =
        "V17 ERROR\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nSend me a screenshot of this red box.";
    }

    window.addEventListener("error", e => {
      if (e.error) fail(e.error);
    });

    window.addEventListener("unhandledrejection", e => {
      fail(e.reason);
    });

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94d7f2);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.015,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById("game").appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x65727b, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(4, 8, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xdceaff, 1.0);
    fill.position.set(-4, 4, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xa2a5a8,
        roughness: 0.95
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function roomBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({ color, roughness: 0.88 })
      );

      mesh.position.set(x,y,z);
      mesh.scale.set(sx,sy,sz);
      scene.add(mesh);
    }

    roomBox(0, 1.5, -6, 10, 3, 0.2, 0xd8dde1);
    roomBox(-5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);
    roomBox(5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);

    // =========================================================
    // LOAD + NORMALIZE
    // =========================================================

    const loader = new GLTFLoader();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    }

    function getBounds(root) {
      root.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      return { box, size, center };
    }

    function normalizeModel(root, targetHeight) {
      let b = getBounds(root);

      if (!isFinite(b.size.y) || b.size.y <= 0.001) {
        throw new Error("Invalid model bounds.");
      }

      const scale = targetHeight / b.size.y;
      root.scale.multiplyScalar(scale);
      root.updateMatrixWorld(true);

      b = getBounds(root);

      root.position.x -= b.center.x;
      root.position.z -= b.center.z;
      root.position.y -= b.box.min.y;

      root.updateMatrixWorld(true);
    }

    function getRenderableMeshes(root) {
      const out = [];

      root.traverse(obj => {
        if ((obj.isMesh || obj.isSkinnedMesh) && obj.geometry?.attributes?.position) {
          out.push(obj);
        }
      });

      return out;
    }

    function collectBones(root) {
      const map = new Map();

      root.traverse(obj => {
        if (obj.isBone && obj.name) {
          map.set(obj.name, obj);
        }
      });

      return map;
    }

    // =========================================================
    // BONE-SPACE TARGETING
    // =========================================================

    let maleRoot;
    let femaleRoot;
    let bridgeGroup;

    let maleBones;
    let femaleBones;

    let bridgeParts = [];
    let showingReference = false;

    const tempWorld = new THREE.Vector3();
    const tempBoneLocal = new THREE.Vector3();
    const tempMapped = new THREE.Vector3();
    const tempAccum = new THREE.Vector3();
    const tempMatInv = new THREE.Matrix4();

    function getRestWorldVertex(mesh, index, target) {
      target.fromBufferAttribute(mesh.geometry.attributes.position, index);

      // These GLBs are in rest pose on load. applyBoneTransform gives
      // the current skinned vertex using the actual skin weights.
      if (mesh.isSkinnedMesh && mesh.skeleton) {
        mesh.applyBoneTransform(index, target);
      }

      return mesh.localToWorld(target);
    }

    function mapVertexThroughSharedBones(mesh, index, worldPos) {
      const skinIndex = mesh.geometry.attributes.skinIndex;
      const skinWeight = mesh.geometry.attributes.skinWeight;

      if (
        !mesh.isSkinnedMesh ||
        !mesh.skeleton ||
        !skinIndex ||
        !skinWeight
      ) {
        return worldPos.clone();
      }

      const indices = [
        skinIndex.getX(index),
        skinIndex.getY(index),
        skinIndex.getZ(index),
        skinIndex.getW(index)
      ];

      const weights = [
        skinWeight.getX(index),
        skinWeight.getY(index),
        skinWeight.getZ(index),
        skinWeight.getW(index)
      ];

      tempAccum.set(0,0,0);
      let totalWeight = 0;

      for (let k = 0; k < 4; k++) {
        const weight = weights[k];
        if (weight <= 0.00001) continue;

        const maleBone = mesh.skeleton.bones[indices[k]];
        if (!maleBone || !maleBone.name) continue;

        const femaleBone = femaleBones.get(maleBone.name);
        if (!femaleBone) continue;

        // Convert male world position into this male bone's local space,
        // then rebuild it in the matching female bone's world space.
        tempMatInv.copy(maleBone.matrixWorld).invert();

        tempBoneLocal
          .copy(worldPos)
          .applyMatrix4(tempMatInv);

        tempMapped
          .copy(tempBoneLocal)
          .applyMatrix4(femaleBone.matrixWorld);

        tempAccum.addScaledVector(tempMapped, weight);
        totalWeight += weight;
      }

      if (totalWeight <= 0.00001) {
        return worldPos.clone();
      }

      tempAccum.multiplyScalar(1 / totalWeight);
      return tempAccum.clone();
    }

    // =========================================================
    // ANATOMICAL SURFACE SHAPING
    // =========================================================

    function gaussian(x, center, width) {
      const d = (x - center) / width;
      return Math.exp(-d * d * 0.5);
    }

    function applyAnatomicalTarget(
      mapped,
      maleWorld,
      maleBounds,
      femaleBounds
    ) {
      const out = mapped.clone();

      const minY = maleBounds.box.min.y;
      const h = maleBounds.size.y;

      // normalized height: feet=0, top of head=1
      const ny = THREE.MathUtils.clamp((maleWorld.y - minY) / h, 0, 1);

      // Normalize x relative to male width.
      const nx = maleWorld.x / Math.max(0.001, maleBounds.size.x * 0.5);

      // ---------------------------------------------------------
      // Width profile:
      // shoulders narrower, waist narrower, pelvis/hips wider.
      // ---------------------------------------------------------

      const shoulderBand = gaussian(ny, 0.78, 0.075);
      const chestBand    = gaussian(ny, 0.69, 0.095);
      const waistBand    = gaussian(ny, 0.56, 0.075);
      const hipBand      = gaussian(ny, 0.47, 0.085);
      const thighBand    = gaussian(ny, 0.32, 0.13);

      let xScale = 1.0;
      xScale -= shoulderBand * 0.10;
      xScale -= waistBand * 0.12;
      xScale += hipBand * 0.16;
      xScale += thighBand * 0.055;

      out.x *= xScale;

      // ---------------------------------------------------------
      // Chest shaping:
      // TWO separate breast lobes centered left/right.
      // Front of character is negative Z in these models.
      // ---------------------------------------------------------

      const breastY = 0.70;
      const breastYWeight = gaussian(ny, breastY, 0.055);

      const leftLobe  = gaussian(nx, -0.30, 0.19);
      const rightLobe = gaussian(nx,  0.30, 0.19);

      // Sternum gap prevents one single chest blob.
      const centerGap = 1.0 - gaussian(nx, 0.0, 0.105);

      const breastWeight =
        breastYWeight *
        Math.max(leftLobe, rightLobe) *
        (0.28 + centerGap * 0.72);

      // Only push vertices already on the front half.
      const frontness = THREE.MathUtils.clamp(
        (-maleWorld.z + 0.03) / 0.16,
        0,
        1
      );

      out.z -= breastWeight * frontness * 0.075;

      // Gentle lower-chest transition.
      out.z -= chestBand * frontness * 0.008;

      // ---------------------------------------------------------
      // Pelvis/glute depth and abdomen smoothing.
      // ---------------------------------------------------------

      const backness = THREE.MathUtils.clamp(
        (maleWorld.z + 0.03) / 0.18,
        0,
        1
      );

      out.z += hipBand * backness * 0.035;

      // Slightly flatten/narrow central abdomen.
      const abdomenBand = gaussian(ny, 0.56, 0.10);
      out.z *= 1.0 - abdomenBand * 0.025;

      // ---------------------------------------------------------
      // Height alignment:
      // Rig map already handles most of this, but ease remaining
      // male/female normalized-height difference coherently.
      // ---------------------------------------------------------

      const targetHeightRatio =
        femaleBounds.size.y / maleBounds.size.y;

      out.y =
        femaleBounds.box.min.y +
        (out.y - femaleBounds.box.min.y) *
        THREE.MathUtils.lerp(1.0, targetHeightRatio, 0.22);

      return out;
    }

    // =========================================================
    // BUILD BRIDGE
    // =========================================================

    async function buildBridge() {
      maleRoot.updateMatrixWorld(true);
      femaleRoot.updateMatrixWorld(true);

      const maleBounds = getBounds(maleRoot);
      const femaleBounds = getBounds(femaleRoot);

      const maleMeshes = getRenderableMeshes(maleRoot);

      bridgeGroup = new THREE.Group();
      bridgeGroup.name = "V17AnatomicalBridge";
      scene.add(bridgeGroup);

      bridgeParts = [];

      let skinnedVertices = 0;
      let fallbackVertices = 0;

      for (let m = 0; m < maleMeshes.length; m++) {
        const source = maleMeshes[m];

        statusEl.textContent =
          `Building anatomical bridge ${m + 1}/${maleMeshes.length}â¦`;

        const posAttr = source.geometry.attributes.position;
        const count = posAttr.count;

        const start = new Float32Array(count * 3);
        const rigTarget = new Float32Array(count * 3);
        const anatomyTarget = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
          getRestWorldVertex(source, i, tempWorld);

          const k = i * 3;

          start[k] = tempWorld.x;
          start[k + 1] = tempWorld.y;
          start[k + 2] = tempWorld.z;

          const mapped =
            mapVertexThroughSharedBones(source, i, tempWorld);

          rigTarget[k] = mapped.x;
          rigTarget[k + 1] = mapped.y;
          rigTarget[k + 2] = mapped.z;

          const anatomical =
            applyAnatomicalTarget(
              mapped,
              tempWorld,
              maleBounds,
              femaleBounds
            );

          anatomyTarget[k] = anatomical.x;
          anatomyTarget[k + 1] = anatomical.y;
          anatomyTarget[k + 2] = anatomical.z;

          if (
            source.isSkinnedMesh &&
            source.geometry.attributes.skinIndex &&
            source.geometry.attributes.skinWeight
          ) {
            skinnedVertices++;
          } else {
            fallbackVertices++;
          }
        }

        const geometry = new THREE.BufferGeometry();

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(
            new Float32Array(start),
            3
          )
        );

        if (source.geometry.index) {
          geometry.setIndex(source.geometry.index.clone());
        }

        if (source.geometry.attributes.uv) {
          geometry.setAttribute(
            "uv",
            source.geometry.attributes.uv.clone()
          );
        }

        geometry.computeVertexNormals();

        let material;

        if (Array.isArray(source.material)) {
          material = source.material.map(x => x.clone());
        } else if (source.material) {
          material = source.material.clone();
        } else {
          material = new THREE.MeshStandardMaterial({
            color: 0xd7aa8c,
            roughness: 0.74
          });
        }

        const mesh = new THREE.Mesh(geometry, material);
        mesh.frustumCulled = false;

        bridgeGroup.add(mesh);

        bridgeParts.push({
          mesh,
          start,
          rigTarget,
          anatomyTarget
        });

        await new Promise(resolve => setTimeout(resolve, 0));
      }

      debugEl.textContent =
        `shared bones: ${[...maleBones.keys()].filter(n => femaleBones.has(n)).length}\n` +
        `bridge parts: ${bridgeParts.length}\n` +
        `skinned vertices mapped by bone regions: ${skinnedVertices}\n` +
        `fallback vertices: ${fallbackVertices}\n` +
        `chest shaping: two distinct lobes + sternum gap`;

      maleRoot.visible = false;
      femaleRoot.visible = false;
      bridgeGroup.visible = true;
    }

    // =========================================================
    // MORPH
    // =========================================================

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function smootherstep(t) {
      return t*t*t*(t*(t*6 - 15) + 10);
    }

    let normalFrame = 0;

    function applyProgress(raw) {
      const p = THREE.MathUtils.clamp(raw, 0, 1);

      // Stage timing:
      // 0-65% = skeleton/bone-region relocation
      // 35-100% = anatomical surface shaping layered in
      const rigT = smoothstep(
        THREE.MathUtils.clamp(p / 0.78, 0, 1)
      );

      const anatomyT = smootherstep(
        THREE.MathUtils.clamp((p - 0.28) / 0.72, 0, 1)
      );

      for (const part of bridgeParts) {
        const live = part.mesh.geometry.attributes.position.array;
        const a = part.start;
        const r = part.rigTarget;
        const f = part.anatomyTarget;

        for (let i = 0; i < live.length; i++) {
          const rigged = a[i] + (r[i] - a[i]) * rigT;
          live[i] = rigged + (f[i] - r[i]) * anatomyT;
        }

        part.mesh.geometry.attributes.position.needsUpdate = true;
      }

      normalFrame++;

      if (normalFrame % 3 === 0 || p === 0 || p === 1) {
        for (const part of bridgeParts) {
          part.mesh.geometry.computeVertexNormals();
        }
      }

      progressSlider.value = String(p);
      progressValue.textContent = Math.round(p * 100) + "%";

      statusEl.textContent =
        `Anatomical bridge - ${Math.round(p * 100)}%`;
    }

    // =========================================================
    // PLAYBACK
    // =========================================================

    let playing = false;
    let playStart = 0;
    const PLAY_MS = 16000;

    document.getElementById("playBtn")
      .addEventListener("click", () => {
        showingReference = false;
        femaleRoot.visible = false;
        bridgeGroup.visible = true;

        playing = true;
        playStart = performance.now();
        applyProgress(0);
      });

    document.getElementById("resetBtn")
      .addEventListener("click", () => {
        playing = false;
        showingReference = false;
        femaleRoot.visible = false;
        bridgeGroup.visible = true;
        applyProgress(0);
      });

    progressSlider.addEventListener("input", () => {
      playing = false;
      showingReference = false;
      femaleRoot.visible = false;
      bridgeGroup.visible = true;
      applyProgress(Number(progressSlider.value));
    });

    document.getElementById("femaleRefBtn")
      .addEventListener("click", () => {
        playing = false;
        showingReference = true;

        bridgeGroup.visible = false;
        maleRoot.visible = false;
        femaleRoot.visible = true;

        setBodyView();

        statusEl.textContent =
          "Real female endpoint reference.";
      });

    document.getElementById("bridgeBtn")
      .addEventListener("click", () => {
        showingReference = false;

        femaleRoot.visible = false;
        maleRoot.visible = false;
        bridgeGroup.visible = true;

        setBodyView();

        statusEl.textContent =
          "Anatomical bridge restored.";
      });

    // =========================================================
    // CAMERA
    // =========================================================

    let bodyView = true;
    let yaw = 0;
    let pitch = THREE.MathUtils.degToRad(-7);

    function activeVisual() {
      return showingReference ? femaleRoot : bridgeGroup;
    }

    function setBodyView() {
      bodyView = true;

      const visual = activeVisual();
      if (!visual) return;

      const b = getBounds(visual);

      camera.position.set(
        b.center.x + 1.5,
        b.box.min.y + b.size.y * 0.62,
        b.center.z + 3.0
      );

      camera.lookAt(
        b.center.x,
        b.box.min.y + b.size.y * 0.49,
        b.center.z
      );
    }

    function setFirstPerson() {
      bodyView = false;

      const visual = activeVisual();
      if (!visual) return;

      const b = getBounds(visual);

      camera.position.set(
        b.center.x,
        b.box.min.y + b.size.y * 0.925,
        b.center.z - b.size.z * 0.16
      );

      pitch = THREE.MathUtils.degToRad(-10);
    }

    function lookDown() {
      if (bodyView) setFirstPerson();

      pitch = THREE.MathUtils.degToRad(-66);

      statusEl.textContent =
        showingReference
          ? "LOOK DOWN - female endpoint."
          : "LOOK DOWN - anatomical bridge.";
    }

    document.getElementById("bodyViewBtn")
      .addEventListener("click", () => {
        setBodyView();

        statusEl.textContent =
          showingReference
            ? "BODY VIEW - female endpoint."
            : "BODY VIEW - anatomical bridge.";
      });

    document.getElementById("lookBtn")
      .addEventListener("click", lookDown);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    const sensitivity = 0.004;

    function startDrag(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function drag(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      pitch -= dy * sensitivity;

      pitch = THREE.MathUtils.clamp(
        pitch,
        THREE.MathUtils.degToRad(-88),
        THREE.MathUtils.degToRad(70)
      );
    }

    function endDrag() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      e => {
        if (e.touches.length === 1) {
          startDrag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      e => {
        if (e.touches.length === 1) {
          e.preventDefault();

          drag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endDrag);
    renderer.domElement.addEventListener("touchcancel", endDrag);

    const euler = new THREE.Euler(0,0,0,"YXZ");

    // =========================================================
    // LOOP
    // =========================================================

    function animate(now) {
      requestAnimationFrame(animate);

      if (playing) {
        let p = (now - playStart) / PLAY_MS;

        if (p >= 1) {
          p = 1;
          playing = false;
        }

        applyProgress(p);
      }

      if (!bodyView) {
        euler.set(pitch, yaw, 0);
        camera.quaternion.setFromEuler(euler);
      }

      renderer.render(scene, camera);
    }

    animate();

    // =========================================================
    // SETUP
    // =========================================================

    async function setup() {
      statusEl.textContent = "Loading real male endpointâ¦";
      const maleGLTF = await loadGLB("./adult-male-lod.glb");

      statusEl.textContent = "Loading real female endpointâ¦";
      const femaleGLTF = await loadGLB("./adult-female-lod.glb");

      maleRoot = maleGLTF.scene;
      femaleRoot = femaleGLTF.scene;

      scene.add(maleRoot);
      scene.add(femaleRoot);

      normalizeModel(maleRoot, 1.80);
      normalizeModel(femaleRoot, 1.65);

      maleBones = collectBones(maleRoot);
      femaleBones = collectBones(femaleRoot);

      maleRoot.updateMatrixWorld(true);
      femaleRoot.updateMatrixWorld(true);

      maleRoot.visible = false;
      femaleRoot.visible = false;

      await buildBridge();

      applyProgress(0);
      setBodyView();

      loading.style.display = "none";

      statusEl.textContent =
        "V17 ready. PLAY MORPH uses bone-space anatomical correspondence instead of nearest-point collapse.";
    }

    setup().catch(fail);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );
    });
  </script>
</body>
</html>
