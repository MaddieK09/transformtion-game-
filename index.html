<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game Prototype V3</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 10px);
      left: 10px;
      right: 10px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 460px;
      margin: 0 auto;
      padding: 11px 13px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.58);
      color: white;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .status {
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.92;
    }

    .bar {
      margin-top: 9px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
    }

    #barFill {
      width: 0%;
      height: 100%;
      background: white;
      border-radius: 999px;
    }

    #bottomUI {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(env(safe-area-inset-bottom) + 12px);
      z-index: 30;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 800;
      color: #111;
      background: white;
      min-width: 140px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    button:active {
      transform: scale(0.97);
    }

    button.secondary {
      min-width: 90px;
      background: rgba(255,255,255,0.84);
    }

    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 80px);
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 5px rgba(0,0,0,0.65);
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game â V3</div>
      <div id="status" class="status">
        Starter form. Drag to look around, then look down at your body.
      </div>
      <div class="bar">
        <div id="barFill"></div>
      </div>
    </div>
  </div>

  <div id="hint">Drag to look â¢ Look down â¢ Press Transform</div>

  <div id="bottomUI">
    <button id="transformBtn">TRANSFORM</button>
    <button id="resetBtn" class="secondary">RESET</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    // =========================================================
    // THREE.JS SETUP
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fd3f4);

    const camera = new THREE.PerspectiveCamera(
      76,
      window.innerWidth / window.innerHeight,
      0.035,
      150
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.getElementById("game").appendChild(renderer.domElement);

    // =========================================================
    // WORLD
    // =========================================================

    scene.add(new THREE.HemisphereLight(0xffffff, 0x52606d, 2.1));

    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(4, 9, 5);
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({ color: 0x8d9297, roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function addBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({ color, roughness: 0.82 })
      );
      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      scene.add(mesh);
      return mesh;
    }

    addBox(0, 1.5, -6.5, 10, 3, 0.25, 0xd9dde0);
    addBox(-5.25, 1.5, -1, 0.25, 3, 11, 0xd9dde0);
    addBox(5.25, 1.5, -1, 0.25, 3, 11, 0xd9dde0);

    addBox(-2.8, 0.45, -3.5, 1.4, 0.9, 0.75, 0x9b7653);
    addBox(2.65, 0.85, -4.0, 0.75, 1.7, 0.75, 0x6f7d8f);

    // =========================================================
    // PLAYER RIG
    // =========================================================

    const player = new THREE.Group();
    player.position.set(0, 0, 2.5);
    scene.add(player);

    const yawObject = new THREE.Group();
    player.add(yawObject);

    const pitchObject = new THREE.Group();
    yawObject.add(pitchObject);

    pitchObject.add(camera);

    // Body follows yaw, but not pitch.
    // This means when you look down, the body stays physically below you
    // instead of tilting with your camera.
    const bodyRoot = new THREE.Group();
    yawObject.add(bodyRoot);

    // Slightly behind eye origin so chest does not clip into camera.
    bodyRoot.position.z = 0.03;

    // =========================================================
    // MATERIALS
    // =========================================================

    const skinMaterial = new THREE.MeshStandardMaterial({
      color: 0xd6a078,
      roughness: 0.72
    });

    const shirtMaterial = new THREE.MeshStandardMaterial({
      color: 0x405f91,
      roughness: 0.86
    });

    const pantsMaterial = new THREE.MeshStandardMaterial({
      color: 0x202834,
      roughness: 0.9
    });

    const shoeMaterial = new THREE.MeshStandardMaterial({
      color: 0x171717,
      roughness: 0.96
    });

    // =========================================================
    // BODY SHAPES
    // Using rounded-ish capsules/cylinders instead of chunky cubes.
    // =========================================================

    function makeCapsule(radius, length, material, capSegments = 6, radialSegments = 10) {
      const geometry = new THREE.CapsuleGeometry(
        radius,
        Math.max(0.01, length - radius * 2),
        capSegments,
        radialSegments
      );
      return new THREE.Mesh(geometry, material);
    }

    function makeEllipsoid(material, sx = 1, sy = 1, sz = 1) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 18, 14),
        material
      );
      mesh.scale.set(sx, sy, sz);
      return mesh;
    }

    // Torso sections
    const chest = makeEllipsoid(shirtMaterial);
    const abdomen = makeEllipsoid(shirtMaterial);
    const pelvis = makeEllipsoid(pantsMaterial);

    bodyRoot.add(chest, abdomen, pelvis);

    // Arms
    const leftUpperArm = makeCapsule(0.06, 0.34, skinMaterial);
    const rightUpperArm = makeCapsule(0.06, 0.34, skinMaterial);
    const leftForearm = makeCapsule(0.055, 0.31, skinMaterial);
    const rightForearm = makeCapsule(0.055, 0.31, skinMaterial);
    const leftHand = makeEllipsoid(skinMaterial);
    const rightHand = makeEllipsoid(skinMaterial);

    bodyRoot.add(
      leftUpperArm, rightUpperArm,
      leftForearm, rightForearm,
      leftHand, rightHand
    );

    // Legs
    const leftThigh = makeCapsule(0.085, 0.44, pantsMaterial);
    const rightThigh = makeCapsule(0.085, 0.44, pantsMaterial);
    const leftShin = makeCapsule(0.072, 0.42, pantsMaterial);
    const rightShin = makeCapsule(0.072, 0.42, pantsMaterial);

    const leftFoot = makeEllipsoid(shoeMaterial);
    const rightFoot = makeEllipsoid(shoeMaterial);

    bodyRoot.add(
      leftThigh, rightThigh,
      leftShin, rightShin,
      leftFoot, rightFoot
    );

    // =========================================================
    // PROFILES
    // =========================================================

    const starterProfile = {
      name: "Starter",
      height: 1.80,
      shoulderWidth: 0.47,
      chestWidth: 0.43,
      chestDepth: 0.26,
      waistWidth: 0.33,
      hipWidth: 0.36,
      hipDepth: 0.25,
      upperArmRadius: 0.062,
      forearmRadius: 0.055,
      thighRadius: 0.088,
      shinRadius: 0.071,
      handScale: 1.0,
      footScale: 1.0,
      skin: new THREE.Color(0xd6a078),
      shirt: new THREE.Color(0x405f91),
      pants: new THREE.Color(0x202834)
    };

    const targetProfile = {
      name: "Target",
      height: 1.55,
      shoulderWidth: 0.385,
      chestWidth: 0.39,
      chestDepth: 0.34,
      waistWidth: 0.275,
      hipWidth: 0.49,
      hipDepth: 0.34,
      upperArmRadius: 0.052,
      forearmRadius: 0.047,
      thighRadius: 0.118,
      shinRadius: 0.079,
      handScale: 0.88,
      footScale: 0.92,
      skin: new THREE.Color(0xb87552),
      shirt: new THREE.Color(0x8f3d86),
      pants: new THREE.Color(0x2a2230)
    };

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // =========================================================
    // BODY UPDATE
    // =========================================================

    function setCapsuleScale(mesh, radiusBase, radiusTarget, length, baseLength) {
      const radialScale = radiusTarget / radiusBase;
      const verticalScale = length / baseLength;
      mesh.scale.set(radialScale, verticalScale, radialScale);
    }

    function applyProfile(progress) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);

      const height = lerp(starterProfile.height, targetProfile.height, p);
      const shoulderWidth = lerp(starterProfile.shoulderWidth, targetProfile.shoulderWidth, p);
      const chestWidth = lerp(starterProfile.chestWidth, targetProfile.chestWidth, p);
      const chestDepth = lerp(starterProfile.chestDepth, targetProfile.chestDepth, p);
      const waistWidth = lerp(starterProfile.waistWidth, targetProfile.waistWidth, p);
      const hipWidth = lerp(starterProfile.hipWidth, targetProfile.hipWidth, p);
      const hipDepth = lerp(starterProfile.hipDepth, targetProfile.hipDepth, p);

      const upperArmRadius = lerp(starterProfile.upperArmRadius, targetProfile.upperArmRadius, p);
      const forearmRadius = lerp(starterProfile.forearmRadius, targetProfile.forearmRadius, p);
      const thighRadius = lerp(starterProfile.thighRadius, targetProfile.thighRadius, p);
      const shinRadius = lerp(starterProfile.shinRadius, targetProfile.shinRadius, p);

      const handScale = lerp(starterProfile.handScale, targetProfile.handScale, p);
      const footScale = lerp(starterProfile.footScale, targetProfile.footScale, p);

      // Body proportions.
      const eyeHeight = height * 0.935;

      const chestHeight = height * 0.205;
      const abdomenHeight = height * 0.145;
      const pelvisHeight = height * 0.12;

      const upperArmLength = height * 0.19;
      const forearmLength = height * 0.175;

      const thighLength = height * 0.245;
      const shinLength = height * 0.235;

      camera.position.set(0, eyeHeight, 0);

      // Chest sits naturally below and slightly forward of the camera.
      const chestY = eyeHeight - chestHeight * 0.92;
      const abdomenY = chestY - chestHeight * 0.48 - abdomenHeight * 0.42;
      const pelvisY = abdomenY - abdomenHeight * 0.48 - pelvisHeight * 0.42;

      chest.position.set(0, chestY, -0.03);
      chest.scale.set(
        chestWidth,
        chestHeight,
        chestDepth
      );

      abdomen.position.set(0, abdomenY, -0.015);
      abdomen.scale.set(
        waistWidth,
        abdomenHeight,
        lerp(chestDepth * 0.85, hipDepth * 0.85, 0.5)
      );

      pelvis.position.set(0, pelvisY, 0.005);
      pelvis.scale.set(
        hipWidth,
        pelvisHeight,
        hipDepth
      );

      // Arms hang beside the torso and a little forward.
      const shoulderY = chestY + chestHeight * 0.18;
      const armForward = -0.03;

      leftUpperArm.position.set(
        -shoulderWidth * 0.58,
        shoulderY - upperArmLength * 0.5,
        armForward
      );

      rightUpperArm.position.set(
        shoulderWidth * 0.58,
        shoulderY - upperArmLength * 0.5,
        armForward
      );

      setCapsuleScale(
        leftUpperArm,
        0.06,
        upperArmRadius,
        upperArmLength,
        0.34
      );
      rightUpperArm.scale.copy(leftUpperArm.scale);

      leftForearm.position.set(
        leftUpperArm.position.x,
        leftUpperArm.position.y - upperArmLength * 0.5 - forearmLength * 0.47,
        armForward - 0.005
      );

      rightForearm.position.set(
        rightUpperArm.position.x,
        rightUpperArm.position.y - upperArmLength * 0.5 - forearmLength * 0.47,
        armForward - 0.005
      );

      setCapsuleScale(
        leftForearm,
        0.055,
        forearmRadius,
        forearmLength,
        0.31
      );
      rightForearm.scale.copy(leftForearm.scale);

      const handW = 0.105 * handScale;
      const handH = 0.15 * handScale;
      const handD = 0.07 * handScale;

      leftHand.scale.set(handW, handH, handD);
      rightHand.scale.copy(leftHand.scale);

      leftHand.position.set(
        leftForearm.position.x,
        leftForearm.position.y - forearmLength * 0.47 - handH * 0.45,
        armForward - 0.015
      );

      rightHand.position.set(
        rightForearm.position.x,
        rightForearm.position.y - forearmLength * 0.47 - handH * 0.45,
        armForward - 0.015
      );

      // Legs
      const thighTopY = pelvisY - pelvisHeight * 0.43;
      const legX = hipWidth * 0.22;

      leftThigh.position.set(
        -legX,
        thighTopY - thighLength * 0.5,
        0.02
      );

      rightThigh.position.set(
        legX,
        thighTopY - thighLength * 0.5,
        0.02
      );

      setCapsuleScale(
        leftThigh,
        0.085,
        thighRadius,
        thighLength,
        0.44
      );
      rightThigh.scale.copy(leftThigh.scale);

      leftShin.position.set(
        leftThigh.position.x,
        leftThigh.position.y - thighLength * 0.5 - shinLength * 0.48,
        0.025
      );

      rightShin.position.set(
        rightThigh.position.x,
        rightThigh.position.y - thighLength * 0.5 - shinLength * 0.48,
        0.025
      );

      setCapsuleScale(
        leftShin,
        0.072,
        shinRadius,
        shinLength,
        0.42
      );
      rightShin.scale.copy(leftShin.scale);

      const footW = 0.15 * footScale;
      const footH = 0.085 * footScale;
      const footD = 0.29 * footScale;

      leftFoot.scale.set(footW, footH, footD);
      rightFoot.scale.copy(leftFoot.scale);

      leftFoot.position.set(
        leftShin.position.x,
        footH * 0.5,
        -footD * 0.22
      );

      rightFoot.position.set(
        rightShin.position.x,
        footH * 0.5,
        -footD * 0.22
      );

      skinMaterial.color.copy(starterProfile.skin).lerp(targetProfile.skin, p);
      shirtMaterial.color.copy(starterProfile.shirt).lerp(targetProfile.shirt, p);
      pantsMaterial.color.copy(starterProfile.pants).lerp(targetProfile.pants, p);
    }

    // =========================================================
    // TRANSFORMATION SYSTEM
    // =========================================================

    let transformProgress = 0;
    let transforming = false;
    let transformStartTime = 0;

    const transformationDuration = 22000;

    const status = document.getElementById("status");
    const barFill = document.getElementById("barFill");
    const transformBtn = document.getElementById("transformBtn");

    function startTransformation() {
      if (transforming || transformProgress >= 1) return;

      transforming = true;
      transformStartTime =
        performance.now() - transformProgress * transformationDuration;

      transformBtn.textContent = "TRANSFORMINGâ¦";
      status.textContent =
        "Transformation underway â look down and watch your body gradually change.";
    }

    function resetTransformation() {
      transforming = false;
      transformProgress = 0;
      applyProfile(0);

      transformBtn.textContent = "TRANSFORM";
      barFill.style.width = "0%";
      status.textContent =
        "Starter form. Drag to look around, then look down at your body.";
    }

    transformBtn.addEventListener("click", startTransformation);
    document.getElementById("resetBtn").addEventListener("click", resetTransformation);

    // =========================================================
    // LOOK CONTROLS
    // =========================================================

    let yaw = 0;
    let pitch = -0.26;

    const maxPitch = THREE.MathUtils.degToRad(88);
    const sensitivity = 0.0042;

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    function beginLook(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function moveLook(x, y) {
      if (!dragging) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      pitch -= dy * sensitivity;

      pitch = THREE.MathUtils.clamp(
        pitch,
        -maxPitch,
        maxPitch
      );
    }

    function endLook() {
      dragging = false;
    }

    renderer.domElement.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        beginLook(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    renderer.domElement.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1) {
        e.preventDefault();
        moveLook(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    renderer.domElement.addEventListener("touchend", endLook);
    renderer.domElement.addEventListener("touchcancel", endLook);

    renderer.domElement.addEventListener("mousedown", (e) => {
      beginLook(e.clientX, e.clientY);
    });

    window.addEventListener("mousemove", (e) => {
      moveLook(e.clientX, e.clientY);
    });

    window.addEventListener("mouseup", endLook);

    // =========================================================
    // ANIMATION
    // =========================================================

    applyProfile(0);

    function animate(now) {
      requestAnimationFrame(animate);

      yawObject.rotation.y = yaw;
      pitchObject.rotation.x = pitch;

      if (transforming) {
        transformProgress =
          (now - transformStartTime) / transformationDuration;

        transformProgress = THREE.MathUtils.clamp(
          transformProgress,
          0,
          1
        );

        const smoothProgress =
          transformProgress *
          transformProgress *
          (3 - 2 * transformProgress);

        applyProfile(smoothProgress);

        const pct = Math.round(transformProgress * 100);
        barFill.style.width = pct + "%";
        status.textContent =
          `Transformingâ¦ ${pct}% â height and body proportions are changing continuously.`;

        if (transformProgress >= 1) {
          transforming = false;
          transformBtn.textContent = "COMPLETE";
          status.textContent =
            "Transformation complete â the target form is fully applied.";
        }
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener("resize", () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );
    });
  </script>
</body>
</html>
