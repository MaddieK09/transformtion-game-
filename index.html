<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game V18 - Regional Surface Bridge</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101217;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 670px;
      margin: auto;
      padding: 11px 13px;
      border-radius: 17px;
      color: white;
      background: rgba(0,0,0,0.67);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .debug {
      margin-top: 4px;
      font-size: 10px;
      line-height: 1.35;
      opacity: 0.72;
      white-space: pre-line;
    }

    #controls {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      z-index: 30;
      max-height: 43vh;
      overflow: auto;
      border-radius: 18px;
      background: rgba(12,14,18,0.93);
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    #buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 11px;
      min-width: 94px;
      color: #111;
      background: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 800;
    }

    button:active {
      transform: scale(0.97);
    }

    .controlRow {
      padding: 9px 2px;
      border-top: 1px solid rgba(255,255,255,0.09);
    }

    .labelLine {
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .value {
      opacity: 0.8;
      min-width: 44px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #101217;
      color: white;
      font-size: 16px;
      font-weight: 800;
    }

    #fatal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 18%;
      left: 15px;
      right: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #761c1c;
      color: white;
      font: 700 13px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="game"></div>
  <div id="loading">Loading V18 and building regional male-to-female surface correspondenceâ¦</div>
  <div id="fatal"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game - V18 Regional Surface Bridge</div>
      <div id="status" class="status">Loading both real human endpointsâ¦</div>
      <div id="debug" class="debug"></div>
    </div>
  </div>

  <div id="controls">
    <div id="buttons">
      <button id="bodyViewBtn">BODY VIEW</button>
      <button id="lookBtn">LOOK DOWN</button>
      <button id="resetBtn">RESET</button>
      <button id="playBtn">PLAY MORPH</button>
      <button id="femaleRefBtn">FEMALE REFERENCE</button>
      <button id="bridgeBtn">BRIDGE BODY</button>
    </div>

    <div class="controlRow">
      <div class="labelLine">
        <span>REGIONAL TRANSFORMATION</span>
        <span id="progressValue" class="value">0%</span>
      </div>
      <input id="progressSlider" type="range" min="0" max="1" step="0.001" value="0">
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const loading = document.getElementById("loading");
    const fatal = document.getElementById("fatal");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const progressSlider = document.getElementById("progressSlider");
    const progressValue = document.getElementById("progressValue");

    function fail(error) {
      console.error(error);
      loading.style.display = "none";
      fatal.style.display = "block";
      fatal.textContent =
        "V18 ERROR\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nSend me a screenshot of this red box.";
    }

    window.addEventListener("error", e => {
      if (e.error) fail(e.error);
    });

    window.addEventListener("unhandledrejection", e => {
      fail(e.reason);
    });

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94d7f2);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.015,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById("game").appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x65727b, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(4, 8, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xdceaff, 1.0);
    fill.position.set(-4, 4, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xa2a5a8,
        roughness: 0.95
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function roomBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({ color, roughness: 0.88 })
      );

      mesh.position.set(x,y,z);
      mesh.scale.set(sx,sy,sz);
      scene.add(mesh);
    }

    roomBox(0, 1.5, -6, 10, 3, 0.2, 0xd8dde1);
    roomBox(-5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);
    roomBox(5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);

    // =========================================================
    // LOAD + NORMALIZE
    // =========================================================

    const loader = new GLTFLoader();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    }

    function getBounds(root) {
      root.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      return { box, size, center };
    }

    function normalizeModel(root, targetHeight) {
      let b = getBounds(root);

      if (!isFinite(b.size.y) || b.size.y <= 0.001) {
        throw new Error("Invalid model bounds.");
      }

      const scale = targetHeight / b.size.y;
      root.scale.multiplyScalar(scale);
      root.updateMatrixWorld(true);

      b = getBounds(root);

      root.position.x -= b.center.x;
      root.position.z -= b.center.z;
      root.position.y -= b.box.min.y;

      root.updateMatrixWorld(true);
    }

    function collectBones(root) {
      const map = new Map();

      root.traverse(obj => {
        if (obj.isBone && obj.name) {
          map.set(obj.name, obj);
        }
      });

      return map;
    }

    function getRenderableMeshes(root) {
      const out = [];

      root.traverse(obj => {
        if ((obj.isMesh || obj.isSkinnedMesh) && obj.geometry?.attributes?.position) {
          out.push(obj);
        }
      });

      return out;
    }

    // =========================================================
    // VERTEX + SKIN HELPERS
    // =========================================================

    const tmp = new THREE.Vector3();
    const tmp2 = new THREE.Vector3();
    const inv = new THREE.Matrix4();

    function getWorldVertex(mesh, index, target) {
      target.fromBufferAttribute(mesh.geometry.attributes.position, index);

      if (mesh.isSkinnedMesh && mesh.skeleton) {
        mesh.applyBoneTransform(index, target);
      }

      return mesh.localToWorld(target);
    }

    function dominantBoneName(mesh, index) {
      if (
        !mesh.isSkinnedMesh ||
        !mesh.skeleton ||
        !mesh.geometry.attributes.skinIndex ||
        !mesh.geometry.attributes.skinWeight
      ) {
        return null;
      }

      const si = mesh.geometry.attributes.skinIndex;
      const sw = mesh.geometry.attributes.skinWeight;

      const indices = [
        si.getX(index),
        si.getY(index),
        si.getZ(index),
        si.getW(index)
      ];

      const weights = [
        sw.getX(index),
        sw.getY(index),
        sw.getZ(index),
        sw.getW(index)
      ];

      let bestK = 0;

      for (let k = 1; k < 4; k++) {
        if (weights[k] > weights[bestK]) bestK = k;
      }

      const bone = mesh.skeleton.bones[indices[bestK]];
      return bone?.name || null;
    }

    function worldToBoneLocal(world, bone, target) {
      inv.copy(bone.matrixWorld).invert();
      return target.copy(world).applyMatrix4(inv);
    }

    // =========================================================
    // REGIONAL CLOUDS
    // =========================================================

    function ensureRegion(map, name) {
      let r = map.get(name);

      if (!r) {
        r = {
          name,
          localPoints: [],
          worldPoints: [],
          min: new THREE.Vector3(+Infinity,+Infinity,+Infinity),
          max: new THREE.Vector3(-Infinity,-Infinity,-Infinity),
          normalized: null,
          hash: null
        };
        map.set(name, r);
      }

      return r;
    }

    function expandBounds(region, p) {
      region.min.min(p);
      region.max.max(p);
    }

    function normalizePointToBounds(p, min, max, target) {
      const sx = Math.max(1e-5, max.x - min.x);
      const sy = Math.max(1e-5, max.y - min.y);
      const sz = Math.max(1e-5, max.z - min.z);

      target.set(
        (p.x - min.x) / sx,
        (p.y - min.y) / sy,
        (p.z - min.z) / sz
      );

      return target;
    }

    const HASH_CELL = 0.09;

    function hashKey(x,y,z) {
      return `${x}|${y}|${z}`;
    }

    function hashCoord(v) {
      return Math.floor(v / HASH_CELL);
    }

    function buildHash(points) {
      const map = new Map();

      for (let i = 0; i < points.length; i += 3) {
        const x = points[i];
        const y = points[i + 1];
        const z = points[i + 2];

        const key = hashKey(
          hashCoord(x),
          hashCoord(y),
          hashCoord(z)
        );

        let bucket = map.get(key);

        if (!bucket) {
          bucket = [];
          map.set(key, bucket);
        }

        bucket.push(i / 3);
      }

      return map;
    }

    function nearestNormalizedIndex(px,py,pz,points,hash) {
      const cx = hashCoord(px);
      const cy = hashCoord(py);
      const cz = hashCoord(pz);

      let best = -1;
      let bestDist = Infinity;

      for (let radius = 0; radius <= 3; radius++) {
        let found = false;

        for (let dx = -radius; dx <= radius; dx++) {
          for (let dy = -radius; dy <= radius; dy++) {
            for (let dz = -radius; dz <= radius; dz++) {
              if (
                radius > 0 &&
                Math.abs(dx) !== radius &&
                Math.abs(dy) !== radius &&
                Math.abs(dz) !== radius
              ) continue;

              const bucket = hash.get(
                hashKey(cx+dx, cy+dy, cz+dz)
              );

              if (!bucket) continue;
              found = true;

              for (const idx of bucket) {
                const k = idx * 3;
                const qx = points[k];
                const qy = points[k+1];
                const qz = points[k+2];

                const ddx = qx - px;
                const ddy = qy - py;
                const ddz = qz - pz;

                const d = ddx*ddx + ddy*ddy + ddz*ddz;

                if (d < bestDist) {
                  bestDist = d;
                  best = idx;
                }
              }
            }
          }
        }

        if (found && best >= 0) return best;
      }

      return best;
    }

    function buildRegions(root, boneMap) {
      const regions = new Map();
      const meshes = getRenderableMeshes(root);

      for (const mesh of meshes) {
        const count = mesh.geometry.attributes.position.count;

        for (let i = 0; i < count; i++) {
          const boneName = dominantBoneName(mesh, i);
          if (!boneName) continue;

          const bone = boneMap.get(boneName);
          if (!bone) continue;

          getWorldVertex(mesh, i, tmp);
          worldToBoneLocal(tmp, bone, tmp2);

          const r = ensureRegion(regions, boneName);

          r.localPoints.push(tmp2.x, tmp2.y, tmp2.z);
          r.worldPoints.push(tmp.x, tmp.y, tmp.z);

          expandBounds(r, tmp2);
        }
      }

      // Normalize + hash every region.
      for (const region of regions.values()) {
        const lp = region.localPoints;
        const normalized = new Float32Array(lp.length);

        for (let i = 0; i < lp.length; i += 3) {
          tmp.set(lp[i],lp[i+1],lp[i+2]);

          normalizePointToBounds(
            tmp,
            region.min,
            region.max,
            tmp2
          );

          normalized[i] = tmp2.x;
          normalized[i+1] = tmp2.y;
          normalized[i+2] = tmp2.z;
        }

        region.normalized = normalized;
        region.hash = buildHash(normalized);
      }

      return regions;
    }

    // =========================================================
    // REGIONAL CORRESPONDENCE
    // =========================================================

    let maleRoot;
    let femaleRoot;
    let maleBones;
    let femaleBones;

    let maleRegions;
    let femaleRegions;

    let bridgeGroup;
    let bridgeParts = [];

    let showingReference = false;

    function fallbackBoneMap(worldPos, maleBone, femaleBone) {
      worldToBoneLocal(worldPos, maleBone, tmp);
      return tmp.applyMatrix4(femaleBone.matrixWorld).clone();
    }

    function mapRegionalSurface(mesh, index, maleWorld) {
      const boneName = dominantBoneName(mesh, index);

      if (!boneName) return maleWorld.clone();

      const maleBone = maleBones.get(boneName);
      const femaleBone = femaleBones.get(boneName);

      if (!maleBone || !femaleBone) {
        return maleWorld.clone();
      }

      const mr = maleRegions.get(boneName);
      const fr = femaleRegions.get(boneName);

      if (
        !mr ||
        !fr ||
        !fr.normalized ||
        fr.normalized.length < 3
      ) {
        return fallbackBoneMap(maleWorld, maleBone, femaleBone);
      }

      // Male local point.
      worldToBoneLocal(maleWorld, maleBone, tmp);

      // Normalize using the male region's own local bounds.
      normalizePointToBounds(tmp, mr.min, mr.max, tmp2);

      const idx = nearestNormalizedIndex(
        tmp2.x,
        tmp2.y,
        tmp2.z,
        fr.normalized,
        fr.hash
      );

      if (idx < 0) {
        return fallbackBoneMap(maleWorld, maleBone, femaleBone);
      }

      // Actual female local-space point corresponding to normalized region location.
      const k = idx * 3;

      tmp.set(
        fr.localPoints[k],
        fr.localPoints[k+1],
        fr.localPoints[k+2]
      );

      // Female bone local -> world.
      return tmp.applyMatrix4(femaleBone.matrixWorld).clone();
    }

    // =========================================================
    // BUILD BRIDGE
    // =========================================================

    async function buildBridge() {
      const maleMeshes = getRenderableMeshes(maleRoot);

      bridgeGroup = new THREE.Group();
      bridgeGroup.name = "V18RegionalBridge";
      scene.add(bridgeGroup);

      bridgeParts = [];

      let regionalMapped = 0;
      let fallbackMapped = 0;
      let totalVerts = 0;

      for (let m = 0; m < maleMeshes.length; m++) {
        const source = maleMeshes[m];

        statusEl.textContent =
          `Building regional bridge ${m+1}/${maleMeshes.length}â¦`;

        const count = source.geometry.attributes.position.count;

        const start = new Float32Array(count * 3);
        const target = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
          getWorldVertex(source, i, tmp);

          const k = i * 3;
          start[k] = tmp.x;
          start[k+1] = tmp.y;
          start[k+2] = tmp.z;

          const boneName = dominantBoneName(source, i);
          const hasRegion =
            boneName &&
            maleRegions.has(boneName) &&
            femaleRegions.has(boneName);

          const mapped = mapRegionalSurface(source, i, tmp);

          target[k] = mapped.x;
          target[k+1] = mapped.y;
          target[k+2] = mapped.z;

          if (hasRegion) regionalMapped++;
          else fallbackMapped++;
        }

        const geometry = new THREE.BufferGeometry();

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(
            new Float32Array(start),
            3
          )
        );

        if (source.geometry.index) {
          geometry.setIndex(source.geometry.index.clone());
        }

        if (source.geometry.attributes.uv) {
          geometry.setAttribute(
            "uv",
            source.geometry.attributes.uv.clone()
          );
        }

        geometry.computeVertexNormals();

        let material;

        if (Array.isArray(source.material)) {
          material = source.material.map(m => m.clone());
        } else if (source.material) {
          material = source.material.clone();
        } else {
          material = new THREE.MeshStandardMaterial({
            color: 0xd7aa8c,
            roughness: 0.74
          });
        }

        const mesh = new THREE.Mesh(geometry, material);
        mesh.frustumCulled = false;

        bridgeGroup.add(mesh);

        bridgeParts.push({
          mesh,
          start,
          target
        });

        totalVerts += count;

        await new Promise(resolve => setTimeout(resolve, 0));
      }

      debugEl.textContent =
        `male regions: ${maleRegions.size}\n` +
        `female regions: ${femaleRegions.size}\n` +
        `regional mapped vertices: ${regionalMapped}\n` +
        `fallback mapped vertices: ${fallbackMapped}\n` +
        `bridge vertices: ${totalVerts}\n` +
        `method: same dominant bone + normalized local surface coordinate`;

      maleRoot.visible = false;
      femaleRoot.visible = false;
      bridgeGroup.visible = true;
    }

    // =========================================================
    // MORPH
    // =========================================================

    function smootherstep(t) {
      return t*t*t*(t*(t*6 - 15) + 10);
    }

    let normalFrame = 0;

    function applyProgress(raw) {
      const p = THREE.MathUtils.clamp(raw,0,1);
      const t = smootherstep(p);

      for (const part of bridgeParts) {
        const live =
          part.mesh.geometry.attributes.position.array;

        const a = part.start;
        const b = part.target;

        for (let i = 0; i < live.length; i++) {
          live[i] = a[i] + (b[i] - a[i]) * t;
        }

        part.mesh.geometry.attributes.position.needsUpdate = true;
      }

      normalFrame++;

      if (normalFrame % 3 === 0 || p === 0 || p === 1) {
        for (const part of bridgeParts) {
          part.mesh.geometry.computeVertexNormals();
        }
      }

      progressSlider.value = String(p);
      progressValue.textContent = Math.round(p*100) + "%";

      statusEl.textContent =
        `Regional surface transformation - ${Math.round(p*100)}%`;
    }

    // =========================================================
    // PLAYBACK
    // =========================================================

    let playing = false;
    let playStart = 0;
    const PLAY_MS = 16000;

    document.getElementById("playBtn")
      .addEventListener("click", () => {
        showingReference = false;
        femaleRoot.visible = false;
        bridgeGroup.visible = true;

        playing = true;
        playStart = performance.now();
        applyProgress(0);
      });

    document.getElementById("resetBtn")
      .addEventListener("click", () => {
        playing = false;
        showingReference = false;
        femaleRoot.visible = false;
        bridgeGroup.visible = true;
        applyProgress(0);
      });

    progressSlider.addEventListener("input", () => {
      playing = false;
      showingReference = false;
      femaleRoot.visible = false;
      bridgeGroup.visible = true;
      applyProgress(Number(progressSlider.value));
    });

    document.getElementById("femaleRefBtn")
      .addEventListener("click", () => {
        playing = false;
        showingReference = true;

        bridgeGroup.visible = false;
        maleRoot.visible = false;
        femaleRoot.visible = true;

        setBodyView();

        statusEl.textContent =
          "Real female endpoint reference.";
      });

    document.getElementById("bridgeBtn")
      .addEventListener("click", () => {
        showingReference = false;

        femaleRoot.visible = false;
        maleRoot.visible = false;
        bridgeGroup.visible = true;

        setBodyView();

        statusEl.textContent =
          "Regional bridge restored.";
      });

    // =========================================================
    // CAMERA
    // =========================================================

    let bodyView = true;
    let yaw = 0;
    let pitch = THREE.MathUtils.degToRad(-7);

    function activeVisual() {
      return showingReference ? femaleRoot : bridgeGroup;
    }

    function setBodyView() {
      bodyView = true;

      const visual = activeVisual();
      if (!visual) return;

      const b = getBounds(visual);

      camera.position.set(
        b.center.x + 1.5,
        b.box.min.y + b.size.y * 0.62,
        b.center.z + 3.0
      );

      camera.lookAt(
        b.center.x,
        b.box.min.y + b.size.y * 0.49,
        b.center.z
      );
    }

    function setFirstPerson() {
      bodyView = false;

      const visual = activeVisual();
      if (!visual) return;

      const b = getBounds(visual);

      camera.position.set(
        b.center.x,
        b.box.min.y + b.size.y * 0.925,
        b.center.z - b.size.z * 0.16
      );

      pitch = THREE.MathUtils.degToRad(-10);
    }

    function lookDown() {
      if (bodyView) setFirstPerson();

      pitch = THREE.MathUtils.degToRad(-66);

      statusEl.textContent =
        showingReference
          ? "LOOK DOWN - female endpoint."
          : "LOOK DOWN - regional bridge.";
    }

    document.getElementById("bodyViewBtn")
      .addEventListener("click", () => {
        setBodyView();

        statusEl.textContent =
          showingReference
            ? "BODY VIEW - female endpoint."
            : "BODY VIEW - regional bridge.";
      });

    document.getElementById("lookBtn")
      .addEventListener("click", lookDown);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const sensitivity = 0.004;

    function startDrag(x,y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function drag(x,y) {
      if (!dragging || bodyView) return;

      const dx = x-lastX;
      const dy = y-lastY;

      lastX = x;
      lastY = y;

      yaw -= dx*sensitivity;
      pitch -= dy*sensitivity;

      pitch = THREE.MathUtils.clamp(
        pitch,
        THREE.MathUtils.degToRad(-88),
        THREE.MathUtils.degToRad(70)
      );
    }

    function endDrag() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      e => {
        if (e.touches.length === 1) {
          startDrag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      e => {
        if (e.touches.length === 1) {
          e.preventDefault();
          drag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endDrag);
    renderer.domElement.addEventListener("touchcancel", endDrag);

    const euler = new THREE.Euler(0,0,0,"YXZ");

    // =========================================================
    // LOOP
    // =========================================================

    function animate(now) {
      requestAnimationFrame(animate);

      if (playing) {
        let p = (now-playStart)/PLAY_MS;

        if (p >= 1) {
          p = 1;
          playing = false;
        }

        applyProgress(p);
      }

      if (!bodyView) {
        euler.set(pitch,yaw,0);
        camera.quaternion.setFromEuler(euler);
      }

      renderer.render(scene,camera);
    }

    animate();

    // =========================================================
    // SETUP
    // =========================================================

    async function setup() {
      statusEl.textContent =
        "Loading real male endpointâ¦";
      const maleGLTF =
        await loadGLB("./adult-male-lod.glb");

      statusEl.textContent =
        "Loading real female endpointâ¦";
      const femaleGLTF =
        await loadGLB("./adult-female-lod.glb");

      maleRoot = maleGLTF.scene;
      femaleRoot = femaleGLTF.scene;

      scene.add(maleRoot);
      scene.add(femaleRoot);

      normalizeModel(maleRoot,1.80);
      normalizeModel(femaleRoot,1.65);

      maleBones = collectBones(maleRoot);
      femaleBones = collectBones(femaleRoot);

      maleRoot.updateMatrixWorld(true);
      femaleRoot.updateMatrixWorld(true);

      statusEl.textContent =
        "Building male anatomical regionsâ¦";
      maleRegions = buildRegions(maleRoot,maleBones);

      statusEl.textContent =
        "Building female anatomical regionsâ¦";
      femaleRegions = buildRegions(femaleRoot,femaleBones);

      maleRoot.visible = false;
      femaleRoot.visible = false;

      await buildBridge();

      applyProgress(0);
      setBodyView();

      loading.style.display = "none";

      statusEl.textContent =
        "V18 ready. PLAY MORPH maps each male surface region only to the matching female bone region.";
    }

    setup().catch(fail);

    window.addEventListener("resize", () => {
      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
      );
    });
  </script>
</body>
</html>
