<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game V29 - Safe Material + Texture Morph</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101217;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 700px;
      margin: auto;
      padding: 11px 13px;
      border-radius: 17px;
      color: white;
      background: rgba(0,0,0,0.67);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .debug {
      margin-top: 4px;
      font-size: 10px;
      line-height: 1.35;
      opacity: 0.74;
      white-space: pre-line;
    }

    #hud.uiHidden,
    #controls.uiHidden {
      display: none;
    }

    #uiToggle {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 10px);
      right: 10px;
      z-index: 300;
      min-width: 0;
      width: auto;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(12,14,18,0.82);
      color: white;
      font-size: 11px;
      font-weight: 800;
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    #uiToggle.uiIsHidden {
      background: rgba(255,255,255,0.90);
      color: #111;
    }

    #controls {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      z-index: 30;
      max-height: 44vh;
      overflow: auto;
      border-radius: 18px;
      background: rgba(12,14,18,0.93);
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    #buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 11px;
      min-width: 92px;
      color: #111;
      background: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 800;
    }

    button:active {
      transform: scale(0.97);
    }

    .controlRow {
      padding: 9px 2px;
      border-top: 1px solid rgba(255,255,255,0.09);
    }

    .labelLine {
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .value {
      opacity: 0.8;
      min-width: 44px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #101217;
      color: white;
      font-size: 16px;
      font-weight: 800;
    }

    #fatal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 18%;
      left: 15px;
      right: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #761c1c;
      color: white;
      font: 700 13px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="game"></div>
  <button id="uiToggle" type="button">HIDE UI</button>
  <div id="loading">Loading V29...</div>
  <div id="fatal"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game - V29 Safe Material + Texture Morph</div>
      <div id="status" class="status">Loading both real endpoint humans...</div>
      <div id="debug" class="debug"></div>
    </div>
  </div>

  <div id="controls">
    <div id="buttons">
      <button id="bodyViewBtn">BODY VIEW</button>
      <button id="lookBtn">LOOK DOWN</button>
      <button id="resetBtn">RESET</button>
      <button id="playBtn">PLAY MORPH</button>
      <button id="maleRefBtn">MALE REF</button>
      <button id="femaleRefBtn">FEMALE REF</button>
      <button id="bridgeBtn">BRIDGE</button>
      <button id="resetCameraBtn">RESET CAMERA</button>
    </div>

    <div class="controlRow">
      <div class="labelLine">
        <span>WEIGHTED BODY TRANSFORMATION</span>
        <span id="progressValue" class="value">0%</span>
      </div>
      <input id="progressSlider" type="range" min="0" max="1" step="0.001" value="0">
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const loading = document.getElementById("loading");
    const fatal = document.getElementById("fatal");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const progressSlider = document.getElementById("progressSlider");
    const progressValue = document.getElementById("progressValue");
    const hudEl = document.getElementById("hud");
    const controlsEl = document.getElementById("controls");
    const uiToggle = document.getElementById("uiToggle");

    let uiHidden = false;

    function setUIHidden(hidden) {
      uiHidden = hidden;

      hudEl.classList.toggle(
        "uiHidden",
        hidden
      );

      controlsEl.classList.toggle(
        "uiHidden",
        hidden
      );

      uiToggle.classList.toggle(
        "uiIsHidden",
        hidden
      );

      uiToggle.textContent =
        hidden
          ? "SHOW UI"
          : "HIDE UI";
    }

    uiToggle.addEventListener(
      "click",
      () => {
        setUIHidden(
          !uiHidden
        );
      }
    );

    function fail(error) {
      console.error(error);
      loading.style.display = "none";
      fatal.style.display = "block";
      fatal.textContent =
        "V29 ERROR\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nSend me a screenshot of this red box.";
    }

    window.addEventListener("error", e => {
      if (e.error) fail(e.error);
    });

    window.addEventListener("unhandledrejection", e => {
      fail(e.reason);
    });

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94d7f2);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.015,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.getElementById("game").appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x65727b, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(4, 8, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xdceaff, 1.0);
    fill.position.set(-4, 4, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xa2a5a8,
        roughness: 0.95
      })
    );

    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function roomBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.88
        })
      );

      mesh.position.set(x,y,z);
      mesh.scale.set(sx,sy,sz);
      scene.add(mesh);
    }

    roomBox(0, 1.5, -6, 10, 3, 0.2, 0xd8dde1);
    roomBox(-5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);
    roomBox(5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);

    // =========================================================
    // LOAD + MODEL HELPERS
    // =========================================================

    const loader = new GLTFLoader();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    }

    function getBounds(root) {
      root.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      return { box, size, center };
    }

    function normalizeModel(root, targetHeight) {
      let b = getBounds(root);

      if (!isFinite(b.size.y) || b.size.y <= 0.001) {
        throw new Error("Invalid model bounds.");
      }

      const scale = targetHeight / b.size.y;
      root.scale.multiplyScalar(scale);
      root.updateMatrixWorld(true);

      b = getBounds(root);

      root.position.x -= b.center.x;
      root.position.z -= b.center.z;
      root.position.y -= b.box.min.y;

      root.updateMatrixWorld(true);
    }

    function collectBones(root) {
      const map = new Map();

      root.traverse(obj => {
        if (obj.isBone && obj.name) {
          map.set(obj.name, obj);
        }
      });

      return map;
    }

    function getRenderableMeshes(root) {
      const out = [];

      root.traverse(obj => {
        if (
          (obj.isMesh || obj.isSkinnedMesh) &&
          obj.geometry?.attributes?.position
        ) {
          out.push(obj);
        }
      });

      return out;
    }

    // =========================================================
    // VERTEX / SKIN HELPERS
    // =========================================================

    const tmp = new THREE.Vector3();
    const tmp2 = new THREE.Vector3();
    const tmp3 = new THREE.Vector3();
    const accum = new THREE.Vector3();
    const inv = new THREE.Matrix4();

    function getWorldVertex(mesh, index, target) {
      // V24: use the Three.js vertex path that includes morph targets.
      // On SkinnedMesh this also includes skinning.
      if (typeof mesh.getVertexPosition === "function") {
        mesh.getVertexPosition(index, target);
        return mesh.localToWorld(target);
      }

      // Compatibility fallback.
      target.fromBufferAttribute(
        mesh.geometry.attributes.position,
        index
      );

      if (mesh.isSkinnedMesh && mesh.skeleton) {
        mesh.applyBoneTransform(index, target);
      }

      return mesh.localToWorld(target);
    }

    function worldToBoneLocal(world, bone, target) {
      inv.copy(bone.matrixWorld).invert();
      return target.copy(world).applyMatrix4(inv);
    }

    function getSkinInfluences(mesh, index) {
      if (
        !mesh.isSkinnedMesh ||
        !mesh.skeleton ||
        !mesh.geometry.attributes.skinIndex ||
        !mesh.geometry.attributes.skinWeight
      ) {
        return [];
      }

      const si = mesh.geometry.attributes.skinIndex;
      const sw = mesh.geometry.attributes.skinWeight;

      const ids = [
        si.getX(index),
        si.getY(index),
        si.getZ(index),
        si.getW(index)
      ];

      const ws = [
        sw.getX(index),
        sw.getY(index),
        sw.getZ(index),
        sw.getW(index)
      ];

      const out = [];

      for (let k = 0; k < 4; k++) {
        const weight = ws[k];

        if (weight <= 0.00001) continue;

        const bone = mesh.skeleton.bones[ids[k]];

        if (!bone || !bone.name) continue;

        out.push({
          bone,
          boneName: bone.name,
          weight
        });
      }

      return out;
    }

    // =========================================================
    // BONE VOLUMES
    // =========================================================

    function ensureVolume(map, boneName) {
      let v = map.get(boneName);

      if (!v) {
        v = {
          boneName,
          min: new THREE.Vector3(
            +Infinity,+Infinity,+Infinity
          ),
          max: new THREE.Vector3(
            -Infinity,-Infinity,-Infinity
          ),
          count: 0
        };

        map.set(boneName, v);
      }

      return v;
    }

    function expandVolume(volume, p) {
      volume.min.min(p);
      volume.max.max(p);
      volume.count++;
    }

    function buildBoneVolumes(root, boneMap) {
      const volumes = new Map();
      const meshes = getRenderableMeshes(root);

      for (const mesh of meshes) {
        const count =
          mesh.geometry.attributes.position.count;

        for (let i = 0; i < count; i++) {
          const influences =
            getSkinInfluences(mesh, i);

          if (influences.length === 0) continue;

          getWorldVertex(mesh, i, tmp);

          for (const influence of influences) {
            // Ignore tiny weights when estimating anatomical volume.
            if (influence.weight < 0.02) continue;

            const bone =
              boneMap.get(influence.boneName);

            if (!bone) continue;

            worldToBoneLocal(
              tmp,
              bone,
              tmp2
            );

            const volume =
              ensureVolume(
                volumes,
                influence.boneName
              );

            expandVolume(
              volume,
              tmp2
            );
          }
        }
      }

      return volumes;
    }

    function normalizedInVolume(local, volume, target) {
      const sx =
        Math.max(
          1e-5,
          volume.max.x - volume.min.x
        );

      const sy =
        Math.max(
          1e-5,
          volume.max.y - volume.min.y
        );

      const sz =
        Math.max(
          1e-5,
          volume.max.z - volume.min.z
        );

      target.set(
        (local.x - volume.min.x) / sx,
        (local.y - volume.min.y) / sy,
        (local.z - volume.min.z) / sz
      );

      // Softly clamp outliers so one strange vertex cannot explode.
      target.x = THREE.MathUtils.clamp(target.x, -0.08, 1.08);
      target.y = THREE.MathUtils.clamp(target.y, -0.08, 1.08);
      target.z = THREE.MathUtils.clamp(target.z, -0.08, 1.08);

      return target;
    }

    function denormalizeInVolume(n, volume, target) {
      target.set(
        THREE.MathUtils.lerp(
          volume.min.x,
          volume.max.x,
          n.x
        ),
        THREE.MathUtils.lerp(
          volume.min.y,
          volume.max.y,
          n.y
        ),
        THREE.MathUtils.lerp(
          volume.min.z,
          volume.max.z,
          n.z
        )
      );

      return target;
    }

    // =========================================================
    // UNSKINNED MESH FALLBACK
    // =========================================================

    function meshInfo(mesh) {
      return {
        mesh,
        vertices:
          mesh.geometry.attributes.position.count,
        indices:
          mesh.geometry.index?.count || 0,
        name:
          mesh.name || "(unnamed)"
      };
    }

    function pairMeshesBySize(femaleMeshes, maleMeshes) {
      const maleInfo =
        maleMeshes.map(meshInfo);

      const used = new Set();
      const map = new Map();

      for (const female of femaleMeshes.map(meshInfo)) {
        let bestIndex = -1;
        let bestScore = Infinity;

        // Prefer exact mesh names when possible.
        for (let i = 0; i < maleInfo.length; i++) {
          if (used.has(i)) continue;

          const male = maleInfo[i];

          let score =
            Math.abs(female.vertices - male.vertices) +
            Math.abs(female.indices - male.indices) * 0.05;

          if (
            female.name !== "(unnamed)" &&
            female.name === male.name
          ) {
            score -= 100000;
          }

          if (score < bestScore) {
            bestScore = score;
            bestIndex = i;
          }
        }

        if (bestIndex >= 0) {
          used.add(bestIndex);
          map.set(
            female.mesh,
            maleInfo[bestIndex].mesh
          );
        }
      }

      return map;
    }

    function getMeshWorldBounds(mesh) {
      const count =
        mesh.geometry.attributes.position.count;

      const min =
        new THREE.Vector3(
          +Infinity,+Infinity,+Infinity
        );

      const max =
        new THREE.Vector3(
          -Infinity,-Infinity,-Infinity
        );

      for (let i = 0; i < count; i++) {
        getWorldVertex(mesh, i, tmp);
        min.min(tmp);
        max.max(tmp);
      }

      return { min, max };
    }

    function normalizeWorldInBounds(p, bounds, target) {
      const sx =
        Math.max(1e-5, bounds.max.x - bounds.min.x);
      const sy =
        Math.max(1e-5, bounds.max.y - bounds.min.y);
      const sz =
        Math.max(1e-5, bounds.max.z - bounds.min.z);

      return target.set(
        (p.x - bounds.min.x) / sx,
        (p.y - bounds.min.y) / sy,
        (p.z - bounds.min.z) / sz
      );
    }

    function denormalizeWorldInBounds(n, bounds, target) {
      return target.set(
        THREE.MathUtils.lerp(
          bounds.min.x,
          bounds.max.x,
          n.x
        ),
        THREE.MathUtils.lerp(
          bounds.min.y,
          bounds.max.y,
          n.y
        ),
        THREE.MathUtils.lerp(
          bounds.min.z,
          bounds.max.z,
          n.z
        )
      );
    }

    // =========================================================
    // SAFE MODEL MATERIAL / TEXTURE MORPH
    // =========================================================
    //
    // V29 intentionally does NOT patch Three.js shaders and does NOT
    // guess external texture filenames. It uses whatever materials/maps
    // GLTFLoader already loaded from the two .glb files.
    //
    // The male material is the opaque base layer.
    // The female material is a transparent overlay that gradually becomes
    // opaque during the morph. This keeps the body visible even if a
    // material or texture is missing.

    let embeddedMaleMapCount = 0;
    let embeddedFemaleMapCount = 0;
    let embeddedMaleMaterialCount = 0;
    let embeddedFemaleMaterialCount = 0;

    function materialArray(material) {
      if (Array.isArray(material)) {
        return material.filter(Boolean);
      }

      return material
        ? [material]
        : [];
    }

    function inspectModelMaterials(root, sexLabel) {
      let materialCount = 0;
      let mapCount = 0;

      root.traverse(obj => {
        if (
          !obj.isMesh &&
          !obj.isSkinnedMesh
        ) {
          return;
        }

        for (const mat of materialArray(obj.material)) {
          materialCount++;

          if (mat.map) {
            mapCount++;
          }
        }
      });

      if (sexLabel === "male") {
        embeddedMaleMaterialCount =
          materialCount;

        embeddedMaleMapCount =
          mapCount;
      } else {
        embeddedFemaleMaterialCount =
          materialCount;

        embeddedFemaleMapCount =
          mapCount;
      }
    }

    function cloneOpaqueMaterial(mat, fallbackColor = 0xd5ad94) {
      const clone =
        mat
          ? mat.clone()
          : new THREE.MeshStandardMaterial({
              color: fallbackColor,
              roughness: 0.78,
              metalness: 0.0
            });

      clone.transparent =
        false;

      clone.opacity =
        1;

      clone.depthWrite =
        true;

      clone.depthTest =
        true;

      clone.polygonOffset =
        false;

      clone.side =
        THREE.FrontSide;

      clone.needsUpdate =
        true;

      return clone;
    }

    function cloneFemaleOverlayMaterial(mat, fallbackColor = 0xe0b79e) {
      const clone =
        mat
          ? mat.clone()
          : new THREE.MeshStandardMaterial({
              color: fallbackColor,
              roughness: 0.76,
              metalness: 0.0
            });

      clone.transparent =
        true;

      clone.opacity =
        0;

      // Male base remains the depth-writing surface.
      clone.depthWrite =
        false;

      clone.depthTest =
        true;

      // Pull the overlay slightly forward in depth without changing geometry.
      clone.polygonOffset =
        true;

      clone.polygonOffsetFactor =
        -1;

      clone.polygonOffsetUnits =
        -1;

      clone.side =
        THREE.FrontSide;

      clone.needsUpdate =
        true;

      return clone;
    }

    function cloneMaterialSet(material, overlay = false) {
      const source =
        materialArray(material);

      if (source.length === 0) {
        return overlay
          ? cloneFemaleOverlayMaterial(null)
          : cloneOpaqueMaterial(null);
      }

      const cloned =
        source.map(mat =>
          overlay
            ? cloneFemaleOverlayMaterial(mat)
            : cloneOpaqueMaterial(mat)
        );

      return Array.isArray(material)
        ? cloned
        : cloned[0];
    }

    function setMaterialOpacity(material, opacity) {
      for (const mat of materialArray(material)) {
        mat.opacity =
          opacity;

        mat.visible =
          opacity > 0.001;
      }
    }

    function copyGeometryGroups(sourceGeometry, targetGeometry) {
      targetGeometry.clearGroups();

      if (
        !sourceGeometry.groups ||
        sourceGeometry.groups.length === 0
      ) {
        return;
      }

      for (const group of sourceGeometry.groups) {
        targetGeometry.addGroup(
          group.start,
          group.count,
          group.materialIndex
        );
      }
    }

    // =========================================================
    // BRIDGE DATA
    // =========================================================

    let maleRoot;
    let femaleRoot;

    let maleBones;
    let femaleBones;

    let maleVolumes;
    let femaleVolumes;

    let bridgeGroup;
    let bridgeParts = [];

    let showing = "bridge";

    let femaleToMaleMesh = new Map();
    let femaleMeshBounds = new Map();
    let maleMeshBounds = new Map();
    let femaleBodyBounds;
    let femaleSemanticBounds;
    let femaleMorphReport = "not applied";

    const CURVE_PROFILE = {
      // The target starts from the actual female model.
      // These are moderate, localized adjustments only.
      bustForward: 0.30,
      bustSide: 0.020,
      waistScale: 0.055,
      hipScale: 0.060,
      thighScale: 0.024,
      gluteDepth: 0.075,
      abdomenFlatten: 0.030
    };

    const FEMALE_AUTHORED_MORPHS = {
      skinny: 0.02,
      muscular: 0.22,
      obese: 0.00
    };

    function bell(value, centerValue, width) {
      const d =
        (value - centerValue) /
        Math.max(0.0001, width);

      return Math.exp(
        -0.5 * d * d
      );
    }

    function semanticWeightsForVertex(mesh, index) {
      const influences =
        getSkinInfluences(mesh, index);

      const out = {
        torso: 0,
        pelvis: 0,
        thigh: 0,
        lowerLeg: 0,
        arm: 0,
        head: 0,
        known: 0
      };

      for (const influence of influences) {
        const n =
          influence.boneName
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "");

        const w =
          influence.weight;

        // Order matters. UpLeg must be recognized before generic Leg.
        if (
          n.includes("upleg") ||
          n.includes("upperleg") ||
          n.includes("thigh")
        ) {
          out.thigh += w;
          out.known += w;
          continue;
        }

        if (
          n.includes("forearm") ||
          n.includes("lowerarm") ||
          n.includes("upperarm") ||
          n.includes("shoulder") ||
          n.includes("clav") ||
          n.includes("wrist") ||
          n.includes("hand") ||
          n.includes("arm")
        ) {
          out.arm += w;
          out.known += w;
          continue;
        }

        if (
          n.includes("head") ||
          n.includes("neck") ||
          n.includes("jaw") ||
          n.includes("eye")
        ) {
          out.head += w;
          out.known += w;
          continue;
        }

        if (
          n.includes("foot") ||
          n.includes("toe") ||
          n.includes("calf") ||
          n.includes("shin") ||
          n.includes("lowerleg") ||
          n.endsWith("leg")
        ) {
          out.lowerLeg += w;
          out.known += w;
          continue;
        }

        if (
          n.includes("hips") ||
          n.includes("pelvis")
        ) {
          out.pelvis += w;
          out.known += w;
          continue;
        }

        if (
          n.includes("spine") ||
          n.includes("chest") ||
          n.includes("rib") ||
          n.includes("torso")
        ) {
          out.torso += w;
          out.known += w;
          continue;
        }
      }

      return out;
    }

    function preciseVertexBounds(root) {
      const box =
        new THREE.Box3();

      box.makeEmpty();

      for (const mesh of getRenderableMeshes(root)) {
        const count =
          mesh.geometry.attributes.position.count;

        for (let i = 0; i < count; i++) {
          getWorldVertex(
            mesh,
            i,
            tmp
          );

          box.expandByPoint(
            tmp
          );
        }
      }

      const size =
        new THREE.Vector3();

      const center =
        new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      return {
        box,
        size,
        center
      };
    }

    function finalizedBox(box, fallback) {
      if (
        box.isEmpty() ||
        !isFinite(box.min.x) ||
        !isFinite(box.max.x)
      ) {
        return fallback;
      }

      const size =
        new THREE.Vector3();

      const center =
        new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      return {
        box,
        size,
        center
      };
    }

    function buildFemaleSemanticBounds() {
      const whole =
        preciseVertexBounds(femaleRoot);

      const torsoBox =
        new THREE.Box3().makeEmpty();

      const lowerBox =
        new THREE.Box3().makeEmpty();

      const pelvisBox =
        new THREE.Box3().makeEmpty();

      let torsoSamples = 0;
      let lowerSamples = 0;
      let pelvisSamples = 0;

      for (const mesh of getRenderableMeshes(femaleRoot)) {
        const count =
          mesh.geometry.attributes.position.count;

        for (let i = 0; i < count; i++) {
          const semantic =
            semanticWeightsForVertex(
              mesh,
              i
            );

          getWorldVertex(
            mesh,
            i,
            tmp
          );

          const torsoEligible =
            semantic.torso > 0.16 &&
            semantic.arm < 0.55 &&
            semantic.head < 0.55;

          if (torsoEligible) {
            torsoBox.expandByPoint(tmp);
            torsoSamples++;
          }

          const lowerWeight =
            semantic.pelvis +
            semantic.thigh;

          const lowerEligible =
            lowerWeight > 0.16 &&
            semantic.arm < 0.30 &&
            semantic.head < 0.30 &&
            semantic.lowerLeg < 0.70;

          if (lowerEligible) {
            lowerBox.expandByPoint(tmp);
            lowerSamples++;
          }

          if (
            semantic.pelvis > 0.14 &&
            semantic.arm < 0.25
          ) {
            pelvisBox.expandByPoint(tmp);
            pelvisSamples++;
          }
        }
      }

      return {
        whole,
        torso:
          finalizedBox(
            torsoBox,
            whole
          ),
        lower:
          finalizedBox(
            lowerBox,
            whole
          ),
        pelvis:
          finalizedBox(
            pelvisBox,
            whole
          ),
        torsoSamples,
        lowerSamples,
        pelvisSamples
      };
    }

    function setFemaleAuthoredMorphs(root) {
      let changedMeshes = 0;
      let skinnyHits = 0;
      let muscularHits = 0;
      let obeseHits = 0;

      root.traverse(obj => {
        if (
          (!obj.isMesh && !obj.isSkinnedMesh) ||
          !obj.morphTargetDictionary ||
          !obj.morphTargetInfluences
        ) {
          return;
        }

        let changedThisMesh =
          false;

        for (
          const [name, idx]
          of Object.entries(
            obj.morphTargetDictionary
          )
        ) {
          const n =
            name.toLowerCase();

          if (n.includes("skinny")) {
            obj.morphTargetInfluences[idx] =
              FEMALE_AUTHORED_MORPHS.skinny;

            skinnyHits++;
            changedThisMesh = true;
          }

          if (n.includes("muscular")) {
            obj.morphTargetInfluences[idx] =
              FEMALE_AUTHORED_MORPHS.muscular;

            muscularHits++;
            changedThisMesh = true;
          }

          if (n.includes("obese")) {
            obj.morphTargetInfluences[idx] =
              FEMALE_AUTHORED_MORPHS.obese;

            obeseHits++;
            changedThisMesh = true;
          }
        }

        if (changedThisMesh) {
          changedMeshes++;
        }
      });

      femaleMorphReport =
        `authored female morphs: muscular ${FEMALE_AUTHORED_MORPHS.muscular.toFixed(2)}, ` +
        `skinny ${FEMALE_AUTHORED_MORPHS.skinny.toFixed(2)}, obese 0.00 ` +
        `(${changedMeshes} meshes; M:${muscularHits} S:${skinnyHits} O:${obeseHits})`;
    }

    function stylizeCurvyFemaleVertex(
      mesh,
      index,
      world
    ) {
      if (
        !femaleSemanticBounds
      ) {
        return world.clone();
      }

      const out =
        world.clone();

      const semantic =
        semanticWeightsForVertex(
          mesh,
          index
        );

      // Protect limbs/head from body-shaping operations.
      const protectedWeight =
        THREE.MathUtils.clamp(
          semantic.arm * 1.15 +
          semantic.head * 1.20 +
          semantic.lowerLeg * 0.90,
          0,
          1
        );

      const editable =
        1 - protectedWeight;

      if (
        editable <= 0.001
      ) {
        return out;
      }

      const whole =
        femaleSemanticBounds.whole;

      const torso =
        femaleSemanticBounds.torso;

      const lower =
        femaleSemanticBounds.lower;

      const bodyNy =
        THREE.MathUtils.clamp(
          (world.y - whole.box.min.y) /
          Math.max(
            0.0001,
            whole.size.y
          ),
          0,
          1
        );

      // -------------------------------------------------------
      // CHEST
      // -------------------------------------------------------
      // Normalize against torso bounds, NOT total arm-span bounds.
      const torsoHalfW =
        Math.max(
          0.0001,
          torso.size.x * 0.5
        );

      const torsoHalfD =
        Math.max(
          0.0001,
          torso.size.z * 0.5
        );

      const tx =
        (world.x - torso.center.x) /
        torsoHalfW;

      const tz =
        (world.z - torso.center.z) /
        torsoHalfD;

      const absTx =
        Math.abs(tx);

      const side =
        tx < 0 ? -1 : 1;

      const torsoEdit =
        THREE.MathUtils.clamp(
          semantic.torso * editable,
          0,
          1
        );

      const chestY =
        bell(
          bodyNy,
          0.685,
          0.058
        );

      const lobeX =
        bell(
          absTx,
          0.30,
          0.18
        );

      const sternumGap =
        THREE.MathUtils.smoothstep(
          absTx,
          0.08,
          0.19
        );

      const outerFade =
        1 -
        THREE.MathUtils.smoothstep(
          absTx,
          0.66,
          0.96
        );

      // Model faces +Z in the current body view.
      const frontness =
        THREE.MathUtils.smoothstep(
          tz,
          -0.10,
          0.48
        );

      const bust =
        chestY *
        lobeX *
        sternumGap *
        outerFade *
        frontness *
        torsoEdit;

      // Bigger chest comes mainly from DEPTH, not wider ribcage.
      out.z +=
        torso.size.z *
        CURVE_PROFILE.bustForward *
        bust;

      // Only a tiny amount of lateral fullness inside the lobes.
      out.x +=
        side *
        torso.size.x *
        CURVE_PROFILE.bustSide *
        bust;

      out.y -=
        whole.size.y *
        0.0045 *
        bust;

      // -------------------------------------------------------
      // ATHLETIC WAIST / ABDOMEN
      // -------------------------------------------------------
      const waistBand =
        bell(
          bodyNy,
          0.555,
          0.073
        );

      const waistEdit =
        waistBand *
        torsoEdit;

      out.x =
        torso.center.x +
        (out.x - torso.center.x) *
        (
          1 -
          CURVE_PROFILE.waistScale *
          waistEdit
        );

      const abdomenBand =
        bell(
          bodyNy,
          0.565,
          0.082
        );

      // Flatten only the front abdomen.
      out.z -=
        torso.size.z *
        CURVE_PROFILE.abdomenFlatten *
        abdomenBand *
        frontness *
        torsoEdit;

      // -------------------------------------------------------
      // HIPS / THIGHS
      // -------------------------------------------------------
      const lowerHalfW =
        Math.max(
          0.0001,
          lower.size.x * 0.5
        );

      const lowerHalfD =
        Math.max(
          0.0001,
          lower.size.z * 0.5
        );

      const lz =
        (world.z - lower.center.z) /
        lowerHalfD;

      const pelvisEdit =
        THREE.MathUtils.clamp(
          (
            semantic.pelvis +
            semantic.thigh * 0.32
          ) *
          editable,
          0,
          1
        );

      const thighEdit =
        THREE.MathUtils.clamp(
          semantic.thigh *
          editable,
          0,
          1
        );

      // Smooth overlapping profiles: no abrupt horizontal hip shelf.
      const hipBand =
        bell(
          bodyNy,
          0.465,
          0.095
        );

      const thighBand =
        bell(
          bodyNy,
          0.335,
          0.115
        );

      const hipScale =
        1 +
        CURVE_PROFILE.hipScale *
        hipBand *
        pelvisEdit;

      const thighScale =
        1 +
        CURVE_PROFILE.thighScale *
        thighBand *
        thighEdit;

      out.x =
        lower.center.x +
        (out.x - lower.center.x) *
        hipScale *
        thighScale;

      // Restrained athletic glute projection only on the rear surface.
      const backness =
        1 -
        THREE.MathUtils.smoothstep(
          lz,
          -0.34,
          0.06
        );

      const gluteBand =
        bell(
          bodyNy,
          0.455,
          0.085
        );

      out.z -=
        lower.size.z *
        CURVE_PROFILE.gluteDepth *
        gluteBand *
        backness *
        pelvisEdit;

      return out;
    }

    function mapFemaleVertexToMaleStart(femaleMesh, index, femaleWorld) {
      const influences =
        getSkinInfluences(femaleMesh, index);

      if (influences.length > 0) {
        accum.set(0,0,0);

        let totalWeight = 0;

        for (const influence of influences) {
          const boneName =
            influence.boneName;

          const femaleBone =
            femaleBones.get(boneName);

          const maleBone =
            maleBones.get(boneName);

          if (!femaleBone || !maleBone) {
            continue;
          }

          const fv =
            femaleVolumes.get(boneName);

          const mv =
            maleVolumes.get(boneName);

          // If volume information exists on both bodies:
          // female bone-local coordinate -> normalized anatomical volume
          // -> male anatomical volume -> male bone world coordinate.
          if (
            fv &&
            mv &&
            fv.count >= 2 &&
            mv.count >= 2
          ) {
            worldToBoneLocal(
              femaleWorld,
              femaleBone,
              tmp
            );

            normalizedInVolume(
              tmp,
              fv,
              tmp2
            );

            denormalizeInVolume(
              tmp2,
              mv,
              tmp3
            );

            tmp3.applyMatrix4(
              maleBone.matrixWorld
            );
          } else {
            // Shared-rig fallback:
            // preserve raw bone-local coordinates.
            worldToBoneLocal(
              femaleWorld,
              femaleBone,
              tmp3
            );

            tmp3.applyMatrix4(
              maleBone.matrixWorld
            );
          }

          accum.addScaledVector(
            tmp3,
            influence.weight
          );

          totalWeight +=
            influence.weight;
        }

        if (totalWeight > 0.00001) {
          accum.multiplyScalar(
            1 / totalWeight
          );

          return accum.clone();
        }
      }

      // Non-skinned fallback uses mesh-level normalized coordinates.
      const maleMesh =
        femaleToMaleMesh.get(femaleMesh);

      if (maleMesh) {
        const fb =
          femaleMeshBounds.get(femaleMesh);

        const mb =
          maleMeshBounds.get(maleMesh);

        if (fb && mb) {
          normalizeWorldInBounds(
            femaleWorld,
            fb,
            tmp
          );

          denormalizeWorldInBounds(
            tmp,
            mb,
            tmp2
          );

          return tmp2.clone();
        }
      }

      return femaleWorld.clone();
    }

    async function buildBridge() {
      const femaleMeshes =
        getRenderableMeshes(femaleRoot);

      const maleMeshes =
        getRenderableMeshes(maleRoot);

      femaleToMaleMesh =
        pairMeshesBySize(
          femaleMeshes,
          maleMeshes
        );

      // Precompute fallback world bounds once.
      for (const mesh of femaleMeshes) {
        femaleMeshBounds.set(
          mesh,
          getMeshWorldBounds(mesh)
        );
      }

      for (const mesh of maleMeshes) {
        maleMeshBounds.set(
          mesh,
          getMeshWorldBounds(mesh)
        );
      }

      bridgeGroup =
        new THREE.Group();

      bridgeGroup.name =
        "V20WeightedBoneVolumeBridge";

      scene.add(bridgeGroup);

      bridgeParts = [];

      let exactFemaleTargetVertices = 0;
      let weightedVertices = 0;
      let fallbackVertices = 0;

      for (
        let meshIndex = 0;
        meshIndex < femaleMeshes.length;
        meshIndex++
      ) {
        const femaleMesh =
          femaleMeshes[meshIndex];

        statusEl.textContent =
          `Building weighted bridge ${meshIndex + 1}/${femaleMeshes.length}...`;

        const count =
          femaleMesh.geometry.attributes.position.count;

        const start =
          new Float32Array(count * 3);

        const target =
          new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
          getWorldVertex(
            femaleMesh,
            i,
            tmp
          );

          const femaleWorld =
            tmp.clone();

          const k =
            i * 3;

          // Curvier endpoint: start from the real female world vertex,
          // then apply a stylized curvy-body enhancement so the transformation reads more clearly.
          const targetWorld =
            stylizeCurvyFemaleVertex(
              femaleMesh,
              i,
              femaleWorld
            );

          target[k] =
            targetWorld.x;

          target[k + 1] =
            targetWorld.y;

          target[k + 2] =
            targetWorld.z;

          exactFemaleTargetVertices++;

          const influences =
            getSkinInfluences(
              femaleMesh,
              i
            );

          const maleStart =
            mapFemaleVertexToMaleStart(
              femaleMesh,
              i,
              femaleWorld
            );

          if (influences.length > 0) {
            weightedVertices++;
          } else {
            fallbackVertices++;
          }

          start[k] =
            maleStart.x;

          start[k + 1] =
            maleStart.y;

          start[k + 2] =
            maleStart.z;
        }

        const geometry =
          new THREE.BufferGeometry();

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(
            new Float32Array(start),
            3
          )
        );

        // Keep female topology the whole time.
        // This guarantees the bridge is EXACT female geometry at 100%.
        if (femaleMesh.geometry.index) {
          geometry.setIndex(
            femaleMesh.geometry.index.clone()
          );
        }

        if (femaleMesh.geometry.attributes.uv) {
          geometry.setAttribute(
            "uv",
            femaleMesh.geometry.attributes.uv.clone()
          );
        }

        // Preserve the source GLB's material slots/groups.
        copyGeometryGroups(
          femaleMesh.geometry,
          geometry
        );

        geometry.computeVertexNormals();

        const maleSourceMesh =
          femaleToMaleMesh.get(
            femaleMesh
          );

        const maleMaterial =
          cloneMaterialSet(
            maleSourceMesh?.material || femaleMesh.material,
            false
          );

        const femaleMaterial =
          cloneMaterialSet(
            femaleMesh.material,
            true
          );

        // One shared geometry, two material layers.
        // The opaque male layer guarantees the model never disappears.
        const bridgeMesh =
          new THREE.Mesh(
            geometry,
            maleMaterial
          );

        bridgeMesh.frustumCulled =
          false;

        const femaleOverlayMesh =
          new THREE.Mesh(
            geometry,
            femaleMaterial
          );

        femaleOverlayMesh.frustumCulled =
          false;

        femaleOverlayMesh.renderOrder =
          2;

        bridgeGroup.add(
          bridgeMesh
        );

        bridgeGroup.add(
          femaleOverlayMesh
        );

        bridgeParts.push({
          mesh: bridgeMesh,
          femaleOverlayMesh,
          femaleMaterial,
          start,
          target
        });

        await new Promise(
          resolve =>
            setTimeout(resolve, 0)
        );
      }

      const sharedBones =
        [...femaleBones.keys()]
          .filter(name =>
            maleBones.has(name)
          ).length;

      debugEl.textContent =
        `shared bones: ${sharedBones}\n` +
        `female bone volumes: ${femaleVolumes.size}\n` +
        `male bone volumes: ${maleVolumes.size}\n` +
        `weighted vertices: ${weightedVertices}\n` +
        `mesh fallback vertices: ${fallbackVertices}\n` +
        `exact female target vertices: ${exactFemaleTargetVertices}\n` +
        `correspondence: full skin-weight blend + normalized bone volume\n` +
        `rank sorting: NONE\n` +
        `nearest-point matching: NONE\n` +
        `100% target: real female topology + localized curvy athletic sculpt\n` +
        `${femaleMorphReport}\n` +
        `torso semantic samples: ${femaleSemanticBounds?.torsoSamples ?? 0}\n` +
        `lower-body semantic samples: ${femaleSemanticBounds?.lowerSamples ?? 0}\n` +
        `realism protection: arms/hands + head/neck + calves/feet excluded from curve sculpt\n` +
        `GLB male materials/maps: ${embeddedMaleMaterialCount}/${embeddedMaleMapCount}\n` +
        `GLB female materials/maps: ${embeddedFemaleMaterialCount}/${embeddedFemaleMapCount}\n` +
        `texture method: embedded GLB materials only; safe overlay blend; no shader patching`;

      maleRoot.visible =
        false;

      femaleRoot.visible =
        false;

      bridgeGroup.visible =
        true;
    }

    // =========================================================
    // MORPH

    function smootherstep(t) {
      return t*t*t*(t*(t*6 - 15) + 10);
    }

    let normalFrame = 0;

    function applyProgress(raw) {
      const p =
        THREE.MathUtils.clamp(
          raw,
          0,
          1
        );

      const t =
        smootherstep(p);

      // Texture/material transition is deliberately slightly delayed so
      // the physical body starts changing before the female skin/material
      // fully takes over.
      const materialT =
        THREE.MathUtils.smoothstep(
          t,
          0.08,
          0.92
        );

      for (const part of bridgeParts) {
        setMaterialOpacity(
          part.femaleMaterial,
          materialT
        );
        const live =
          part.mesh.geometry
            .attributes.position.array;

        const a =
          part.start;

        const b =
          part.target;

        for (
          let i = 0;
          i < live.length;
          i++
        ) {
          live[i] =
            a[i] +
            (b[i] - a[i]) * t;
        }

        part.mesh.geometry
          .attributes.position
          .needsUpdate = true;
      }

      normalFrame++;

      if (
        normalFrame % 3 === 0 ||
        p === 0 ||
        p === 1
      ) {
        for (const part of bridgeParts) {
          part.mesh.geometry
            .computeVertexNormals();
        }
      }

      progressSlider.value =
        String(p);

      progressValue.textContent =
        Math.round(p * 100) + "%";

      statusEl.textContent =
        `Weighted bone-volume transformation - ${Math.round(p * 100)}%`;
    }

    function lerpAngle(current, target, alpha) {
      let delta =
        target - current;

      while (delta > Math.PI) {
        delta -= Math.PI * 2;
      }

      while (delta < -Math.PI) {
        delta += Math.PI * 2;
      }

      return current +
        delta * alpha;
    }

    function refreshOrbitTargetFromVisual() {
      const visual =
        activeVisual();

      if (!visual) return;

      const b =
        getBounds(
          visual
        );

      // Aim slightly above the geometric center.
      // This keeps the torso/pelvis visually centered through the morph.
      desiredOrbitTarget.set(
        b.center.x,
        b.box.min.y +
          b.size.y * 0.57,
        b.center.z
      );

      orbitMinRadius =
        Math.max(
          0.92,
          b.size.y * 0.64
        );

      orbitMaxRadius =
        Math.max(
          4.8,
          b.size.y * 2.85
        );

      desiredOrbitRadius =
        THREE.MathUtils.clamp(
          desiredOrbitRadius,
          orbitMinRadius,
          orbitMaxRadius
        );
    }

    function updateBodyOrbitCamera(force = false) {
      if (!bodyView) return;

      refreshOrbitTargetFromVisual();

      if (force) {
        orbitAzimuth =
          desiredOrbitAzimuth;

        orbitElevation =
          desiredOrbitElevation;

        orbitRadius =
          desiredOrbitRadius;

        orbitTarget.copy(
          desiredOrbitTarget
        );
      } else {
        orbitAzimuth =
          lerpAngle(
            orbitAzimuth,
            desiredOrbitAzimuth,
            ORBIT_SMOOTHING
          );

        orbitElevation =
          THREE.MathUtils.lerp(
            orbitElevation,
            desiredOrbitElevation,
            ORBIT_SMOOTHING
          );

        orbitRadius =
          THREE.MathUtils.lerp(
            orbitRadius,
            desiredOrbitRadius,
            ORBIT_SMOOTHING
          );

        // At steeper vertical angles, keep a tiny bit more distance
        // so the camera does not clip through the body.
        const angleSafety =
          THREE.MathUtils.lerp(
            1.0,
            1.10,
            Math.abs(orbitElevation) /
              Math.max(
                0.001,
                ORBIT_MAX_ELEVATION
              )
          );

        orbitRadius =
          Math.max(
            orbitRadius,
            orbitMinRadius * angleSafety
          );

        orbitTarget.lerp(
          desiredOrbitTarget,
          ORBIT_SMOOTHING
        );
      }

      const cosElevation =
        Math.cos(
          orbitElevation
        );

      camera.position.set(
        orbitTarget.x +
          orbitRadius *
          cosElevation *
          Math.sin(
            orbitAzimuth
          ),

        orbitTarget.y +
          orbitRadius *
          Math.sin(
            orbitElevation
          ),

        orbitTarget.z +
          orbitRadius *
          cosElevation *
          Math.cos(
            orbitAzimuth
          )
      );

      camera.lookAt(
        orbitTarget
      );
    }

    function resetBodyCamera() {
      const visual =
        activeVisual();

      if (!visual) return;

      const b =
        getBounds(
          visual
        );

      desiredOrbitAzimuth =
        THREE.MathUtils.degToRad(
          27
        );

      desiredOrbitElevation =
        THREE.MathUtils.degToRad(
          5
        );

      orbitMinRadius =
        Math.max(
          0.92,
          b.size.y * 0.64
        );

      orbitMaxRadius =
        Math.max(
          4.8,
          b.size.y * 2.85
        );

      desiredOrbitRadius =
        THREE.MathUtils.clamp(
          Math.max(
            2.10,
            b.size.y * 1.55
          ),
          orbitMinRadius,
          orbitMaxRadius
        );

      desiredOrbitTarget.set(
        b.center.x,
        b.box.min.y +
          b.size.y * 0.57,
        b.center.z
      );

      orbitTarget.copy(
        desiredOrbitTarget
      );

      updateBodyOrbitCamera(
        true
      );
    }

    function setBodyView() {
      bodyView =
        true;

      resetBodyCamera();
    }

    function setFirstPerson() {
      bodyView =
        false;

      const visual =
        activeVisual();

      if (!visual) return;

      const b =
        getBounds(
          visual
        );

      camera.position.set(
        b.center.x,
        b.box.min.y +
          b.size.y * 0.925,
        b.center.z -
          b.size.z * 0.16
      );

      pitch =
        THREE.MathUtils.degToRad(
          -10
        );
    }

    function lookDown() {
      if (bodyView) {
        setFirstPerson();
      }

      pitch =
        THREE.MathUtils.degToRad(
          -66
        );

      statusEl.textContent =
        showing === "bridge"
          ? "LOOK DOWN - weighted bridge."
          : `LOOK DOWN - ${showing} reference.`;
    }

    document.getElementById("bodyViewBtn")
      .addEventListener(
        "click",
        () => {
          setBodyView();

          statusEl.textContent =
            showing === "bridge"
              ? "BODY VIEW - full horizontal orbit, limited vertical orbit, pinch to zoom."
              : `BODY VIEW - ${showing} reference; full horizontal orbit, limited vertical orbit, pinch to zoom.`;
        }
      );

    document.getElementById("lookBtn")
      .addEventListener(
        "click",
        lookDown
      );

    document.getElementById("resetCameraBtn")
      .addEventListener(
        "click",
        () => {
          if (!bodyView) {
            setBodyView();
          } else {
            resetBodyCamera();
          }

          statusEl.textContent =
            "BODY VIEW camera reset.";
        }
      );

    let dragging =
      false;

    let lastX =
      0;

    let lastY =
      0;

    let pinchDistance =
      0;

    const sensitivity =
      0.004;

    const orbitSensitivity =
      0.0048;

    function touchDistance(t0, t1) {
      const dx =
        t1.clientX -
        t0.clientX;

      const dy =
        t1.clientY -
        t0.clientY;

      return Math.hypot(
        dx,
        dy
      );
    }

    function startDrag(x,y) {
      dragging =
        true;

      lastX =
        x;

      lastY =
        y;
    }

    function drag(x,y) {
      if (
        !dragging
      ) {
        return;
      }

      const dx =
        x - lastX;

      const dy =
        y - lastY;

      lastX =
        x;

      lastY =
        y;

      if (bodyView) {
        // Full horizontal orbit remains available.
        desiredOrbitAzimuth -=
          dx *
          orbitSensitivity;

        // Vertical orbit is deliberately limited so the camera cannot
        // swing far underneath or directly over the model.
        desiredOrbitElevation +=
          dy *
          orbitSensitivity;

        desiredOrbitElevation =
          THREE.MathUtils.clamp(
            desiredOrbitElevation,
            ORBIT_MIN_ELEVATION,
            ORBIT_MAX_ELEVATION
          );

        return;
      }

      // Existing first-person look behavior.
      yaw -=
        dx *
        sensitivity;

      pitch -=
        dy *
        sensitivity;

      pitch =
        THREE.MathUtils.clamp(
          pitch,
          THREE.MathUtils.degToRad(-88),
          THREE.MathUtils.degToRad(70)
        );
    }

    function applyPinch(currentDistance) {
      if (
        !bodyView ||
        pinchDistance <= 0 ||
        currentDistance <= 0
      ) {
        pinchDistance =
          currentDistance;

        return;
      }

      // Exponential-ish pinch scaling feels smoother than hard linear jumps.
      const ratio =
        pinchDistance /
        currentDistance;

      const softenedRatio =
        Math.pow(
          ratio,
          0.72
        );

      desiredOrbitRadius =
        THREE.MathUtils.clamp(
          desiredOrbitRadius *
          softenedRatio,
          orbitMinRadius,
          orbitMaxRadius
        );

      pinchDistance =
        currentDistance;
    }

    function endDrag() {
      dragging =
        false;

      pinchDistance =
        0;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      e => {
        if (
          e.touches.length === 1
        ) {
          pinchDistance =
            0;

          startDrag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        } else if (
          e.touches.length === 2 &&
          bodyView
        ) {
          dragging =
            false;

          pinchDistance =
            touchDistance(
              e.touches[0],
              e.touches[1]
            );
        }
      },
      { passive:false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      e => {
        if (
          e.touches.length === 1
        ) {
          e.preventDefault();

          drag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        } else if (
          e.touches.length === 2 &&
          bodyView
        ) {
          e.preventDefault();

          applyPinch(
            touchDistance(
              e.touches[0],
              e.touches[1]
            )
          );
        }
      },
      { passive:false }
    );

    renderer.domElement.addEventListener(
      "touchend",
      e => {
        if (
          e.touches.length === 1
        ) {
          pinchDistance =
            0;

          startDrag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        } else {
          endDrag();
        }
      }
    );

    renderer.domElement.addEventListener(
      "touchcancel",
      endDrag
    );

    const euler =
      new THREE.Euler(
        0,0,0,"YXZ"
      );

    // =========================================================
    // LOOP
    // =========================================================

    function animate(now) {
      requestAnimationFrame(
        animate
      );

      if (playing) {
        let p =
          (now - playStart) /
          PLAY_MS;

        if (p >= 1) {
          p =
            1;

          playing =
            false;
        }

        applyProgress(
          p
        );
      }

      if (bodyView) {
        // Smooth orbit/zoom while keeping the target centered as the body morphs.
        updateBodyOrbitCamera();
      } else {
        euler.set(
          pitch,
          yaw,
          0
        );

        camera.quaternion
          .setFromEuler(
            euler
          );
      }

      renderer.render(
        scene,
        camera
      );
    }

    animate();

    // =========================================================
    // SETUP
    // =========================================================

    async function setup() {
      statusEl.textContent =
        "Loading real male endpoint...";

      const maleGLTF =
        await loadGLB(
          "./adult-male-lod.glb"
        );

      statusEl.textContent =
        "Loading real female endpoint...";

      const femaleGLTF =
        await loadGLB(
          "./adult-female-lod.glb"
        );

      maleRoot =
        maleGLTF.scene;

      femaleRoot =
        femaleGLTF.scene;

      scene.add(
        maleRoot
      );

      scene.add(
        femaleRoot
      );

      // These materials/textures came in through GLTFLoader.
      // No network texture probing is required.
      inspectModelMaterials(
        maleRoot,
        "male"
      );

      inspectModelMaterials(
        femaleRoot,
        "female"
      );

      normalizeModel(
        maleRoot,
        1.80
      );

      normalizeModel(
        femaleRoot,
        1.65
      );

      // Start with the female model's own authored shape system.
      // Muscular is used lightly for a real athletic base.
      // Obese stays at zero.
      setFemaleAuthoredMorphs(
        femaleRoot
      );

      femaleRoot.updateMatrixWorld(
        true
      );

      femaleBodyBounds =
        preciseVertexBounds(
          femaleRoot
        );

      femaleSemanticBounds =
        buildFemaleSemanticBounds();

      maleBones =
        collectBones(
          maleRoot
        );

      femaleBones =
        collectBones(
          femaleRoot
        );

      maleRoot.updateMatrixWorld(
        true
      );

      femaleRoot.updateMatrixWorld(
        true
      );

      statusEl.textContent =
        "Measuring male bone volumes...";

      maleVolumes =
        buildBoneVolumes(
          maleRoot,
          maleBones
        );

      statusEl.textContent =
        "Measuring female bone volumes...";

      femaleVolumes =
        buildBoneVolumes(
          femaleRoot,
          femaleBones
        );

      maleRoot.visible =
        false;

      femaleRoot.visible =
        false;

      await buildBridge();

      applyProgress(
        0
      );

      setShowing(
        "bridge"
      );

      loading.style.display =
        "none";

      statusEl.textContent =
        "V29 ready. The V27 camera/body system is restored, and the bridge now safely blends the materials/textures already contained in the male and female GLB models.";
    }

    setup().catch(
      fail
    );

    window.addEventListener(
      "resize",
      () => {
        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          Math.min(
            window.devicePixelRatio,
            2
          )
        );
      }
    );
  </script>
</body>
</html>
