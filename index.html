<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game Prototype V6</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 9px);
      left: 9px;
      right: 9px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 500px;
      margin: 0 auto;
      padding: 10px 13px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.57);
      color: white;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .status {
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .bar {
      margin-top: 8px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
    }

    #barFill {
      width: 0%;
      height: 100%;
      background: white;
      border-radius: 999px;
    }

    #bottomUI {
      position: fixed;
      left: 7px;
      right: 7px;
      bottom: calc(env(safe-area-inset-bottom) + 9px);
      z-index: 30;
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 12px 13px;
      font-size: 14px;
      font-weight: 800;
      color: #111;
      background: white;
      min-width: 108px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    button:active {
      transform: scale(0.97);
    }

    button.secondary {
      background: rgba(255,255,255,0.85);
      min-width: 94px;
    }

    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 76px);
      left: 8px;
      right: 8px;
      text-align: center;
      color: rgba(255,255,255,0.92);
      font-size: 12px;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 5px rgba(0,0,0,0.7);
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game - V6 Human Body Test</div>
      <div id="status" class="status">
        Starter form. Use BODY VIEW first, then test LOOK DOWN.
      </div>
      <div class="bar">
        <div id="barFill"></div>
      </div>
    </div>
  </div>

  <div id="hint">
    One continuous deforming human body - no separate chest spheres
  </div>

  <div id="bottomUI">
    <button id="lookBtn" class="secondary">LOOK DOWN</button>
    <button id="viewBtn" class="secondary">BODY VIEW</button>
    <button id="transformBtn">TRANSFORM</button>
    <button id="resetBtn" class="secondary">RESET</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    // =========================================================
    // ENGINE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x91d5f4);

    const camera = new THREE.PerspectiveCamera(
      72,
      window.innerWidth / window.innerHeight,
      0.025,
      150
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.getElementById("game").appendChild(renderer.domElement);

    // =========================================================
    // WORLD
    // =========================================================

    scene.add(new THREE.HemisphereLight(0xffffff, 0x53616e, 2.15));

    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(4, 9, 4);
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({
        color: 0x92979c,
        roughness: 0.95
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function worldBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.84
        })
      );
      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      scene.add(mesh);
      return mesh;
    }

    worldBox(0, 1.5, -6.3, 10, 3, 0.22, 0xdce0e3);
    worldBox(-5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);
    worldBox(5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);

    worldBox(-2.6, 0.45, -3.5, 1.45, 0.9, 0.75, 0x9b7755);
    worldBox(2.6, 0.88, -3.9, 0.72, 1.76, 0.72, 0x6d7c8f);

    // =========================================================
    // PLAYER / SKELETON
    // =========================================================

    const player = new THREE.Group();
    player.position.set(0, 0, 2.6);
    scene.add(player);

    const yawBone = new THREE.Group();
    player.add(yawBone);

    const skeleton = new THREE.Group();
    yawBone.add(skeleton);

    const pelvisBone = new THREE.Group();
    pelvisBone.position.set(0, 0.94, 0);
    skeleton.add(pelvisBone);

    const spineBone = new THREE.Group();
    spineBone.position.set(0, 0.18, 0);
    pelvisBone.add(spineBone);

    const chestBone = new THREE.Group();
    chestBone.position.set(0, 0.22, -0.005);
    spineBone.add(chestBone);

    const neckBone = new THREE.Group();
    neckBone.position.set(0, 0.245, -0.005);
    chestBone.add(neckBone);

    const headBone = new THREE.Group();
    headBone.position.set(0, 0.115, 0);
    neckBone.add(headBone);

    const cameraPitch = new THREE.Group();

    // Eyes are high and clearly forward from torso center.
    cameraPitch.position.set(0, 0.035, -0.155);

    headBone.add(cameraPitch);
    cameraPitch.add(camera);

    // =========================================================
    // MATERIALS
    // =========================================================

    const skinMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8a37c,
      roughness: 0.70
    });

    const shirtMaterial = new THREE.MeshStandardMaterial({
      color: 0x3f608f,
      roughness: 0.84
    });

    const pantsMaterial = new THREE.MeshStandardMaterial({
      color: 0x222b37,
      roughness: 0.90
    });

    const shoeMaterial = new THREE.MeshStandardMaterial({
      color: 0x171717,
      roughness: 0.96
    });

    // =========================================================
    // HUMAN-LIKE MESH HELPERS
    // =========================================================

    function ellipsoid(material, segments = 24) {
      return new THREE.Mesh(
        new THREE.SphereGeometry(0.5, segments, 18),
        material
      );
    }

    function taperedLimb(material, topRadius, bottomRadius, length) {
      const geometry = new THREE.CylinderGeometry(
        bottomRadius,
        topRadius,
        length,
        16,
        4,
        false
      );
      const mesh = new THREE.Mesh(geometry, material);
      return mesh;
    }

    function createTorsoGeometry(profile) {
      // A torso built from stacked elliptical rings in one continuous mesh.
      // Y positions run from pelvis at 0 to upper chest at 1.
      const rings = [
        { y: 0.00, w: profile.lowHipW, d: profile.lowHipD },
        { y: 0.10, w: profile.hipW, d: profile.hipD },
        { y: 0.22, w: profile.highHipW, d: profile.highHipD },
        { y: 0.36, w: profile.waistW, d: profile.waistD },
        { y: 0.50, w: profile.ribLowW, d: profile.ribLowD },
        { y: 0.66, w: profile.chestW, d: profile.chestD },
        { y: 0.80, w: profile.upperChestW, d: profile.upperChestD },
        { y: 0.94, w: profile.shoulderBaseW, d: profile.shoulderBaseD },
        { y: 1.00, w: profile.neckBaseW, d: profile.neckBaseD }
      ];

      const radialSegments = 28;
      const vertices = [];
      const indices = [];
      const uvs = [];

      for (let r = 0; r < rings.length; r++) {
        const ring = rings[r];

        for (let i = 0; i < radialSegments; i++) {
          const a = (i / radialSegments) * Math.PI * 2;

          let x = Math.cos(a) * ring.w * 0.5;
          let z = Math.sin(a) * ring.d * 0.5;

          // Forward is -Z. Create a subtle natural front torso curve.
          // The chest projection comes from the torso itself, not spheres.
          const frontness = Math.max(0, -Math.sin(a));

          if (ring.y >= 0.58 && ring.y <= 0.88) {
            z -= profile.chestProjection * frontness;
          }

          if (ring.y >= 0.16 && ring.y <= 0.34) {
            z -= profile.pelvisProjection * frontness * 0.35;
          }

          vertices.push(x, ring.y * profile.torsoHeight, z);
          uvs.push(i / radialSegments, ring.y);
        }
      }

      for (let r = 0; r < rings.length - 1; r++) {
        for (let i = 0; i < radialSegments; i++) {
          const next = (i + 1) % radialSegments;

          const a = r * radialSegments + i;
          const b = r * radialSegments + next;
          const c = (r + 1) * radialSegments + i;
          const d = (r + 1) * radialSegments + next;

          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(vertices, 3)
      );

      geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(uvs, 2)
      );

      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return geometry;
    }

    // =========================================================
    // STARTER / TARGET BODY PROFILES
    // =========================================================

    const BASE_HEIGHT = 1.80;

    const starter = {
      height: 1.80,

      torsoHeight: 0.68,

      lowHipW: 0.31,
      lowHipD: 0.22,

      hipW: 0.36,
      hipD: 0.25,

      highHipW: 0.34,
      highHipD: 0.23,

      waistW: 0.30,
      waistD: 0.19,

      ribLowW: 0.34,
      ribLowD: 0.21,

      chestW: 0.40,
      chestD: 0.23,

      upperChestW: 0.42,
      upperChestD: 0.22,

      shoulderBaseW: 0.45,
      shoulderBaseD: 0.20,

      neckBaseW: 0.15,
      neckBaseD: 0.14,

      chestProjection: 0.018,
      pelvisProjection: 0.025,

      shoulderWidth: 0.47,

      upperArmTop: 0.060,
      upperArmBottom: 0.052,
      forearmTop: 0.050,
      forearmBottom: 0.041,

      handW: 0.095,
      handH: 0.145,
      handD: 0.050,

      thighTop: 0.102,
      thighBottom: 0.078,
      calfTop: 0.075,
      calfBottom: 0.052,

      footW: 0.14,
      footH: 0.085,
      footL: 0.275,

      skin: new THREE.Color(0xd8a37c),
      shirt: new THREE.Color(0x3f608f),
      pants: new THREE.Color(0x222b37)
    };

    const target = {
      height: 1.55,

      torsoHeight: 0.65,

      lowHipW: 0.39,
      lowHipD: 0.29,

      hipW: 0.47,
      hipD: 0.33,

      highHipW: 0.43,
      highHipD: 0.30,

      waistW: 0.255,
      waistD: 0.18,

      ribLowW: 0.30,
      ribLowD: 0.20,

      chestW: 0.375,
      chestD: 0.255,

      upperChestW: 0.37,
      upperChestD: 0.235,

      shoulderBaseW: 0.38,
      shoulderBaseD: 0.19,

      neckBaseW: 0.135,
      neckBaseD: 0.125,

      chestProjection: 0.072,
      pelvisProjection: 0.048,

      shoulderWidth: 0.39,

      upperArmTop: 0.050,
      upperArmBottom: 0.044,
      forearmTop: 0.043,
      forearmBottom: 0.036,

      handW: 0.084,
      handH: 0.127,
      handD: 0.045,

      thighTop: 0.132,
      thighBottom: 0.092,
      calfTop: 0.082,
      calfBottom: 0.050,

      footW: 0.13,
      footH: 0.078,
      footL: 0.248,

      skin: new THREE.Color(0xb97554),
      shirt: new THREE.Color(0x923e88),
      pants: new THREE.Color(0x2a2230)
    };

    function mix(a, b, t) {
      return a + (b - a) * t;
    }

    function mixedProfile(t) {
      const result = {};

      for (const key of Object.keys(starter)) {
        if (
          typeof starter[key] === "number" &&
          typeof target[key] === "number"
        ) {
          result[key] = mix(starter[key], target[key], t);
        }
      }

      return result;
    }

    // =========================================================
    // CONTINUOUS TORSO
    // =========================================================

    let torsoMesh = new THREE.Mesh(
      createTorsoGeometry(starter),
      shirtMaterial
    );

    pelvisBone.add(torsoMesh);

    // The torso geometry begins at pelvis bone and extends upward.
    torsoMesh.position.set(0, -0.04, 0.015);

    // =========================================================
    // HEAD / NECK
    // =========================================================

    const neckMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.068, 0.12, 18),
      skinMaterial
    );
    neckBone.add(neckMesh);
    neckMesh.position.y = -0.055;

    // A head is mostly hidden in first person, but makes BODY VIEW human.
    const headMesh = ellipsoid(skinMaterial, 28);
    headBone.add(headMesh);
    headMesh.scale.set(0.155, 0.205, 0.165);
    headMesh.position.set(0, 0.045, 0.015);

    // =========================================================
    // ARMS
    // =========================================================

    function createArm(side) {
      const sign = side === "left" ? -1 : 1;

      const shoulder = new THREE.Group();
      chestBone.add(shoulder);

      const upperArm = taperedLimb(skinMaterial, 0.060, 0.052, 0.32);
      shoulder.add(upperArm);

      const elbow = new THREE.Group();
      shoulder.add(elbow);

      const forearm = taperedLimb(skinMaterial, 0.050, 0.041, 0.29);
      elbow.add(forearm);

      const wrist = new THREE.Group();
      elbow.add(wrist);

      const hand = ellipsoid(skinMaterial, 20);
      wrist.add(hand);

      return {
        sign,
        shoulder,
        upperArm,
        elbow,
        forearm,
        wrist,
        hand
      };
    }

    const leftArm = createArm("left");
    const rightArm = createArm("right");

    // =========================================================
    // LEGS
    // =========================================================

    function createLeg(side) {
      const sign = side === "left" ? -1 : 1;

      const hip = new THREE.Group();
      pelvisBone.add(hip);

      const thigh = taperedLimb(pantsMaterial, 0.102, 0.078, 0.42);
      hip.add(thigh);

      const knee = new THREE.Group();
      hip.add(knee);

      const calf = taperedLimb(pantsMaterial, 0.075, 0.052, 0.40);
      knee.add(calf);

      const ankle = new THREE.Group();
      knee.add(ankle);

      const foot = ellipsoid(shoeMaterial, 20);
      ankle.add(foot);

      return {
        sign,
        hip,
        thigh,
        knee,
        calf,
        ankle,
        foot
      };
    }

    const leftLeg = createLeg("left");
    const rightLeg = createLeg("right");

    // =========================================================
    // UPDATE BODY
    // =========================================================

    function rebuildTorso(profile) {
      const oldGeometry = torsoMesh.geometry;
      torsoMesh.geometry = createTorsoGeometry(profile);
      oldGeometry.dispose();
    }

    function applyBody(progress) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);
      const profile = mixedProfile(p);

      // ----- Height -----
      const heightScale = profile.height / BASE_HEIGHT;
      skeleton.scale.set(1, heightScale, 1);

      // ----- Torso -----
      rebuildTorso(profile);

      // ----- Neck/head -----
      neckMesh.scale.set(
        mix(1.0, 0.90, p),
        1.0,
        mix(1.0, 0.90, p)
      );

      headMesh.scale.set(
        mix(0.155, 0.145, p),
        mix(0.205, 0.192, p),
        mix(0.165, 0.155, p)
      );

      // ----- Arms -----
      const upperArmLength = 0.32;
      const forearmLength = 0.29;

      function updateArm(arm) {
        arm.shoulder.position.set(
          arm.sign * profile.shoulderWidth * 0.52,
          0.02,
          0.015
        );

        arm.upperArm.geometry.dispose();
        arm.upperArm.geometry = new THREE.CylinderGeometry(
          profile.upperArmBottom,
          profile.upperArmTop,
          upperArmLength,
          16,
          4
        );
        arm.upperArm.position.set(0, -upperArmLength * 0.50, 0.01);

        arm.elbow.position.set(0, -upperArmLength, 0.01);

        arm.forearm.geometry.dispose();
        arm.forearm.geometry = new THREE.CylinderGeometry(
          profile.forearmBottom,
          profile.forearmTop,
          forearmLength,
          16,
          4
        );
        arm.forearm.position.set(0, -forearmLength * 0.50, -0.01);

        arm.wrist.position.set(0, -forearmLength, -0.015);

        arm.hand.scale.set(
          profile.handW,
          profile.handH,
          profile.handD
        );
        arm.hand.position.set(
          0,
          -profile.handH * 0.48,
          -0.02
        );
      }

      updateArm(leftArm);
      updateArm(rightArm);

      // ----- Legs -----
      const thighLength = 0.42;
      const calfLength = 0.40;

      function updateLeg(leg) {
        leg.hip.position.set(
          leg.sign * profile.hipW * 0.20,
          -0.08,
          0.01
        );

        leg.thigh.geometry.dispose();
        leg.thigh.geometry = new THREE.CylinderGeometry(
          profile.thighBottom,
          profile.thighTop,
          thighLength,
          18,
          4
        );
        leg.thigh.position.set(
          0,
          -thighLength * 0.50,
          0.015
        );

        leg.knee.position.set(
          0,
          -thighLength,
          0.01
        );

        leg.calf.geometry.dispose();
        leg.calf.geometry = new THREE.CylinderGeometry(
          profile.calfBottom,
          profile.calfTop,
          calfLength,
          18,
          4
        );
        leg.calf.position.set(
          0,
          -calfLength * 0.50,
          0.015
        );

        leg.ankle.position.set(
          0,
          -calfLength,
          0.015
        );

        leg.foot.scale.set(
          profile.footW,
          profile.footH,
          profile.footL
        );

        leg.foot.position.set(
          0,
          -profile.footH * 0.48,
          -profile.footL * 0.32
        );
      }

      updateLeg(leftLeg);
      updateLeg(rightLeg);

      // ----- Colors -----
      skinMaterial.color.copy(starter.skin).lerp(target.skin, p);
      shirtMaterial.color.copy(starter.shirt).lerp(target.shirt, p);
      pantsMaterial.color.copy(starter.pants).lerp(target.pants, p);
    }

    // =========================================================
    // TRANSFORMATION
    // =========================================================

    let progress = 0;
    let transforming = false;
    let transformStart = 0;

    const TRANSFORM_MS = 30000;

    const status = document.getElementById("status");
    const barFill = document.getElementById("barFill");
    const transformBtn = document.getElementById("transformBtn");

    function startTransformation() {
      if (transforming || progress >= 1) return;

      transforming = true;

      transformStart =
        performance.now() - progress * TRANSFORM_MS;

      transformBtn.textContent = "TRANSFORMING";

      status.textContent =
        "Transformation started. The same human body is reshaping continuously.";
    }

    function resetTransformation() {
      transforming = false;
      progress = 0;

      applyBody(0);

      transformBtn.textContent = "TRANSFORM";
      barFill.style.width = "0%";

      status.textContent =
        "Starter form restored. Use BODY VIEW first, then LOOK DOWN.";
    }

    transformBtn.addEventListener("click", startTransformation);
    document.getElementById("resetBtn").addEventListener("click", resetTransformation);

    // =========================================================
    // CAMERA
    // =========================================================

    let yaw = 0;
    let pitch = -0.14;
    let bodyView = false;

    const sensitivity = 0.0041;

    const minPitch = THREE.MathUtils.degToRad(-88);
    const maxPitch = THREE.MathUtils.degToRad(72);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    function setPitch(value) {
      pitch = THREE.MathUtils.clamp(value, minPitch, maxPitch);
    }

    function beginLook(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function moveLook(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      setPitch(pitch - dy * sensitivity);
    }

    function endLook() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      (e) => {
        if (e.touches.length === 1) {
          beginLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      (e) => {
        if (e.touches.length === 1) {
          e.preventDefault();

          moveLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endLook);
    renderer.domElement.addEventListener("touchcancel", endLook);

    renderer.domElement.addEventListener(
      "mousedown",
      (e) => beginLook(e.clientX, e.clientY)
    );

    window.addEventListener(
      "mousemove",
      (e) => moveLook(e.clientX, e.clientY)
    );

    window.addEventListener("mouseup", endLook);

    document.getElementById("lookBtn").addEventListener(
      "click",
      () => {
        bodyView = false;
        document.getElementById("viewBtn").textContent = "BODY VIEW";
        setPitch(THREE.MathUtils.degToRad(-76));
      }
    );

    document.getElementById("viewBtn").addEventListener(
      "click",
      () => {
        bodyView = !bodyView;

        document.getElementById("viewBtn").textContent =
          bodyView ? "FIRST PERSON" : "BODY VIEW";

        status.textContent =
          bodyView
            ? "Body view active. Inspect the full silhouette while it transforms."
            : "First person restored. Use LOOK DOWN to inspect the body.";
      }
    );

    // =========================================================
    // LOOP
    // =========================================================

    applyBody(0);

    function animate(now) {
      requestAnimationFrame(animate);

      yawBone.rotation.y = yaw;

      if (!bodyView) {
        cameraPitch.rotation.x = pitch;

        if (camera.parent !== cameraPitch) {
          cameraPitch.add(camera);
          camera.position.set(0, 0, 0);
          camera.rotation.set(0, 0, 0);
        }
      } else {
        if (camera.parent !== scene) {
          scene.attach(camera);
        }

        // External debug view placed slightly in front-right.
        camera.position.set(
          player.position.x + 1.55,
          1.38,
          player.position.z + 3.0
        );

        camera.lookAt(
          new THREE.Vector3(
            player.position.x,
            0.92,
            player.position.z
          )
        );
      }

      if (transforming) {
        progress =
          (now - transformStart) / TRANSFORM_MS;

        progress = THREE.MathUtils.clamp(
          progress,
          0,
          1
        );

        const smooth =
          progress * progress * (3 - 2 * progress);

        applyBody(smooth);

        const percent = Math.round(progress * 100);
        barFill.style.width = percent + "%";

        status.textContent =
          "Transforming... " + percent +
          "% - body height, silhouette, limbs, skin and clothing are reshaping.";

        if (progress >= 1) {
          transforming = false;
          transformBtn.textContent = "COMPLETE";

          status.textContent =
            "Transformation complete. The target human form is fully applied.";
        }
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener(
      "resize",
      () => {
        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio, 2)
        );
      }
    );
  </script>
</body>
</html>
