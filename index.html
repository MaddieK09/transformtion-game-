<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Transformation Game</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;

      background: rgba(0, 0, 0, 0.55);
      color: white;
      padding: 12px 14px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
    }

    #ui h1 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    #ui p {
      margin: 0;
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div id="ui">
    <h1>Transformation Game</h1>
    <p>3D prototype loading...</p>
  </div>

  <div id="game"></div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 1.7, 5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    document
      .getElementById("game")
      .appendChild(renderer.domElement);

    const ambientLight =
      new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2
      );

    scene.add(ambientLight);

    const sun =
      new THREE.DirectionalLight(
        0xffffff,
        3
      );

    sun.position.set(5, 10, 7);

    scene.add(sun);

    const floorGeometry =
      new THREE.PlaneGeometry(
        30,
        30
      );

    const floorMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x777777
      });

    const floor =
      new THREE.Mesh(
        floorGeometry,
        floorMaterial
      );

    floor.rotation.x =
      -Math.PI / 2;

    scene.add(floor);

    const cubeGeometry =
      new THREE.BoxGeometry(
        1,
        1,
        1
      );

    const cubeMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x4b72ff
      });

    const cube =
      new THREE.Mesh(
        cubeGeometry,
        cubeMaterial
      );

    cube.position.set(
      0,
      0.5,
      0
    );

    scene.add(cube);

    function animate() {
      requestAnimationFrame(animate);

      cube.rotation.y += 0.01;

      renderer.render(
        scene,
        camera
      );
    }

    animate();

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );
      }
    );
  </script>

</body>
</html>
