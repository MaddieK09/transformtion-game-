<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game V16 - Surface Bridge</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101217;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 650px;
      margin: auto;
      padding: 11px 13px;
      border-radius: 17px;
      color: white;
      background: rgba(0,0,0,0.67);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .debug {
      margin-top: 4px;
      font-size: 10px;
      line-height: 1.35;
      opacity: 0.72;
      white-space: pre-line;
    }

    #controls {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      z-index: 30;
      max-height: 43vh;
      overflow: auto;
      border-radius: 18px;
      background: rgba(12,14,18,0.93);
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    #buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 11px;
      min-width: 94px;
      color: #111;
      background: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 800;
    }

    button:active {
      transform: scale(0.97);
    }

    .controlRow {
      padding: 9px 2px;
      border-top: 1px solid rgba(255,255,255,0.09);
    }

    .labelLine {
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .value {
      opacity: 0.8;
      min-width: 44px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #101217;
      color: white;
      font-size: 16px;
      font-weight: 800;
    }

    #fatal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 20%;
      left: 15px;
      right: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #761c1c;
      color: white;
      font: 700 13px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="game"></div>
  <div id="loading">Loading V16 and building male-to-female surface correspondenceâ¦</div>
  <div id="fatal"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game - V16 Surface Bridge Experiment</div>
      <div id="status" class="status">Loading both endpoint meshesâ¦</div>
      <div id="debug" class="debug"></div>
    </div>
  </div>

  <div id="controls">
    <div id="buttons">
      <button id="bodyViewBtn">BODY VIEW</button>
      <button id="lookBtn">LOOK DOWN</button>
      <button id="resetBtn">RESET</button>
      <button id="playBtn">PLAY BRIDGE</button>
      <button id="femaleRefBtn">FEMALE REFERENCE</button>
      <button id="bridgeBtn">BRIDGE MESH</button>
    </div>

    <div class="controlRow">
      <div class="labelLine">
        <span>SURFACE BRIDGE</span>
        <span id="progressValue" class="value">0%</span>
      </div>
      <input id="progressSlider" type="range" min="0" max="1" step="0.001" value="0">
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const loading = document.getElementById("loading");
    const fatal = document.getElementById("fatal");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const progressSlider = document.getElementById("progressSlider");
    const progressValue = document.getElementById("progressValue");

    function fail(error) {
      console.error(error);
      loading.style.display = "none";
      fatal.style.display = "block";
      fatal.textContent =
        "V16 ERROR\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nSend me a screenshot of this red box.";
    }

    window.addEventListener("error", e => {
      if (e.error) fail(e.error);
    });

    window.addEventListener("unhandledrejection", e => {
      fail(e.reason);
    });

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94d7f2);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.015,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById("game").appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x65727b, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(4, 8, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xdceaff, 1.0);
    fill.position.set(-4, 4, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xa2a5a8,
        roughness: 0.95
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function roomBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({ color, roughness: 0.88 })
      );

      mesh.position.set(x,y,z);
      mesh.scale.set(sx,sy,sz);
      scene.add(mesh);
    }

    roomBox(0, 1.5, -6, 10, 3, 0.2, 0xd8dde1);
    roomBox(-5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);
    roomBox(5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);

    // =========================================================
    // MODEL HELPERS
    // =========================================================

    const loader = new GLTFLoader();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    }

    function getBounds(root) {
      root.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      return { box, size, center };
    }

    function normalizeModel(root, targetHeight) {
      let b = getBounds(root);

      if (!isFinite(b.size.y) || b.size.y <= 0.001) {
        throw new Error("Invalid model bounds.");
      }

      const scale = targetHeight / b.size.y;
      root.scale.multiplyScalar(scale);
      root.updateMatrixWorld(true);

      b = getBounds(root);

      root.position.x -= b.center.x;
      root.position.z -= b.center.z;
      root.position.y -= b.box.min.y;
      root.updateMatrixWorld(true);
    }

    function getRenderableMeshes(root) {
      const out = [];

      root.traverse(obj => {
        if (obj.isMesh || obj.isSkinnedMesh) {
          if (obj.geometry?.attributes?.position) {
            out.push(obj);
          }
        }
      });

      return out;
    }

    function getSkinnedWorldVertex(mesh, index, target) {
      target.fromBufferAttribute(mesh.geometry.attributes.position, index);

      if (mesh.isSkinnedMesh && mesh.skeleton) {
        mesh.applyBoneTransform(index, target);
      }

      return mesh.localToWorld(target);
    }

    function meshInfo(mesh) {
      return {
        mesh,
        name: mesh.name || "(unnamed)",
        vertices: mesh.geometry.attributes.position.count,
        indices: mesh.geometry.index?.count || 0
      };
    }

    // Pair each male mesh with one unused female mesh by closest vertex count.
    function pairMeshes(maleMeshes, femaleMeshes) {
      const femalePool = femaleMeshes.map(meshInfo);
      const used = new Set();
      const pairs = [];

      for (const male of maleMeshes.map(meshInfo)) {
        let best = null;
        let bestScore = Infinity;

        for (let i = 0; i < femalePool.length; i++) {
          if (used.has(i)) continue;

          const female = femalePool[i];

          const vertexScore =
            Math.abs(male.vertices - female.vertices);

          const indexScore =
            Math.abs(male.indices - female.indices) * 0.05;

          const score = vertexScore + indexScore;

          if (score < bestScore) {
            bestScore = score;
            best = { i, female };
          }
        }

        if (!best) continue;

        used.add(best.i);

        pairs.push({
          male,
          female: best.female,
          score: bestScore
        });
      }

      return pairs;
    }

    // =========================================================
    // SPATIAL HASH
    // =========================================================

    const CELL = 0.045;

    function hashKey(x, y, z) {
      return `${x}|${y}|${z}`;
    }

    function cellCoord(v) {
      return Math.floor(v / CELL);
    }

    function buildSpatialHash(points) {
      const map = new Map();

      for (let i = 0; i < points.length; i += 3) {
        const x = points[i];
        const y = points[i + 1];
        const z = points[i + 2];

        const cx = cellCoord(x);
        const cy = cellCoord(y);
        const cz = cellCoord(z);

        const key = hashKey(cx, cy, cz);

        let bucket = map.get(key);

        if (!bucket) {
          bucket = [];
          map.set(key, bucket);
        }

        bucket.push(i / 3);
      }

      return map;
    }

    function nearestPointIndex(px, py, pz, points, hash) {
      const cx = cellCoord(px);
      const cy = cellCoord(py);
      const cz = cellCoord(pz);

      let bestIndex = -1;
      let bestDist = Infinity;

      // Expand search until we find something.
      for (let radius = 0; radius <= 4; radius++) {
        let foundAny = false;

        for (let dx = -radius; dx <= radius; dx++) {
          for (let dy = -radius; dy <= radius; dy++) {
            for (let dz = -radius; dz <= radius; dz++) {
              // Only visit shell for radius > 0.
              if (
                radius > 0 &&
                Math.abs(dx) !== radius &&
                Math.abs(dy) !== radius &&
                Math.abs(dz) !== radius
              ) {
                continue;
              }

              const bucket =
                hash.get(hashKey(cx + dx, cy + dy, cz + dz));

              if (!bucket) continue;

              foundAny = true;

              for (const idx of bucket) {
                const k = idx * 3;

                const qx = points[k];
                const qy = points[k + 1];
                const qz = points[k + 2];

                const ddx = qx - px;
                const ddy = qy - py;
                const ddz = qz - pz;

                const d =
                  ddx * ddx +
                  ddy * ddy +
                  ddz * ddz;

                if (d < bestDist) {
                  bestDist = d;
                  bestIndex = idx;
                }
              }
            }
          }
        }

        if (foundAny && bestIndex >= 0) {
          return bestIndex;
        }
      }

      // Extremely unlikely fallback: brute force.
      for (let i = 0; i < points.length; i += 3) {
        const qx = points[i];
        const qy = points[i + 1];
        const qz = points[i + 2];

        const dx = qx - px;
        const dy = qy - py;
        const dz = qz - pz;

        const d = dx*dx + dy*dy + dz*dz;

        if (d < bestDist) {
          bestDist = d;
          bestIndex = i / 3;
        }
      }

      return bestIndex;
    }

    // =========================================================
    // BRIDGE BUILD
    // =========================================================

    let maleRoot;
    let femaleRoot;

    let bridgeGroup;
    let bridgeParts = [];

    let showingReference = false;

    const tmp = new THREE.Vector3();

    async function buildBridge() {
      const maleMeshes = getRenderableMeshes(maleRoot);
      const femaleMeshes = getRenderableMeshes(femaleRoot);

      const pairs = pairMeshes(maleMeshes, femaleMeshes);

      bridgeGroup = new THREE.Group();
      bridgeGroup.name = "SurfaceBridge";
      scene.add(bridgeGroup);

      bridgeParts = [];

      let totalVerts = 0;

      for (let pIndex = 0; pIndex < pairs.length; pIndex++) {
        const pair = pairs[pIndex];

        statusEl.textContent =
          `Building bridge mesh ${pIndex + 1}/${pairs.length}â¦`;

        // Female rest-world positions.
        const fCount = pair.female.vertices;
        const femaleWorld = new Float32Array(fCount * 3);

        for (let i = 0; i < fCount; i++) {
          getSkinnedWorldVertex(pair.female.mesh, i, tmp);

          const k = i * 3;
          femaleWorld[k] = tmp.x;
          femaleWorld[k + 1] = tmp.y;
          femaleWorld[k + 2] = tmp.z;
        }

        const hash = buildSpatialHash(femaleWorld);

        const mCount = pair.male.vertices;
        const maleWorld = new Float32Array(mCount * 3);
        const targetWorld = new Float32Array(mCount * 3);

        for (let i = 0; i < mCount; i++) {
          getSkinnedWorldVertex(pair.male.mesh, i, tmp);

          const k = i * 3;

          maleWorld[k] = tmp.x;
          maleWorld[k + 1] = tmp.y;
          maleWorld[k + 2] = tmp.z;

          const nearest =
            nearestPointIndex(
              tmp.x,
              tmp.y,
              tmp.z,
              femaleWorld,
              hash
            );

          const fk = nearest * 3;

          targetWorld[k] = femaleWorld[fk];
          targetWorld[k + 1] = femaleWorld[fk + 1];
          targetWorld[k + 2] = femaleWorld[fk + 2];
        }

        const geometry = new THREE.BufferGeometry();

        const live = new Float32Array(maleWorld);
        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(live, 3)
        );

        if (pair.male.mesh.geometry.index) {
          geometry.setIndex(
            pair.male.mesh.geometry.index.clone()
          );
        }

        // Keep male UVs/material for this experiment.
        const uv = pair.male.mesh.geometry.attributes.uv;

        if (uv) {
          geometry.setAttribute("uv", uv.clone());
        }

        geometry.computeVertexNormals();

        let material;

        if (Array.isArray(pair.male.mesh.material)) {
          material = pair.male.mesh.material.map(m => m.clone());
        } else if (pair.male.mesh.material) {
          material = pair.male.mesh.material.clone();
        } else {
          material = new THREE.MeshStandardMaterial({
            color: 0xd7aa8c,
            roughness: 0.75
          });
        }

        const bridgeMesh = new THREE.Mesh(geometry, material);
        bridgeMesh.frustumCulled = false;

        bridgeGroup.add(bridgeMesh);

        bridgeParts.push({
          mesh: bridgeMesh,
          maleWorld,
          targetWorld
        });

        totalVerts += mCount;

        // Give Safari a chance to breathe between meshes.
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      debugEl.textContent =
        `paired meshes: ${pairs.length}\n` +
        `bridge vertices: ${totalVerts}\n` +
        `correspondence: nearest female surface point\n` +
        `endpoint models remain available as references`;

      maleRoot.visible = false;
      femaleRoot.visible = false;
      bridgeGroup.visible = true;
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    let normalFrame = 0;

    function applyBridgeProgress(raw) {
      const t = smoothstep(
        THREE.MathUtils.clamp(raw, 0, 1)
      );

      for (const part of bridgeParts) {
        const pos = part.mesh.geometry.attributes.position.array;
        const a = part.maleWorld;
        const b = part.targetWorld;

        for (let i = 0; i < pos.length; i++) {
          pos[i] = a[i] + (b[i] - a[i]) * t;
        }

        part.mesh.geometry.attributes.position.needsUpdate = true;
      }

      // Recalculate normals occasionally while autoplaying.
      normalFrame++;

      if (normalFrame % 4 === 0 || raw === 0 || raw === 1) {
        for (const part of bridgeParts) {
          part.mesh.geometry.computeVertexNormals();
        }
      }

      progressSlider.value = String(raw);
      progressValue.textContent = Math.round(raw * 100) + "%";

      statusEl.textContent =
        `Surface bridge geometry â ${Math.round(raw * 100)}%`;
    }

    // =========================================================
    // PLAYBACK
    // =========================================================

    let playing = false;
    let playStart = 0;
    const PLAY_MS = 14000;

    document.getElementById("playBtn")
      .addEventListener("click", () => {
        showingReference = false;
        femaleRoot.visible = false;
        bridgeGroup.visible = true;

        playing = true;
        playStart = performance.now();
        applyBridgeProgress(0);
      });

    document.getElementById("resetBtn")
      .addEventListener("click", () => {
        playing = false;
        showingReference = false;
        femaleRoot.visible = false;
        bridgeGroup.visible = true;
        applyBridgeProgress(0);
      });

    progressSlider.addEventListener("input", () => {
      playing = false;
      showingReference = false;
      femaleRoot.visible = false;
      bridgeGroup.visible = true;
      applyBridgeProgress(Number(progressSlider.value));
    });

    document.getElementById("femaleRefBtn")
      .addEventListener("click", () => {
        playing = false;
        showingReference = true;
        bridgeGroup.visible = false;
        maleRoot.visible = false;
        femaleRoot.visible = true;

        statusEl.textContent =
          "Real female endpoint reference. This is NOT part of the morph.";
      });

    document.getElementById("bridgeBtn")
      .addEventListener("click", () => {
        showingReference = false;
        femaleRoot.visible = false;
        maleRoot.visible = false;
        bridgeGroup.visible = true;

        statusEl.textContent =
          "Surface bridge mesh restored.";
      });

    // =========================================================
    // CAMERA
    // =========================================================

    let bodyView = true;
    let yaw = 0;
    let pitch = THREE.MathUtils.degToRad(-7);

    function activeVisual() {
      if (showingReference) return femaleRoot;
      return bridgeGroup;
    }

    function setBodyView() {
      bodyView = true;

      const visual = activeVisual();
      if (!visual) return;

      const b = getBounds(visual);

      camera.position.set(
        b.center.x + 1.5,
        b.box.min.y + b.size.y * 0.62,
        b.center.z + 3.0
      );

      camera.lookAt(
        b.center.x,
        b.box.min.y + b.size.y * 0.49,
        b.center.z
      );

      statusEl.textContent =
        showingReference
          ? "BODY VIEW - real female reference."
          : "BODY VIEW - surface bridge.";
    }

    function setFirstPerson() {
      bodyView = false;

      const visual = activeVisual();
      if (!visual) return;

      const b = getBounds(visual);

      camera.position.set(
        b.center.x,
        b.box.min.y + b.size.y * 0.925,
        b.center.z - b.size.z * 0.16
      );

      pitch = THREE.MathUtils.degToRad(-10);

      statusEl.textContent =
        showingReference
          ? "FIRST PERSON - female reference."
          : "FIRST PERSON - surface bridge.";
    }

    function lookDown() {
      if (bodyView) setFirstPerson();

      pitch = THREE.MathUtils.degToRad(-66);

      statusEl.textContent =
        showingReference
          ? "LOOK DOWN - female reference."
          : "LOOK DOWN - watch the surface bridge.";
    }

    document.getElementById("bodyViewBtn")
      .addEventListener("click", setBodyView);

    document.getElementById("lookBtn")
      .addEventListener("click", lookDown);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const sensitivity = 0.004;

    function startDrag(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function drag(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      pitch -= dy * sensitivity;

      pitch = THREE.MathUtils.clamp(
        pitch,
        THREE.MathUtils.degToRad(-88),
        THREE.MathUtils.degToRad(70)
      );
    }

    function endDrag() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      e => {
        if (e.touches.length === 1) {
          startDrag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      e => {
        if (e.touches.length === 1) {
          e.preventDefault();

          drag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endDrag);
    renderer.domElement.addEventListener("touchcancel", endDrag);

    const euler = new THREE.Euler(0,0,0,"YXZ");

    // =========================================================
    // LOOP
    // =========================================================

    function animate(now) {
      requestAnimationFrame(animate);

      if (playing) {
        let p = (now - playStart) / PLAY_MS;

        if (p >= 1) {
          p = 1;
          playing = false;
        }

        applyBridgeProgress(p);
      }

      if (!bodyView) {
        euler.set(pitch, yaw, 0);
        camera.quaternion.setFromEuler(euler);
      }

      renderer.render(scene, camera);
    }

    animate();

    // =========================================================
    // SETUP
    // =========================================================

    async function setup() {
      statusEl.textContent = "Loading real male endpointâ¦";
      const maleGLTF = await loadGLB("./adult-male-lod.glb");

      statusEl.textContent = "Loading real female endpointâ¦";
      const femaleGLTF = await loadGLB("./adult-female-lod.glb");

      maleRoot = maleGLTF.scene;
      femaleRoot = femaleGLTF.scene;

      scene.add(maleRoot);
      scene.add(femaleRoot);

      normalizeModel(maleRoot, 1.80);
      normalizeModel(femaleRoot, 1.65);

      maleRoot.visible = false;
      femaleRoot.visible = false;

      await buildBridge();

      applyBridgeProgress(0);
      setBodyView();

      loading.style.display = "none";

      statusEl.textContent =
        "V16 ready. PLAY BRIDGE performs a real geometric surface morph experiment.";
    }

    setup().catch(fail);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );
    });
  </script>
</body>
</html>
