<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game V19 - Exact Female Endpoint Bridge</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101217;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 690px;
      margin: auto;
      padding: 11px 13px;
      border-radius: 17px;
      color: white;
      background: rgba(0,0,0,0.67);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .debug {
      margin-top: 4px;
      font-size: 10px;
      line-height: 1.35;
      opacity: 0.74;
      white-space: pre-line;
    }

    #controls {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      z-index: 30;
      max-height: 44vh;
      overflow: auto;
      border-radius: 18px;
      background: rgba(12,14,18,0.93);
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    #buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 11px;
      min-width: 92px;
      color: #111;
      background: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 800;
    }

    button:active {
      transform: scale(0.97);
    }

    .controlRow {
      padding: 9px 2px;
      border-top: 1px solid rgba(255,255,255,0.09);
    }

    .labelLine {
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .value {
      opacity: 0.8;
      min-width: 44px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #101217;
      color: white;
      font-size: 16px;
      font-weight: 800;
    }

    #fatal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 18%;
      left: 15px;
      right: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #761c1c;
      color: white;
      font: 700 13px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="game"></div>
  <div id="loading">Loading V19 and building an exact-female-endpoint regional bridgeâ¦</div>
  <div id="fatal"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game - V19 Exact Female Endpoint Bridge</div>
      <div id="status" class="status">Loading both real endpoint humansâ¦</div>
      <div id="debug" class="debug"></div>
    </div>
  </div>

  <div id="controls">
    <div id="buttons">
      <button id="bodyViewBtn">BODY VIEW</button>
      <button id="lookBtn">LOOK DOWN</button>
      <button id="resetBtn">RESET</button>
      <button id="playBtn">PLAY MORPH</button>
      <button id="maleRefBtn">MALE REF</button>
      <button id="femaleRefBtn">FEMALE REF</button>
      <button id="bridgeBtn">BRIDGE</button>
    </div>

    <div class="controlRow">
      <div class="labelLine">
        <span>MALE TO FEMALE SURFACE</span>
        <span id="progressValue" class="value">0%</span>
      </div>
      <input id="progressSlider" type="range" min="0" max="1" step="0.001" value="0">
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const loading = document.getElementById("loading");
    const fatal = document.getElementById("fatal");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const progressSlider = document.getElementById("progressSlider");
    const progressValue = document.getElementById("progressValue");

    function fail(error) {
      console.error(error);
      loading.style.display = "none";
      fatal.style.display = "block";
      fatal.textContent =
        "V19 ERROR\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nSend me a screenshot of this red box.";
    }

    window.addEventListener("error", e => {
      if (e.error) fail(e.error);
    });

    window.addEventListener("unhandledrejection", e => {
      fail(e.reason);
    });

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94d7f2);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.015,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.getElementById("game").appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x65727b, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(4, 8, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xdceaff, 1.0);
    fill.position.set(-4, 4, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xa2a5a8,
        roughness: 0.95
      })
    );

    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function roomBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.88
        })
      );

      mesh.position.set(x,y,z);
      mesh.scale.set(sx,sy,sz);
      scene.add(mesh);
    }

    roomBox(0, 1.5, -6, 10, 3, 0.2, 0xd8dde1);
    roomBox(-5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);
    roomBox(5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);

    // =========================================================
    // LOAD + NORMALIZE
    // =========================================================

    const loader = new GLTFLoader();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    }

    function getBounds(root) {
      root.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      return { box, size, center };
    }

    function normalizeModel(root, targetHeight) {
      let b = getBounds(root);

      if (!isFinite(b.size.y) || b.size.y <= 0.001) {
        throw new Error("Invalid model bounds.");
      }

      const scale = targetHeight / b.size.y;
      root.scale.multiplyScalar(scale);
      root.updateMatrixWorld(true);

      b = getBounds(root);

      root.position.x -= b.center.x;
      root.position.z -= b.center.z;
      root.position.y -= b.box.min.y;

      root.updateMatrixWorld(true);
    }

    function collectBones(root) {
      const map = new Map();

      root.traverse(obj => {
        if (obj.isBone && obj.name) {
          map.set(obj.name, obj);
        }
      });

      return map;
    }

    function getRenderableMeshes(root) {
      const out = [];

      root.traverse(obj => {
        if (
          (obj.isMesh || obj.isSkinnedMesh) &&
          obj.geometry?.attributes?.position
        ) {
          out.push(obj);
        }
      });

      return out;
    }

    // =========================================================
    // VERTEX HELPERS
    // =========================================================

    const tmp = new THREE.Vector3();
    const tmp2 = new THREE.Vector3();
    const inv = new THREE.Matrix4();

    function getWorldVertex(mesh, index, target) {
      target.fromBufferAttribute(
        mesh.geometry.attributes.position,
        index
      );

      if (mesh.isSkinnedMesh && mesh.skeleton) {
        mesh.applyBoneTransform(index, target);
      }

      return mesh.localToWorld(target);
    }

    function dominantBoneName(mesh, index) {
      if (
        !mesh.isSkinnedMesh ||
        !mesh.skeleton ||
        !mesh.geometry.attributes.skinIndex ||
        !mesh.geometry.attributes.skinWeight
      ) {
        return null;
      }

      const si = mesh.geometry.attributes.skinIndex;
      const sw = mesh.geometry.attributes.skinWeight;

      const indices = [
        si.getX(index),
        si.getY(index),
        si.getZ(index),
        si.getW(index)
      ];

      const weights = [
        sw.getX(index),
        sw.getY(index),
        sw.getZ(index),
        sw.getW(index)
      ];

      let best = 0;

      for (let k = 1; k < 4; k++) {
        if (weights[k] > weights[best]) {
          best = k;
        }
      }

      const bone =
        mesh.skeleton.bones[indices[best]];

      return bone?.name || null;
    }

    function worldToBoneLocal(world, bone, target) {
      inv.copy(bone.matrixWorld).invert();
      return target.copy(world).applyMatrix4(inv);
    }

    // =========================================================
    // REGION DATA
    // =========================================================

    function ensureRegion(map, key) {
      let region = map.get(key);

      if (!region) {
        region = {
          key,
          entries: [],
          min: new THREE.Vector3(
            +Infinity,+Infinity,+Infinity
          ),
          max: new THREE.Vector3(
            -Infinity,-Infinity,-Infinity
          )
        };

        map.set(key, region);
      }

      return region;
    }

    function normalizeLocal(local, min, max, out) {
      const sx = Math.max(1e-5, max.x-min.x);
      const sy = Math.max(1e-5, max.y-min.y);
      const sz = Math.max(1e-5, max.z-min.z);

      return out.set(
        (local.x-min.x)/sx,
        (local.y-min.y)/sy,
        (local.z-min.z)/sz
      );
    }

    // A deterministic 3D ordering key.
    // The tiny mixed terms stop huge ties on nearly-flat regions.
    function orderingKey(n) {
      return (
        n.y * 1000000 +
        n.x * 1000 +
        n.z +
        n.x * n.z * 0.0001
      );
    }

    function buildBoneRegions(root, boneMap) {
      const regions = new Map();
      const meshes = getRenderableMeshes(root);

      for (let meshIndex = 0; meshIndex < meshes.length; meshIndex++) {
        const mesh = meshes[meshIndex];
        const count =
          mesh.geometry.attributes.position.count;

        for (let vertexIndex = 0; vertexIndex < count; vertexIndex++) {
          const boneName =
            dominantBoneName(mesh, vertexIndex);

          if (!boneName) continue;

          const bone = boneMap.get(boneName);
          if (!bone) continue;

          getWorldVertex(
            mesh,
            vertexIndex,
            tmp
          );

          worldToBoneLocal(
            tmp,
            bone,
            tmp2
          );

          const region =
            ensureRegion(regions, boneName);

          const local = tmp2.clone();

          region.min.min(local);
          region.max.max(local);

          region.entries.push({
            mesh,
            meshIndex,
            vertexIndex,
            boneName,
            world: tmp.clone(),
            local,
            normalized: new THREE.Vector3(),
            order: 0
          });
        }
      }

      for (const region of regions.values()) {
        for (const entry of region.entries) {
          normalizeLocal(
            entry.local,
            region.min,
            region.max,
            entry.normalized
          );

          entry.order =
            orderingKey(entry.normalized);
        }

        region.entries.sort(
          (a,b) => a.order-b.order
        );
      }

      return regions;
    }

    // =========================================================
    // UNSKINNED / MESH-LEVEL REGIONS
    // =========================================================

    function meshSignatureInfo(mesh) {
      return {
        mesh,
        name: mesh.name || "(unnamed)",
        vertices:
          mesh.geometry.attributes.position.count,
        indices:
          mesh.geometry.index?.count || 0
      };
    }

    function pairMeshesBySize(aMeshes, bMeshes) {
      const bInfo =
        bMeshes.map(meshSignatureInfo);

      const used = new Set();
      const pairs = [];

      for (const a of aMeshes.map(meshSignatureInfo)) {
        let best = null;
        let score = Infinity;

        for (let i = 0; i < bInfo.length; i++) {
          if (used.has(i)) continue;

          const b = bInfo[i];

          const s =
            Math.abs(a.vertices-b.vertices) +
            Math.abs(a.indices-b.indices) * 0.05;

          if (s < score) {
            score = s;
            best = { i, b };
          }
        }

        if (best) {
          used.add(best.i);

          pairs.push({
            a,
            b: best.b
          });
        }
      }

      return pairs;
    }

    function buildMeshRegion(mesh) {
      const entries = [];
      const min =
        new THREE.Vector3(+Infinity,+Infinity,+Infinity);
      const max =
        new THREE.Vector3(-Infinity,-Infinity,-Infinity);

      const count =
        mesh.geometry.attributes.position.count;

      for (let i = 0; i < count; i++) {
        getWorldVertex(mesh,i,tmp);

        const world = tmp.clone();

        min.min(world);
        max.max(world);

        entries.push({
          mesh,
          vertexIndex: i,
          world,
          normalized: new THREE.Vector3(),
          order: 0
        });
      }

      for (const entry of entries) {
        normalizeLocal(
          entry.world,
          min,
          max,
          entry.normalized
        );

        entry.order =
          orderingKey(entry.normalized);
      }

      entries.sort((a,b) => a.order-b.order);

      return {
        mesh,
        entries,
        min,
        max
      };
    }

    // =========================================================
    // BRIDGE
    // =========================================================

    let maleRoot;
    let femaleRoot;
    let maleBones;
    let femaleBones;

    let maleRegions;
    let femaleRegions;

    let bridgeGroup;
    let bridgeParts = [];

    let showing = "bridge";

    function regionQuantileEntry(region, q) {
      if (!region || region.entries.length === 0) {
        return null;
      }

      const i = Math.round(
        THREE.MathUtils.clamp(q,0,1) *
        (region.entries.length-1)
      );

      return region.entries[i];
    }

    async function buildBridge() {
      const femaleMeshes =
        getRenderableMeshes(femaleRoot);

      const maleMeshes =
        getRenderableMeshes(maleRoot);

      const meshPairs =
        pairMeshesBySize(femaleMeshes, maleMeshes);

      const maleMeshRegionByFemale =
        new Map();

      // Prebuild mesh fallback regions.
      for (const pair of meshPairs) {
        maleMeshRegionByFemale.set(
          pair.a.mesh,
          buildMeshRegion(pair.b.mesh)
        );
      }

      bridgeGroup =
        new THREE.Group();

      bridgeGroup.name =
        "V19FemaleTopologyBridge";

      scene.add(bridgeGroup);

      bridgeParts = [];

      let exactTargetVertices = 0;
      let boneMapped = 0;
      let meshFallback = 0;

      for (let meshIndex = 0;
           meshIndex < femaleMeshes.length;
           meshIndex++) {

        const femaleMesh =
          femaleMeshes[meshIndex];

        statusEl.textContent =
          `Building female-topology bridge ${meshIndex+1}/${femaleMeshes.length}â¦`;

        const count =
          femaleMesh.geometry.attributes.position.count;

        const start =
          new Float32Array(count*3);

        const target =
          new Float32Array(count*3);

        // For deterministic region rank, create a lookup
        // from female mesh+vertex to the female region entry.
        const femaleEntryLookup =
          new Map();

        for (const region of femaleRegions.values()) {
          for (let rank = 0;
               rank < region.entries.length;
               rank++) {

            const entry =
              region.entries[rank];

            if (entry.mesh !== femaleMesh) {
              continue;
            }

            femaleEntryLookup.set(
              entry.vertexIndex,
              {
                region,
                rank
              }
            );
          }
        }

        const fallbackRegion =
          maleMeshRegionByFemale.get(femaleMesh) || null;

        // Female mesh-level ordering for unskinned fallback.
        const femaleMeshRegion =
          buildMeshRegion(femaleMesh);

        const femaleMeshRank =
          new Map();

        for (let rank = 0;
             rank < femaleMeshRegion.entries.length;
             rank++) {

          femaleMeshRank.set(
            femaleMeshRegion.entries[rank].vertexIndex,
            rank
          );
        }

        for (let i = 0; i < count; i++) {
          // TARGET is literally the real female vertex.
          getWorldVertex(
            femaleMesh,
            i,
            tmp
          );

          const k = i*3;

          target[k] = tmp.x;
          target[k+1] = tmp.y;
          target[k+2] = tmp.z;

          exactTargetVertices++;

          // START tries to reconstruct the real male surface
          // using the same anatomical-region rank.
          const lookup =
            femaleEntryLookup.get(i);

          let maleStart = null;

          if (lookup) {
            const femaleRegion =
              lookup.region;

            const maleRegion =
              maleRegions.get(
                femaleRegion.key
              );

            if (
              maleRegion &&
              maleRegion.entries.length > 0
            ) {
              const q =
                femaleRegion.entries.length <= 1
                  ? 0
                  : lookup.rank /
                    (femaleRegion.entries.length-1);

              const mapped =
                regionQuantileEntry(
                  maleRegion,
                  q
                );

              if (mapped) {
                maleStart =
                  mapped.world;

                boneMapped++;
              }
            }
          }

          if (!maleStart && fallbackRegion) {
            const rank =
              femaleMeshRank.get(i) || 0;

            const q =
              femaleMeshRegion.entries.length <= 1
                ? 0
                : rank /
                  (femaleMeshRegion.entries.length-1);

            const mapped =
              regionQuantileEntry(
                fallbackRegion,
                q
              );

            if (mapped) {
              maleStart =
                mapped.world;

              meshFallback++;
            }
          }

          if (!maleStart) {
            // Last resort: keep target position.
            maleStart = tmp;
          }

          start[k] = maleStart.x;
          start[k+1] = maleStart.y;
          start[k+2] = maleStart.z;
        }

        const geometry =
          new THREE.BufferGeometry();

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(
            new Float32Array(start),
            3
          )
        );

        // IMPORTANT:
        // Use FEMALE topology/indices/UVs.
        // This is why 100% can become the exact female mesh.
        if (femaleMesh.geometry.index) {
          geometry.setIndex(
            femaleMesh.geometry.index.clone()
          );
        }

        if (femaleMesh.geometry.attributes.uv) {
          geometry.setAttribute(
            "uv",
            femaleMesh.geometry.attributes.uv.clone()
          );
        }

        geometry.computeVertexNormals();

        let material;

        if (Array.isArray(femaleMesh.material)) {
          material =
            femaleMesh.material.map(m => m.clone());
        } else if (femaleMesh.material) {
          material =
            femaleMesh.material.clone();
        } else {
          material =
            new THREE.MeshStandardMaterial({
              color: 0xd7aa8c,
              roughness: 0.74
            });
        }

        const bridgeMesh =
          new THREE.Mesh(
            geometry,
            material
          );

        bridgeMesh.frustumCulled =
          false;

        bridgeGroup.add(
          bridgeMesh
        );

        bridgeParts.push({
          mesh: bridgeMesh,
          start,
          target
        });

        await new Promise(
          resolve =>
            setTimeout(resolve,0)
        );
      }

      debugEl.textContent =
        `bridge topology: FEMALE endpoint topology\n` +
        `female target vertices copied exactly: ${exactTargetVertices}\n` +
        `bone-region start mappings: ${boneMapped}\n` +
        `mesh fallback mappings: ${meshFallback}\n` +
        `male regions: ${maleRegions.size}\n` +
        `female regions: ${femaleRegions.size}\n` +
        `100% geometry target error: 0 by construction`;

      maleRoot.visible = false;
      femaleRoot.visible = false;
      bridgeGroup.visible = true;
    }

    // =========================================================
    // MORPH
    // =========================================================

    function smootherstep(t) {
      return t*t*t*(t*(t*6 - 15)+10);
    }

    let normalFrame = 0;

    function applyProgress(raw) {
      const p =
        THREE.MathUtils.clamp(raw,0,1);

      const t =
        smootherstep(p);

      for (const part of bridgeParts) {
        const live =
          part.mesh.geometry
            .attributes.position.array;

        const a =
          part.start;

        const b =
          part.target;

        for (let i = 0;
             i < live.length;
             i++) {

          live[i] =
            a[i] +
            (b[i]-a[i])*t;
        }

        part.mesh.geometry
          .attributes.position
          .needsUpdate = true;
      }

      normalFrame++;

      if (
        normalFrame % 3 === 0 ||
        p === 0 ||
        p === 1
      ) {
        for (const part of bridgeParts) {
          part.mesh.geometry
            .computeVertexNormals();
        }
      }

      progressSlider.value =
        String(p);

      progressValue.textContent =
        Math.round(p*100) + "%";

      statusEl.textContent =
        `Exact-endpoint surface transformation - ${Math.round(p*100)}%`;
    }

    // =========================================================
    // VIEW MODES
    // =========================================================

    function setShowing(mode) {
      showing = mode;

      bridgeGroup.visible =
        mode === "bridge";

      maleRoot.visible =
        mode === "male";

      femaleRoot.visible =
        mode === "female";

      setBodyView();

      if (mode === "bridge") {
        statusEl.textContent =
          "Bridge body - female topology, male-shaped start, exact female target.";
      }

      if (mode === "male") {
        statusEl.textContent =
          "Real male endpoint reference.";
      }

      if (mode === "female") {
        statusEl.textContent =
          "Real female endpoint reference.";
      }
    }

    document.getElementById("maleRefBtn")
      .addEventListener(
        "click",
        () => {
          playing = false;
          setShowing("male");
        }
      );

    document.getElementById("femaleRefBtn")
      .addEventListener(
        "click",
        () => {
          playing = false;
          setShowing("female");
        }
      );

    document.getElementById("bridgeBtn")
      .addEventListener(
        "click",
        () => {
          setShowing("bridge");
        }
      );

    // =========================================================
    // PLAYBACK
    // =========================================================

    let playing = false;
    let playStart = 0;
    const PLAY_MS = 17000;

    document.getElementById("playBtn")
      .addEventListener(
        "click",
        () => {
          setShowing("bridge");
          playing = true;
          playStart =
            performance.now();
          applyProgress(0);
        }
      );

    document.getElementById("resetBtn")
      .addEventListener(
        "click",
        () => {
          playing = false;
          setShowing("bridge");
          applyProgress(0);
        }
      );

    progressSlider.addEventListener(
      "input",
      () => {
        playing = false;
        setShowing("bridge");
        applyProgress(
          Number(
            progressSlider.value
          )
        );
      }
    );

    // =========================================================
    // CAMERA
    // =========================================================

    let bodyView = true;
    let yaw = 0;
    let pitch =
      THREE.MathUtils.degToRad(-7);

    function activeVisual() {
      if (showing === "male") {
        return maleRoot;
      }

      if (showing === "female") {
        return femaleRoot;
      }

      return bridgeGroup;
    }

    function setBodyView() {
      bodyView = true;

      const visual =
        activeVisual();

      if (!visual) return;

      const b =
        getBounds(visual);

      camera.position.set(
        b.center.x + 1.5,
        b.box.min.y +
          b.size.y * 0.62,
        b.center.z + 3.0
      );

      camera.lookAt(
        b.center.x,
        b.box.min.y +
          b.size.y * 0.49,
        b.center.z
      );
    }

    function setFirstPerson() {
      bodyView = false;

      const visual =
        activeVisual();

      if (!visual) return;

      const b =
        getBounds(visual);

      camera.position.set(
        b.center.x,
        b.box.min.y +
          b.size.y * 0.925,
        b.center.z -
          b.size.z * 0.16
      );

      pitch =
        THREE.MathUtils.degToRad(-10);
    }

    function lookDown() {
      if (bodyView) {
        setFirstPerson();
      }

      pitch =
        THREE.MathUtils.degToRad(-66);

      statusEl.textContent =
        showing === "bridge"
          ? "LOOK DOWN - exact-endpoint bridge."
          : `LOOK DOWN - ${showing} reference.`;
    }

    document.getElementById("bodyViewBtn")
      .addEventListener(
        "click",
        () => {
          setBodyView();

          statusEl.textContent =
            showing === "bridge"
              ? "BODY VIEW - exact-endpoint bridge."
              : `BODY VIEW - ${showing} reference.`;
        }
      );

    document.getElementById("lookBtn")
      .addEventListener(
        "click",
        lookDown
      );

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    const sensitivity =
      0.004;

    function startDrag(x,y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function drag(x,y) {
      if (
        !dragging ||
        bodyView
      ) {
        return;
      }

      const dx =
        x-lastX;

      const dy =
        y-lastY;

      lastX = x;
      lastY = y;

      yaw -=
        dx*sensitivity;

      pitch -=
        dy*sensitivity;

      pitch =
        THREE.MathUtils.clamp(
          pitch,
          THREE.MathUtils.degToRad(-88),
          THREE.MathUtils.degToRad(70)
        );
    }

    function endDrag() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      e => {
        if (
          e.touches.length === 1
        ) {
          startDrag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive:false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      e => {
        if (
          e.touches.length === 1
        ) {
          e.preventDefault();

          drag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive:false }
    );

    renderer.domElement.addEventListener(
      "touchend",
      endDrag
    );

    renderer.domElement.addEventListener(
      "touchcancel",
      endDrag
    );

    const euler =
      new THREE.Euler(
        0,0,0,"YXZ"
      );

    // =========================================================
    // LOOP
    // =========================================================

    function animate(now) {
      requestAnimationFrame(
        animate
      );

      if (playing) {
        let p =
          (now-playStart) /
          PLAY_MS;

        if (p >= 1) {
          p = 1;
          playing = false;
        }

        applyProgress(p);
      }

      if (!bodyView) {
        euler.set(
          pitch,
          yaw,
          0
        );

        camera.quaternion
          .setFromEuler(euler);
      }

      renderer.render(
        scene,
        camera
      );
    }

    animate();

    // =========================================================
    // SETUP
    // =========================================================

    async function setup() {
      statusEl.textContent =
        "Loading real male endpointâ¦";

      const maleGLTF =
        await loadGLB(
          "./adult-male-lod.glb"
        );

      statusEl.textContent =
        "Loading real female endpointâ¦";

      const femaleGLTF =
        await loadGLB(
          "./adult-female-lod.glb"
        );

      maleRoot =
        maleGLTF.scene;

      femaleRoot =
        femaleGLTF.scene;

      scene.add(maleRoot);
      scene.add(femaleRoot);

      normalizeModel(
        maleRoot,
        1.80
      );

      normalizeModel(
        femaleRoot,
        1.65
      );

      maleBones =
        collectBones(maleRoot);

      femaleBones =
        collectBones(femaleRoot);

      maleRoot.updateMatrixWorld(true);
      femaleRoot.updateMatrixWorld(true);

      statusEl.textContent =
        "Building male bone regionsâ¦";

      maleRegions =
        buildBoneRegions(
          maleRoot,
          maleBones
        );

      statusEl.textContent =
        "Building female bone regionsâ¦";

      femaleRegions =
        buildBoneRegions(
          femaleRoot,
          femaleBones
        );

      maleRoot.visible = false;
      femaleRoot.visible = false;

      await buildBridge();

      applyProgress(0);
      setShowing("bridge");

      loading.style.display =
        "none";

      statusEl.textContent =
        "V19 ready. At 100%, the bridge uses the exact real female vertex positions and female topology.";
    }

    setup().catch(fail);

    window.addEventListener(
      "resize",
      () => {
        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          Math.min(
            window.devicePixelRatio,
            2
          )
        );
      }
    );
  </script>
</body>
</html>
