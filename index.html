<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game V12 - Morph Inspector</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101217;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 620px;
      margin: auto;
      padding: 11px 13px;
      border-radius: 17px;
      color: white;
      background: rgba(0,0,0,0.64);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .debug {
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.72;
      white-space: pre-line;
    }

    #controlsWrap {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      z-index: 30;
      max-height: 43vh;
      overflow: auto;
      border-radius: 18px;
      background: rgba(12, 14, 18, 0.90);
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    #topButtons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 11px;
      min-width: 95px;
      color: #111;
      background: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 800;
    }

    button:active {
      transform: scale(0.97);
    }

    .morphRow {
      padding: 9px 2px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .morphRow:first-child {
      border-top: none;
    }

    .morphLabel {
      color: white;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .morphLine {
      display: grid;
      grid-template-columns: 1fr 46px;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
    }

    .valueBox {
      color: white;
      font-size: 11px;
      text-align: right;
      opacity: 0.85;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #101217;
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    #fatal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 25%;
      left: 15px;
      right: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #761c1c;
      color: white;
      font: 700 13px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="loading">Loading V12 morph inspectorâ¦</div>
  <div id="fatal"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game â V12 Female Morph Inspector</div>
      <div id="status" class="status">Loading female GLB and morph targetsâ¦</div>
      <div id="debug" class="debug"></div>
    </div>
  </div>

  <div id="controlsWrap">
    <div id="topButtons">
      <button id="bodyViewBtn">BODY VIEW</button>
      <button id="lookBtn">LOOK DOWN</button>
      <button id="resetBtn">RESET MORPHS</button>
      <button id="randomBtn">RANDOM TEST</button>
    </div>
    <div id="morphList"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const loading = document.getElementById("loading");
    const fatal = document.getElementById("fatal");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const morphList = document.getElementById("morphList");

    function fail(error) {
      console.error(error);
      loading.style.display = "none";
      fatal.style.display = "block";
      fatal.textContent =
        "V12 ERROR\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nSend me a screenshot of this red box.";
    }

    window.addEventListener("error", e => {
      if (e.error) fail(e.error);
    });

    window.addEventListener("unhandledrejection", e => {
      fail(e.reason);
    });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94d7f2);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.015,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById("game").appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x64707a, 2.4));

    const key = new THREE.DirectionalLight(0xffffff, 2.7);
    key.position.set(4, 8, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xd8e7ff, 1.2);
    fill.position.set(-4, 3, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0x9ea2a5,
        roughness: 0.94
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function box(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({ color, roughness: 0.88 })
      );
      mesh.position.set(x,y,z);
      mesh.scale.set(sx,sy,sz);
      scene.add(mesh);
    }

    box(0, 1.5, -6, 10, 3, 0.2, 0xd8dde1);
    box(-5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);
    box(5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);

    const loader = new GLTFLoader();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    }

    function getBounds(object) {
      object.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(object);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      return { box, size, center };
    }

    function normalizeModel(root, targetHeight = 1.65) {
      let b = getBounds(root);

      if (!isFinite(b.size.y) || b.size.y <= 0.001) {
        throw new Error("Invalid female model bounding box.");
      }

      const scale = targetHeight / b.size.y;
      root.scale.multiplyScalar(scale);
      root.updateMatrixWorld(true);

      b = getBounds(root);

      root.position.x -= b.center.x;
      root.position.z -= b.center.z;
      root.position.y -= b.box.min.y;

      root.updateMatrixWorld(true);
      return getBounds(root);
    }

    let femaleRoot;
    let femaleBounds;

    const morphTargets = [];
    const sliderRefs = [];

    function collectMorphTargets(root) {
      morphTargets.length = 0;

      root.traverse(obj => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;

        const dict = obj.morphTargetDictionary || {};
        const influences = obj.morphTargetInfluences || [];

        for (const [name, index] of Object.entries(dict)) {
          morphTargets.push({
            mesh: obj,
            meshName: obj.name || "(unnamed mesh)",
            name,
            index,
            influences
          });
        }
      });
    }

    function buildMorphUI() {
      morphList.innerHTML = "";
      sliderRefs.length = 0;

      if (morphTargets.length === 0) {
        const div = document.createElement("div");
        div.className = "morphLabel";
        div.textContent = "No named morph targets found.";
        morphList.appendChild(div);
        return;
      }

      morphTargets.forEach((morph, i) => {
        const row = document.createElement("div");
        row.className = "morphRow";

        const label = document.createElement("div");
        label.className = "morphLabel";
        label.textContent =
          `${i + 1}. ${morph.name} â ${morph.meshName}`;

        const line = document.createElement("div");
        line.className = "morphLine";

        const slider = document.createElement("input");
        slider.type = "range";
        slider.min = "-1";
        slider.max = "1";
        slider.step = "0.01";
        slider.value = String(morph.influences[morph.index] || 0);

        const value = document.createElement("div");
        value.className = "valueBox";
        value.textContent = Number(slider.value).toFixed(2);

        slider.addEventListener("input", () => {
          const v = Number(slider.value);
          morph.influences[morph.index] = v;
          value.textContent = v.toFixed(2);
          statusEl.textContent =
            `Testing morph: ${morph.name} = ${v.toFixed(2)}`;
        });

        line.appendChild(slider);
        line.appendChild(value);

        row.appendChild(label);
        row.appendChild(line);

        morphList.appendChild(row);

        sliderRefs.push({
          slider,
          value,
          morph
        });
      });
    }

    function resetMorphs() {
      for (const item of sliderRefs) {
        item.slider.value = "0";
        item.value.textContent = "0.00";
        item.morph.influences[item.morph.index] = 0;
      }

      statusEl.textContent = "All female morphs reset to 0.";
    }

    function randomMorphTest() {
      resetMorphs();

      if (sliderRefs.length === 0) return;

      const count = Math.min(3, sliderRefs.length);
      const picked = [...sliderRefs]
        .sort(() => Math.random() - 0.5)
        .slice(0, count);

      for (const item of picked) {
        const v = Math.random() * 0.8;
        item.slider.value = String(v);
        item.value.textContent = v.toFixed(2);
        item.morph.influences[item.morph.index] = v;
      }

      statusEl.textContent = "Random morph test applied.";
    }

    document.getElementById("resetBtn")
      .addEventListener("click", resetMorphs);

    document.getElementById("randomBtn")
      .addEventListener("click", randomMorphTest);

    let bodyView = true;
    let yaw = 0;
    let pitch = THREE.MathUtils.degToRad(-6);

    function setBodyView() {
      bodyView = true;

      if (!femaleRoot) return;

      const b = getBounds(femaleRoot);

      camera.position.set(
        b.center.x + 1.55,
        b.box.min.y + b.size.y * 0.62,
        b.center.z + 3.0
      );

      camera.lookAt(
        b.center.x,
        b.box.min.y + b.size.y * 0.49,
        b.center.z
      );

      statusEl.textContent = "BODY VIEW â inspect morph changes.";
    }

    function setFirstPerson() {
      bodyView = false;

      if (!femaleRoot) return;

      const b = getBounds(femaleRoot);
      const eyeY = b.box.min.y + b.size.y * 0.925;

      camera.position.set(
        b.center.x,
        eyeY,
        b.center.z - b.size.z * 0.16
      );

      pitch = THREE.MathUtils.degToRad(-10);
      statusEl.textContent = "FIRST PERSON â drag to look.";
    }

    function setLookDown() {
      if (bodyView) setFirstPerson();
      pitch = THREE.MathUtils.degToRad(-66);
      statusEl.textContent = "LOOK DOWN â inspect morphs in first person.";
    }

    document.getElementById("bodyViewBtn")
      .addEventListener("click", setBodyView);

    document.getElementById("lookBtn")
      .addEventListener("click", setLookDown);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const sensitivity = 0.004;

    function startDrag(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function drag(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      pitch -= dy * sensitivity;

      pitch = THREE.MathUtils.clamp(
        pitch,
        THREE.MathUtils.degToRad(-88),
        THREE.MathUtils.degToRad(70)
      );
    }

    function endDrag() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      e => {
        if (e.touches.length === 1) {
          startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      e => {
        if (e.touches.length === 1) {
          e.preventDefault();
          drag(e.touches[0].clientX, e.touches[0].clientY);
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endDrag);
    renderer.domElement.addEventListener("touchcancel", endDrag);

    function setHeadVisibility(root, visible) {
      if (!root) return;

      root.traverse(obj => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;

        const n = (obj.name || "").toLowerCase();

        if (
          n.includes("head") ||
          n.includes("hair") ||
          n.includes("eye") ||
          n.includes("teeth")
        ) {
          obj.visible = visible;
        }
      });
    }

    const euler = new THREE.Euler(0, 0, 0, "YXZ");

    function animate() {
      requestAnimationFrame(animate);

      if (!bodyView && femaleRoot) {
        setHeadVisibility(femaleRoot, false);
        euler.set(pitch, yaw, 0);
        camera.quaternion.setFromEuler(euler);
      } else if (femaleRoot) {
        setHeadVisibility(femaleRoot, true);
      }

      renderer.render(scene, camera);
    }

    animate();

    async function setup() {
      const gltf = await loadGLB("./adult-female-lod.glb");

      femaleRoot = gltf.scene;
      scene.add(femaleRoot);

      femaleBounds = normalizeModel(femaleRoot, 1.65);

      collectMorphTargets(femaleRoot);
      buildMorphUI();

      const named = morphTargets.map(x => x.name);

      debugEl.textContent =
        `named morph controls found: ${morphTargets.length}\n` +
        named.join(" â¢ ");

      console.log("FEMALE MORPH TARGETS", morphTargets);

      setBodyView();

      loading.style.display = "none";
      statusEl.textContent =
        `Female model loaded. Found ${morphTargets.length} named morph controls.`;

      if (morphTargets.length === 0) {
        statusEl.textContent =
          "Female model loaded, but no named morph controls were exposed.";
      }
    }

    setup().catch(fail);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
