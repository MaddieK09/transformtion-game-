<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game V14 - Compatibility Inspector</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101217;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 8px);
      left: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 680px;
      margin: auto;
      padding: 11px 13px;
      border-radius: 17px;
      color: white;
      background: rgba(0,0,0,0.66);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
    }

    .status {
      margin-top: 5px;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .debug {
      margin-top: 5px;
      font-size: 10px;
      line-height: 1.35;
      opacity: 0.78;
      white-space: pre-line;
    }

    #controls {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      z-index: 30;
      max-height: 43vh;
      overflow: auto;
      border-radius: 18px;
      background: rgba(12,14,18,0.92);
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    #buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 10px 11px;
      min-width: 98px;
      color: #111;
      background: rgba(255,255,255,0.94);
      font-size: 12px;
      font-weight: 800;
    }

    button:active {
      transform: scale(0.97);
    }

    .section {
      color: white;
      border-top: 1px solid rgba(255,255,255,0.09);
      padding-top: 9px;
      margin-top: 9px;
    }

    .section h3 {
      margin: 0 0 5px 0;
      font-size: 12px;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
      opacity: 0.9;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: #101217;
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    #fatal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 25%;
      left: 15px;
      right: 15px;
      padding: 18px;
      border-radius: 15px;
      background: #761c1c;
      color: white;
      font: 700 13px/1.45 Arial, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="game"></div>
  <div id="loading">Loading V14 compatibility inspectorâ¦</div>
  <div id="fatal"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game â V14 Male/Female Compatibility Inspector</div>
      <div id="status" class="status">Loading both real human modelsâ¦</div>
      <div id="debug" class="debug"></div>
    </div>
  </div>

  <div id="controls">
    <div id="buttons">
      <button id="maleBtn">SHOW MALE</button>
      <button id="femaleBtn">SHOW FEMALE</button>
      <button id="bodyViewBtn">BODY VIEW</button>
      <button id="lookBtn">LOOK DOWN</button>
    </div>

    <div class="section">
      <h3>COMPATIBILITY SUMMARY</h3>
      <div id="summary" class="mono">Waitingâ¦</div>
    </div>

    <div class="section">
      <h3>MALE MODEL</h3>
      <div id="maleInfo" class="mono">Waitingâ¦</div>
    </div>

    <div class="section">
      <h3>FEMALE MODEL</h3>
      <div id="femaleInfo" class="mono">Waitingâ¦</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const loading = document.getElementById("loading");
    const fatal = document.getElementById("fatal");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");

    const summaryEl = document.getElementById("summary");
    const maleInfoEl = document.getElementById("maleInfo");
    const femaleInfoEl = document.getElementById("femaleInfo");

    function fail(error) {
      console.error(error);
      loading.style.display = "none";
      fatal.style.display = "block";
      fatal.textContent =
        "V14 ERROR\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nSend me a screenshot of this red box.";
    }

    window.addEventListener("error", e => {
      if (e.error) fail(e.error);
    });

    window.addEventListener("unhandledrejection", e => {
      fail(e.reason);
    });

    // =========================================================
    // SCENE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94d7f2);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.015,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById("game").appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x65727b, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(4, 8, 5);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xdceaff, 1.0);
    fill.position.set(-4, 4, 2);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xa2a5a8,
        roughness: 0.95
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function roomBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({ color, roughness: 0.88 })
      );

      mesh.position.set(x,y,z);
      mesh.scale.set(sx,sy,sz);
      scene.add(mesh);
    }

    roomBox(0, 1.5, -6, 10, 3, 0.2, 0xd8dde1);
    roomBox(-5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);
    roomBox(5, 1.5, -1, 0.2, 3, 10, 0xd8dde1);

    // =========================================================
    // LOADERS + HELPERS
    // =========================================================

    const loader = new GLTFLoader();

    function loadGLB(url) {
      return new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    }

    function getBounds(root) {
      root.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      return { box, size, center };
    }

    function normalizeModel(root, targetHeight) {
      let b = getBounds(root);

      if (!isFinite(b.size.y) || b.size.y <= 0.001) {
        throw new Error("Invalid model bounds.");
      }

      const scale = targetHeight / b.size.y;
      root.scale.multiplyScalar(scale);
      root.updateMatrixWorld(true);

      b = getBounds(root);

      root.position.x -= b.center.x;
      root.position.z -= b.center.z;
      root.position.y -= b.box.min.y;

      root.updateMatrixWorld(true);

      return getBounds(root);
    }

    function unique(arr) {
      return [...new Set(arr)];
    }

    function inspectModel(root) {
      const meshes = [];
      const bones = [];
      const skins = [];
      const morphNames = [];
      const nodeNames = [];

      root.traverse(obj => {
        if (obj.name) nodeNames.push(obj.name);

        if (obj.isBone) {
          bones.push(obj.name || "(unnamed bone)");
        }

        if (obj.isMesh || obj.isSkinnedMesh) {
          const g = obj.geometry;
          const pos = g?.attributes?.position;
          const normal = g?.attributes?.normal;
          const uv = g?.attributes?.uv;
          const indexCount = g?.index?.count || 0;

          const dict = obj.morphTargetDictionary || {};

          meshes.push({
            name: obj.name || "(unnamed mesh)",
            skinned: !!obj.isSkinnedMesh,
            vertices: pos?.count || 0,
            indices: indexCount,
            normals: normal?.count || 0,
            uvs: uv?.count || 0,
            morphCount: Object.keys(dict).length,
            morphNames: Object.keys(dict)
          });

          morphNames.push(...Object.keys(dict));

          if (obj.isSkinnedMesh && obj.skeleton) {
            skins.push({
              mesh: obj.name || "(unnamed mesh)",
              boneCount: obj.skeleton.bones.length,
              boneNames: obj.skeleton.bones.map(b => b.name || "(unnamed)")
            });
          }
        }
      });

      const b = getBounds(root);

      return {
        bounds: {
          width: b.size.x,
          height: b.size.y,
          depth: b.size.z
        },
        meshes,
        meshCount: meshes.length,
        totalVertices: meshes.reduce((n,m) => n + m.vertices, 0),
        totalIndices: meshes.reduce((n,m) => n + m.indices, 0),
        boneNames: unique(bones),
        boneCount: unique(bones).length,
        skins,
        morphNames: unique(morphNames),
        morphCount: unique(morphNames).length,
        nodeNames: unique(nodeNames)
      };
    }

    function summarizeModel(label, info) {
      const lines = [];

      lines.push(`${label} dimensions`);
      lines.push(
        `W ${info.bounds.width.toFixed(3)} â¢ H ${info.bounds.height.toFixed(3)} â¢ D ${info.bounds.depth.toFixed(3)}`
      );

      lines.push(
        `meshes ${info.meshCount} â¢ vertices ${info.totalVertices} â¢ indices ${info.totalIndices}`
      );

      lines.push(
        `unique bones ${info.boneCount} â¢ unique morph names ${info.morphCount}`
      );

      lines.push("");
      lines.push("meshes:");

      for (const mesh of info.meshes) {
        lines.push(
          `- ${mesh.name} | verts ${mesh.vertices} | idx ${mesh.indices} | skinned ${mesh.skinned ? "yes" : "no"} | morphs ${mesh.morphCount}`
        );

        if (mesh.morphNames.length) {
          lines.push(`  morphs: ${mesh.morphNames.join(", ")}`);
        }
      }

      lines.push("");
      lines.push("bones:");
      lines.push(info.boneNames.join(", ") || "(none)");

      return lines.join("\n");
    }

    function arrayIntersection(a, b) {
      const bSet = new Set(b);
      return a.filter(x => bSet.has(x));
    }

    function sortedCopy(arr) {
      return [...arr].sort();
    }

    function sameArray(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    function meshSignature(mesh) {
      return [
        mesh.vertices,
        mesh.indices,
        mesh.normals,
        mesh.uvs
      ].join(":");
    }

    function compareModels(male, female) {
      const maleBoneNames = sortedCopy(male.boneNames);
      const femaleBoneNames = sortedCopy(female.boneNames);

      const commonBones = arrayIntersection(
        maleBoneNames,
        femaleBoneNames
      );

      const exactBoneNameMatch =
        sameArray(maleBoneNames, femaleBoneNames);

      const maleMeshSigs = male.meshes.map(meshSignature).sort();
      const femaleMeshSigs = female.meshes.map(meshSignature).sort();

      const exactMeshStructureMatch =
        sameArray(maleMeshSigs, femaleMeshSigs);

      const paired = [];
      const count = Math.max(male.meshes.length, female.meshes.length);

      for (let i = 0; i < count; i++) {
        const m = male.meshes[i];
        const f = female.meshes[i];

        paired.push({
          index: i,
          male: m || null,
          female: f || null,
          sameVertices: !!m && !!f && m.vertices === f.vertices,
          sameIndices: !!m && !!f && m.indices === f.indices
        });
      }

      const allPairedTopologyMatch =
        male.meshes.length === female.meshes.length &&
        paired.every(x => x.sameVertices && x.sameIndices);

      const commonMorphNames = arrayIntersection(
        male.morphNames,
        female.morphNames
      );

      const likelySameRig =
        exactBoneNameMatch &&
        male.boneCount > 0 &&
        female.boneCount > 0;

      let route;

      if (allPairedTopologyMatch) {
        route =
          "ROUTE A: direct vertex interpolation is plausible. We can build a true male-to-female morph from the real endpoint meshes.";
      } else if (likelySameRig) {
        route =
          "ROUTE B: meshes differ, but the skeleton appears shared. Best path is a rig-driven intermediate body plus retargeted surface deformation.";
      } else {
        route =
          "ROUTE C: both topology and rig differ. We need a shared-topology bridge model for a seamless physical morph.";
      }

      return {
        exactBoneNameMatch,
        commonBones,
        likelySameRig,
        exactMeshStructureMatch,
        allPairedTopologyMatch,
        paired,
        commonMorphNames,
        route
      };
    }

    // =========================================================
    // MODELS
    // =========================================================

    let maleRoot;
    let femaleRoot;
    let maleInfo;
    let femaleInfo;
    let comparison;

    let activeRoot;
    let current = "male";

    function showMale() {
      current = "male";
      maleRoot.visible = true;
      femaleRoot.visible = false;
      activeRoot = maleRoot;

      statusEl.textContent = "Showing real male endpoint model.";
      if (bodyView) setBodyView();
      else setFirstPerson();
    }

    function showFemale() {
      current = "female";
      maleRoot.visible = false;
      femaleRoot.visible = true;
      activeRoot = femaleRoot;

      statusEl.textContent = "Showing real female endpoint model.";
      if (bodyView) setBodyView();
      else setFirstPerson();
    }

    document.getElementById("maleBtn")
      .addEventListener("click", showMale);

    document.getElementById("femaleBtn")
      .addEventListener("click", showFemale);

    // =========================================================
    // CAMERA
    // =========================================================

    let bodyView = true;
    let yaw = 0;
    let pitch = THREE.MathUtils.degToRad(-7);

    function setBodyView() {
      bodyView = true;
      if (!activeRoot) return;

      const b = getBounds(activeRoot);

      camera.position.set(
        b.center.x + 1.5,
        b.box.min.y + b.size.y * 0.62,
        b.center.z + 3.0
      );

      camera.lookAt(
        b.center.x,
        b.box.min.y + b.size.y * 0.49,
        b.center.z
      );

      statusEl.textContent =
        `BODY VIEW â ${current} endpoint model.`;
    }

    function setFirstPerson() {
      bodyView = false;
      if (!activeRoot) return;

      const b = getBounds(activeRoot);

      camera.position.set(
        b.center.x,
        b.box.min.y + b.size.y * 0.925,
        b.center.z - b.size.z * 0.16
      );

      pitch = THREE.MathUtils.degToRad(-10);

      statusEl.textContent =
        `FIRST PERSON â ${current} endpoint model.`;
    }

    function lookDown() {
      if (bodyView) setFirstPerson();
      pitch = THREE.MathUtils.degToRad(-66);

      statusEl.textContent =
        `LOOK DOWN â ${current} endpoint model.`;
    }

    document.getElementById("bodyViewBtn")
      .addEventListener("click", setBodyView);

    document.getElementById("lookBtn")
      .addEventListener("click", lookDown);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const sensitivity = 0.004;

    function startDrag(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function drag(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      pitch -= dy * sensitivity;

      pitch = THREE.MathUtils.clamp(
        pitch,
        THREE.MathUtils.degToRad(-88),
        THREE.MathUtils.degToRad(70)
      );
    }

    function endDrag() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      e => {
        if (e.touches.length === 1) {
          startDrag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      e => {
        if (e.touches.length === 1) {
          e.preventDefault();

          drag(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endDrag);
    renderer.domElement.addEventListener("touchcancel", endDrag);

    function setHeadVisibility(root, visible) {
      if (!root) return;

      root.traverse(obj => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;

        const n = (obj.name || "").toLowerCase();

        if (
          n.includes("head") ||
          n.includes("hair") ||
          n.includes("eye") ||
          n.includes("teeth")
        ) {
          obj.visible = visible;
        }
      });
    }

    const euler = new THREE.Euler(0,0,0,"YXZ");

    function animate() {
      requestAnimationFrame(animate);

      if (!bodyView && activeRoot) {
        setHeadVisibility(maleRoot, current !== "male");
        setHeadVisibility(femaleRoot, current !== "female");

        euler.set(pitch, yaw, 0);
        camera.quaternion.setFromEuler(euler);
      } else {
        if (maleRoot) setHeadVisibility(maleRoot, true);
        if (femaleRoot) setHeadVisibility(femaleRoot, true);
      }

      renderer.render(scene, camera);
    }

    animate();

    // =========================================================
    // SETUP + COMPARISON
    // =========================================================

    async function setup() {
      statusEl.textContent = "Loading real male modelâ¦";
      const maleGLTF = await loadGLB("./adult-male-lod.glb");

      statusEl.textContent = "Loading real female modelâ¦";
      const femaleGLTF = await loadGLB("./adult-female-lod.glb");

      maleRoot = maleGLTF.scene;
      femaleRoot = femaleGLTF.scene;

      scene.add(maleRoot);
      scene.add(femaleRoot);

      normalizeModel(maleRoot, 1.80);
      normalizeModel(femaleRoot, 1.65);

      maleInfo = inspectModel(maleRoot);
      femaleInfo = inspectModel(femaleRoot);
      comparison = compareModels(maleInfo, femaleInfo);

      maleInfoEl.textContent =
        summarizeModel("MALE", maleInfo);

      femaleInfoEl.textContent =
        summarizeModel("FEMALE", femaleInfo);

      const pairLines = comparison.paired.map(p => {
        const m = p.male;
        const f = p.female;

        return [
          `pair ${p.index + 1}:`,
          `${m ? `${m.name} (${m.vertices}v/${m.indices}i)` : "missing male"}`,
          " vs ",
          `${f ? `${f.name} (${f.vertices}v/${f.indices}i)` : "missing female"}`,
          ` -> verts ${p.sameVertices ? "MATCH" : "different"}, indices ${p.sameIndices ? "MATCH" : "different"}`
        ].join("");
      });

      summaryEl.textContent =
        `same number of meshes: ${maleInfo.meshCount === femaleInfo.meshCount ? "YES" : "NO"}\n` +
        `all paired vertex/index counts match: ${comparison.allPairedTopologyMatch ? "YES" : "NO"}\n` +
        `exact sorted mesh structure match: ${comparison.exactMeshStructureMatch ? "YES" : "NO"}\n` +
        `male unique bones: ${maleInfo.boneCount}\n` +
        `female unique bones: ${femaleInfo.boneCount}\n` +
        `exact bone-name set match: ${comparison.exactBoneNameMatch ? "YES" : "NO"}\n` +
        `common bones: ${comparison.commonBones.length}\n` +
        `male unique morph names: ${maleInfo.morphCount}\n` +
        `female unique morph names: ${femaleInfo.morphCount}\n` +
        `common morph names: ${comparison.commonMorphNames.length}\n\n` +
        `${comparison.route}\n\n` +
        pairLines.join("\n");

      debugEl.textContent =
        `Automatic route decision: ${comparison.route}`;

      femaleRoot.visible = false;
      maleRoot.visible = true;
      activeRoot = maleRoot;

      setBodyView();

      loading.style.display = "none";

      statusEl.textContent =
        "V14 ready. Scroll the compatibility report below.";

      console.log("MALE INSPECTION", maleInfo);
      console.log("FEMALE INSPECTION", femaleInfo);
      console.log("COMPARISON", comparison);
    }

    setup().catch(fail);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );
    });
  </script>
</body>
</html>
