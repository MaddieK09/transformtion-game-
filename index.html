<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game Prototype V5</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 10px);
      left: 10px;
      right: 10px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 490px;
      margin: 0 auto;
      padding: 11px 13px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.58);
      color: white;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .status {
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.92;
    }

    .bar {
      margin-top: 9px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
    }

    #barFill {
      width: 0%;
      height: 100%;
      background: white;
      border-radius: 999px;
    }

    #bottomUI {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 10px);
      z-index: 30;
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 800;
      color: #111;
      background: white;
      min-width: 112px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    button:active {
      transform: scale(0.97);
    }

    button.secondary {
      background: rgba(255,255,255,0.84);
      min-width: 95px;
    }

    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 75px);
      left: 8px;
      right: 8px;
      text-align: center;
      color: rgba(255,255,255,0.92);
      font-size: 12px;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 5px rgba(0,0,0,0.7);
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game - V5 Body Geometry Test</div>
      <div id="status" class="status">
        Starter form. Use LOOK DOWN to inspect your first-person body.
      </div>

      <div class="bar">
        <div id="barFill"></div>
      </div>
    </div>
  </div>

  <div id="hint">
    FIRST PERSON = eyes in head | BODY VIEW = temporary outside camera
  </div>

  <div id="bottomUI">
    <button id="lookBtn" class="secondary">LOOK DOWN</button>
    <button id="viewBtn" class="secondary">BODY VIEW</button>
    <button id="transformBtn">TRANSFORM</button>
    <button id="resetBtn" class="secondary">RESET</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    // =========================================================
    // ENGINE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x91d5f4);

    const camera = new THREE.PerspectiveCamera(
      76,
      window.innerWidth / window.innerHeight,
      0.025,
      150
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.getElementById("game").appendChild(renderer.domElement);

    // =========================================================
    // WORLD
    // =========================================================

    scene.add(new THREE.HemisphereLight(0xffffff, 0x53616e, 2.1));

    const sun = new THREE.DirectionalLight(0xffffff, 2.4);
    sun.position.set(4, 9, 4);
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({
        color: 0x92979c,
        roughness: 0.95
      })
    );

    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function worldBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.84
        })
      );

      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      scene.add(mesh);
      return mesh;
    }

    worldBox(0, 1.5, -6.3, 10, 3, 0.22, 0xdce0e3);
    worldBox(-5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);
    worldBox(5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);

    worldBox(-2.6, 0.45, -3.5, 1.45, 0.9, 0.75, 0x9b7755);
    worldBox(2.6, 0.88, -3.9, 0.72, 1.76, 0.72, 0x6d7c8f);

    // =========================================================
    // PLAYER + RIG
    // =========================================================

    const player = new THREE.Group();
    player.position.set(0, 0, 2.6);
    scene.add(player);

    const yawBone = new THREE.Group();
    player.add(yawBone);

    const skeletonRoot = new THREE.Group();
    yawBone.add(skeletonRoot);

    const pelvisBone = new THREE.Group();
    pelvisBone.position.set(0, 0.93, 0);
    skeletonRoot.add(pelvisBone);

    const abdomenBone = new THREE.Group();
    abdomenBone.position.set(0, 0.20, -0.005);
    pelvisBone.add(abdomenBone);

    const chestBone = new THREE.Group();
    chestBone.position.set(0, 0.22, -0.010);
    abdomenBone.add(chestBone);

    const neckBone = new THREE.Group();
    neckBone.position.set(0, 0.24, -0.005);
    chestBone.add(neckBone);

    const headBone = new THREE.Group();
    headBone.position.set(0, 0.115, 0);
    neckBone.add(headBone);

    const cameraPitch = new THREE.Group();

    // IMPORTANT:
    // Forward in this scene is -Z.
    // Eyes are pushed forward from the center of the head,
    // so the chest is behind/below the camera instead of under the lens.
    cameraPitch.position.set(0, 0.025, -0.115);

    headBone.add(cameraPitch);
    cameraPitch.add(camera);

    // External debug camera anchor.
    const bodyViewAnchor = new THREE.Group();
    player.add(bodyViewAnchor);
    bodyViewAnchor.position.set(0, 1.20, 3.1);

    // =========================================================
    // MATERIALS
    // =========================================================

    const skinMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8a37c,
      roughness: 0.72
    });

    const shirtMaterial = new THREE.MeshStandardMaterial({
      color: 0x3f608f,
      roughness: 0.86
    });

    const pantsMaterial = new THREE.MeshStandardMaterial({
      color: 0x222b37,
      roughness: 0.91
    });

    const shoeMaterial = new THREE.MeshStandardMaterial({
      color: 0x171717,
      roughness: 0.96
    });

    // =========================================================
    // BODY MESH HELPERS
    // =========================================================

    function ellipsoid(material, segments = 22) {
      return new THREE.Mesh(
        new THREE.SphereGeometry(0.5, segments, 16),
        material
      );
    }

    function capsule(material) {
      return new THREE.Mesh(
        new THREE.CapsuleGeometry(0.10, 0.80, 7, 12),
        material
      );
    }

    function setCapsuleDimensions(mesh, radius, length) {
      mesh.scale.set(
        radius / 0.10,
        length,
        radius / 0.10
      );
    }

    // =========================================================
    // TORSO
    // =========================================================

    const pelvisMesh = ellipsoid(pantsMaterial);
    pelvisBone.add(pelvisMesh);

    const lowerAbdomenMesh = ellipsoid(shirtMaterial);
    abdomenBone.add(lowerAbdomenMesh);

    const upperAbdomenMesh = ellipsoid(shirtMaterial);
    abdomenBone.add(upperAbdomenMesh);

    const chestMesh = ellipsoid(shirtMaterial);
    chestBone.add(chestMesh);

    // Small clothed front contours.
    const leftChestContour = ellipsoid(shirtMaterial, 18);
    const rightChestContour = ellipsoid(shirtMaterial, 18);
    chestBone.add(leftChestContour, rightChestContour);

    // Neck gives the camera a better anatomical relationship to torso.
    const neckMesh = capsule(skinMaterial);
    neckBone.add(neckMesh);

    // =========================================================
    // LEGS
    // =========================================================

    function createLeg(side) {
      const sign = side === "left" ? -1 : 1;

      const hip = new THREE.Group();
      pelvisBone.add(hip);

      const thigh = capsule(pantsMaterial);
      hip.add(thigh);

      const knee = new THREE.Group();
      hip.add(knee);

      const shin = capsule(pantsMaterial);
      knee.add(shin);

      const ankle = new THREE.Group();
      knee.add(ankle);

      const foot = ellipsoid(shoeMaterial);
      ankle.add(foot);

      return {
        sign,
        hip,
        thigh,
        knee,
        shin,
        ankle,
        foot
      };
    }

    const leftLeg = createLeg("left");
    const rightLeg = createLeg("right");

    // =========================================================
    // ARMS
    // =========================================================

    function createArm(side) {
      const sign = side === "left" ? -1 : 1;

      const shoulder = new THREE.Group();
      chestBone.add(shoulder);

      const upperArm = capsule(skinMaterial);
      shoulder.add(upperArm);

      const elbow = new THREE.Group();
      shoulder.add(elbow);

      const forearm = capsule(skinMaterial);
      elbow.add(forearm);

      const wrist = new THREE.Group();
      elbow.add(wrist);

      const hand = ellipsoid(skinMaterial);
      wrist.add(hand);

      return {
        sign,
        shoulder,
        upperArm,
        elbow,
        forearm,
        wrist,
        hand
      };
    }

    const leftArm = createArm("left");
    const rightArm = createArm("right");

    // =========================================================
    // STARTER + TARGET
    // =========================================================

    const BASE_HEIGHT = 1.80;

    const starter = {
      height: 1.80,

      shoulderWidth: 0.46,

      chestWidth: 0.40,
      chestHeight: 0.30,
      chestDepth: 0.22,
      chestProjection: 0.015,

      upperWaistWidth: 0.32,
      lowerWaistWidth: 0.30,
      waistDepth: 0.19,

      hipWidth: 0.35,
      hipDepth: 0.24,
      pelvisHeight: 0.18,

      upperArmRadius: 0.058,
      forearmRadius: 0.050,
      handWidth: 0.10,
      handLength: 0.145,

      thighRadius: 0.084,
      shinRadius: 0.068,
      footWidth: 0.14,
      footLength: 0.275,

      skin: new THREE.Color(0xd8a37c),
      shirt: new THREE.Color(0x3f608f),
      pants: new THREE.Color(0x222b37)
    };

    const target = {
      height: 1.55,

      shoulderWidth: 0.375,

      chestWidth: 0.37,
      chestHeight: 0.295,
      chestDepth: 0.245,
      chestProjection: 0.070,

      upperWaistWidth: 0.275,
      lowerWaistWidth: 0.255,
      waistDepth: 0.18,

      hipWidth: 0.46,
      hipDepth: 0.31,
      pelvisHeight: 0.195,

      upperArmRadius: 0.049,
      forearmRadius: 0.044,
      handWidth: 0.089,
      handLength: 0.128,

      thighRadius: 0.108,
      shinRadius: 0.075,
      footWidth: 0.132,
      footLength: 0.252,

      skin: new THREE.Color(0xb97554),
      shirt: new THREE.Color(0x923e88),
      pants: new THREE.Color(0x2a2230)
    };

    function mix(a, b, t) {
      return a + (b - a) * t;
    }

    // =========================================================
    // BODY UPDATE
    // =========================================================

    function applyBody(progress) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);

      const height = mix(starter.height, target.height, p);
      const heightScale = height / BASE_HEIGHT;

      skeletonRoot.scale.set(1, heightScale, 1);

      const shoulderWidth = mix(starter.shoulderWidth, target.shoulderWidth, p);

      const chestWidth = mix(starter.chestWidth, target.chestWidth, p);
      const chestHeight = mix(starter.chestHeight, target.chestHeight, p);
      const chestDepth = mix(starter.chestDepth, target.chestDepth, p);
      const chestProjection = mix(starter.chestProjection, target.chestProjection, p);

      const upperWaistWidth = mix(starter.upperWaistWidth, target.upperWaistWidth, p);
      const lowerWaistWidth = mix(starter.lowerWaistWidth, target.lowerWaistWidth, p);
      const waistDepth = mix(starter.waistDepth, target.waistDepth, p);

      const hipWidth = mix(starter.hipWidth, target.hipWidth, p);
      const hipDepth = mix(starter.hipDepth, target.hipDepth, p);
      const pelvisHeight = mix(starter.pelvisHeight, target.pelvisHeight, p);

      // ----- Anatomical torso shape -----

      chestMesh.scale.set(
        chestWidth,
        chestHeight,
        chestDepth
      );

      chestMesh.position.set(
        0,
        -0.035,
        0.025
      );

      // Upper abdomen is narrower and higher.
      upperAbdomenMesh.scale.set(
        upperWaistWidth,
        0.22,
        waistDepth
      );

      upperAbdomenMesh.position.set(
        0,
        0.035,
        0.025
      );

      // Lower abdomen sits toward pelvis and tapers.
      lowerAbdomenMesh.scale.set(
        lowerWaistWidth,
        0.205,
        waistDepth * 0.98
      );

      lowerAbdomenMesh.position.set(
        0,
        -0.095,
        0.02
      );

      pelvisMesh.scale.set(
        hipWidth,
        pelvisHeight,
        hipDepth
      );

      pelvisMesh.position.set(
        0,
        -0.025,
        0.025
      );

      // Keep front contours subtle.
      const contourWidth = 0.095;
      const contourHeight = 0.085;
      const contourDepth = 0.025 + chestProjection * 0.45;

      leftChestContour.scale.set(
        contourWidth,
        contourHeight,
        contourDepth
      );

      rightChestContour.scale.copy(leftChestContour.scale);

      leftChestContour.position.set(
        -chestWidth * 0.19,
        -0.03,
        -(chestDepth * 0.39 + chestProjection * 0.32)
      );

      rightChestContour.position.set(
        chestWidth * 0.19,
        -0.03,
        -(chestDepth * 0.39 + chestProjection * 0.32)
      );

      // Neck
      setCapsuleDimensions(
        neckMesh,
        0.055,
        0.12
      );

      neckMesh.position.set(
        0,
        -0.055,
        0
      );

      // ----- Arms -----

      const upperArmRadius = mix(starter.upperArmRadius, target.upperArmRadius, p);
      const forearmRadius = mix(starter.forearmRadius, target.forearmRadius, p);
      const handWidth = mix(starter.handWidth, target.handWidth, p);
      const handLength = mix(starter.handLength, target.handLength, p);

      const upperArmLength = 0.33;
      const forearmLength = 0.30;

      function updateArm(arm) {
        arm.shoulder.position.set(
          arm.sign * shoulderWidth * 0.54,
          0.025,
          0.035
        );

        setCapsuleDimensions(
          arm.upperArm,
          upperArmRadius,
          upperArmLength
        );

        arm.upperArm.position.set(
          0,
          -upperArmLength * 0.50,
          0.02
        );

        arm.elbow.position.set(
          0,
          -upperArmLength,
          0.02
        );

        setCapsuleDimensions(
          arm.forearm,
          forearmRadius,
          forearmLength
        );

        arm.forearm.position.set(
          0,
          -forearmLength * 0.50,
          -0.01
        );

        arm.wrist.position.set(
          0,
          -forearmLength,
          -0.02
        );

        arm.hand.scale.set(
          handWidth,
          handLength,
          handWidth * 0.55
        );

        arm.hand.position.set(
          0,
          -handLength * 0.48,
          -0.03
        );
      }

      updateArm(leftArm);
      updateArm(rightArm);

      // ----- Legs -----

      const thighRadius = mix(starter.thighRadius, target.thighRadius, p);
      const shinRadius = mix(starter.shinRadius, target.shinRadius, p);
      const footWidth = mix(starter.footWidth, target.footWidth, p);
      const footLength = mix(starter.footLength, target.footLength, p);

      const thighLength = 0.43;
      const shinLength = 0.41;

      function updateLeg(leg) {
        leg.hip.position.set(
          leg.sign * hipWidth * 0.22,
          -0.09,
          0.02
        );

        setCapsuleDimensions(
          leg.thigh,
          thighRadius,
          thighLength
        );

        leg.thigh.position.set(
          0,
          -thighLength * 0.50,
          0.025
        );

        leg.knee.position.set(
          0,
          -thighLength,
          0.02
        );

        setCapsuleDimensions(
          leg.shin,
          shinRadius,
          shinLength
        );

        leg.shin.position.set(
          0,
          -shinLength * 0.50,
          0.02
        );

        leg.ankle.position.set(
          0,
          -shinLength,
          0.02
        );

        leg.foot.scale.set(
          footWidth,
          0.09,
          footLength
        );

        leg.foot.position.set(
          0,
          -0.045,
          -footLength * 0.36
        );
      }

      updateLeg(leftLeg);
      updateLeg(rightLeg);

      // ----- Colors -----

      skinMaterial.color.copy(starter.skin).lerp(target.skin, p);
      shirtMaterial.color.copy(starter.shirt).lerp(target.shirt, p);
      pantsMaterial.color.copy(starter.pants).lerp(target.pants, p);
    }

    // =========================================================
    // TRANSFORMATION
    // =========================================================

    let progress = 0;
    let transforming = false;
    let transformStart = 0;

    const TRANSFORM_MS = 26000;

    const status = document.getElementById("status");
    const barFill = document.getElementById("barFill");
    const transformBtn = document.getElementById("transformBtn");

    function startTransformation() {
      if (transforming || progress >= 1) return;

      transforming = true;

      transformStart =
        performance.now() - progress * TRANSFORM_MS;

      transformBtn.textContent = "TRANSFORMING";

      status.textContent =
        "Transformation started. Keep looking down while the body changes.";
    }

    function resetTransformation() {
      transforming = false;
      progress = 0;

      applyBody(0);

      transformBtn.textContent = "TRANSFORM";
      barFill.style.width = "0%";

      status.textContent =
        "Starter form restored. Use LOOK DOWN to inspect your body.";
    }

    transformBtn.addEventListener("click", startTransformation);
    document.getElementById("resetBtn").addEventListener("click", resetTransformation);

    // =========================================================
    // CAMERA / LOOK
    // =========================================================

    let yaw = 0;
    let pitch = -0.18;

    const sensitivity = 0.0042;

    // In Three.js, negative X rotation looks downward in this setup.
    const minPitch = THREE.MathUtils.degToRad(-86);
    const maxPitch = THREE.MathUtils.degToRad(74);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    let bodyView = false;

    function setPitch(value) {
      pitch = THREE.MathUtils.clamp(
        value,
        minPitch,
        maxPitch
      );
    }

    function beginLook(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function moveLook(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      setPitch(pitch - dy * sensitivity);
    }

    function endLook() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      (e) => {
        if (e.touches.length === 1) {
          beginLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      (e) => {
        if (e.touches.length === 1) {
          e.preventDefault();

          moveLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endLook);
    renderer.domElement.addEventListener("touchcancel", endLook);

    renderer.domElement.addEventListener(
      "mousedown",
      (e) => {
        beginLook(e.clientX, e.clientY);
      }
    );

    window.addEventListener(
      "mousemove",
      (e) => {
        moveLook(e.clientX, e.clientY);
      }
    );

    window.addEventListener("mouseup", endLook);

    document.getElementById("lookBtn").addEventListener(
      "click",
      () => {
        bodyView = false;
        document.getElementById("viewBtn").textContent = "BODY VIEW";
        setPitch(THREE.MathUtils.degToRad(-72));
      }
    );

    document.getElementById("viewBtn").addEventListener(
      "click",
      () => {
        bodyView = !bodyView;

        document.getElementById("viewBtn").textContent =
          bodyView ? "FIRST PERSON" : "BODY VIEW";

        status.textContent =
          bodyView
            ? "Body view active. This is only for checking the full character shape."
            : "First person restored. Look down to inspect your body.";
      }
    );

    // =========================================================
    // ANIMATION LOOP
    // =========================================================

    applyBody(0);

    function animate(now) {
      requestAnimationFrame(animate);

      yawBone.rotation.y = yaw;

      if (!bodyView) {
        cameraPitch.rotation.x = pitch;

        // Camera remains parented to head.
        if (camera.parent !== cameraPitch) {
          cameraPitch.add(camera);
          camera.position.set(0, 0, 0);
          camera.rotation.set(0, 0, 0);
        }
      } else {
        // Temporary external camera.
        if (camera.parent !== scene) {
          scene.attach(camera);
        }

        // Stand behind and above the player, looking toward the full body.
        camera.position.set(
          player.position.x,
          1.45,
          player.position.z + 3.0
        );

        const lookTarget = new THREE.Vector3(
          player.position.x,
          0.92,
          player.position.z
        );

        camera.lookAt(lookTarget);
      }

      if (transforming) {
        progress =
          (now - transformStart) / TRANSFORM_MS;

        progress = THREE.MathUtils.clamp(
          progress,
          0,
          1
        );

        const smooth =
          progress * progress * (3 - 2 * progress);

        applyBody(smooth);

        const percent = Math.round(progress * 100);

        barFill.style.width = percent + "%";

        status.textContent =
          "Transforming... " + percent +
          "% - height, torso, hips, limbs, skin and clothing are changing.";

        if (progress >= 1) {
          transforming = false;
          transformBtn.textContent = "COMPLETE";

          status.textContent =
            "Transformation complete. The target body is fully applied.";
        }
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener(
      "resize",
      () => {
        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio, 2)
        );
      }
    );
  </script>
</body>
</html>
