<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game Prototype V7</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 9px);
      left: 9px;
      right: 9px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 500px;
      margin: 0 auto;
      padding: 10px 13px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.57);
      color: white;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .status {
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .bar {
      margin-top: 8px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
    }

    #barFill {
      width: 0%;
      height: 100%;
      background: white;
      border-radius: 999px;
    }

    #bottomUI {
      position: fixed;
      left: 7px;
      right: 7px;
      bottom: calc(env(safe-area-inset-bottom) + 9px);
      z-index: 30;
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 12px 13px;
      font-size: 14px;
      font-weight: 800;
      color: #111;
      background: white;
      min-width: 108px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    button:active {
      transform: scale(0.97);
    }

    button.secondary {
      background: rgba(255,255,255,0.85);
      min-width: 94px;
    }

    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 76px);
      left: 8px;
      right: 8px;
      text-align: center;
      color: rgba(255,255,255,0.92);
      font-size: 12px;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 5px rgba(0,0,0,0.7);
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game - V7 First Person Anatomy</div>
      <div id="status" class="status">
        Starter form. Use LOOK DOWN and inspect the full body path from torso to feet.
      </div>
      <div class="bar">
        <div id="barFill"></div>
      </div>
    </div>
  </div>

  <div id="hint">
    First-person anatomy pass: smaller torso, lower body, better eye position
  </div>

  <div id="bottomUI">
    <button id="lookBtn" class="secondary">LOOK DOWN</button>
    <button id="viewBtn" class="secondary">BODY VIEW</button>
    <button id="transformBtn">TRANSFORM</button>
    <button id="resetBtn" class="secondary">RESET</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    // =========================================================
    // ENGINE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x91d5f4);

    const camera = new THREE.PerspectiveCamera(
      66,
      window.innerWidth / window.innerHeight,
      0.025,
      150
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.getElementById("game").appendChild(renderer.domElement);

    // =========================================================
    // WORLD
    // =========================================================

    scene.add(new THREE.HemisphereLight(0xffffff, 0x53616e, 2.15));

    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(4, 9, 4);
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({
        color: 0x92979c,
        roughness: 0.95
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function worldBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.84
        })
      );
      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      scene.add(mesh);
      return mesh;
    }

    worldBox(0, 1.5, -6.3, 10, 3, 0.22, 0xdce0e3);
    worldBox(-5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);
    worldBox(5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);

    worldBox(-2.6, 0.45, -3.5, 1.45, 0.9, 0.75, 0x9b7755);
    worldBox(2.6, 0.88, -3.9, 0.72, 1.76, 0.72, 0x6d7c8f);

    // =========================================================
    // PLAYER / RIG
    // =========================================================

    const player = new THREE.Group();
    player.position.set(0, 0, 2.6);
    scene.add(player);

    const yawBone = new THREE.Group();
    player.add(yawBone);

    const skeleton = new THREE.Group();
    yawBone.add(skeleton);

    const pelvisBone = new THREE.Group();
    pelvisBone.position.set(0, 0.93, 0.03);
    skeleton.add(pelvisBone);

    const lowerSpine = new THREE.Group();
    lowerSpine.position.set(0, 0.19, 0.01);
    pelvisBone.add(lowerSpine);

    const upperSpine = new THREE.Group();
    upperSpine.position.set(0, 0.21, -0.005);
    lowerSpine.add(upperSpine);

    const chestBone = new THREE.Group();
    chestBone.position.set(0, 0.21, -0.010);
    upperSpine.add(chestBone);

    const neckBone = new THREE.Group();
    neckBone.position.set(0, 0.23, -0.015);
    chestBone.add(neckBone);

    const headBone = new THREE.Group();
    headBone.position.set(0, 0.115, -0.005);
    neckBone.add(headBone);

    const cameraPitch = new THREE.Group();

    // Eyes are forward from skull center and slightly higher.
    // This is intentionally farther forward than V6.
    cameraPitch.position.set(0, 0.055, -0.19);

    headBone.add(cameraPitch);
    cameraPitch.add(camera);

    // =========================================================
    // MATERIALS
    // =========================================================

    const skinMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8a37c,
      roughness: 0.70
    });

    const shirtMaterial = new THREE.MeshStandardMaterial({
      color: 0x3f608f,
      roughness: 0.84
    });

    const pantsMaterial = new THREE.MeshStandardMaterial({
      color: 0x222b37,
      roughness: 0.90
    });

    const shoeMaterial = new THREE.MeshStandardMaterial({
      color: 0x171717,
      roughness: 0.96
    });

    // =========================================================
    // GEOMETRY HELPERS
    // =========================================================

    function ellipsoid(material, segments = 24) {
      return new THREE.Mesh(
        new THREE.SphereGeometry(0.5, segments, 18),
        material
      );
    }

    function taperedLimb(material, topRadius, bottomRadius, length, radial = 18) {
      return new THREE.Mesh(
        new THREE.CylinderGeometry(
          bottomRadius,
          topRadius,
          length,
          radial,
          5,
          false
        ),
        material
      );
    }

    function buildBodyShell(profile) {
      // One continuous torso shell.
      // More rings than V6 for better anatomical taper.
      const rings = [
        { y: 0.00, w: profile.lowPelvisW, d: profile.lowPelvisD },
        { y: 0.08, w: profile.midPelvisW, d: profile.midPelvisD },
        { y: 0.17, w: profile.hipW, d: profile.hipD },
        { y: 0.28, w: profile.highHipW, d: profile.highHipD },
        { y: 0.40, w: profile.lowWaistW, d: profile.lowWaistD },
        { y: 0.52, w: profile.waistW, d: profile.waistD },
        { y: 0.63, w: profile.lowRibW, d: profile.lowRibD },
        { y: 0.73, w: profile.midRibW, d: profile.midRibD },
        { y: 0.82, w: profile.chestW, d: profile.chestD },
        { y: 0.90, w: profile.upperChestW, d: profile.upperChestD },
        { y: 0.96, w: profile.shoulderBaseW, d: profile.shoulderBaseD },
        { y: 1.00, w: profile.neckBaseW, d: profile.neckBaseD }
      ];

      const radialSegments = 32;
      const vertices = [];
      const indices = [];
      const uvs = [];

      for (let r = 0; r < rings.length; r++) {
        const ring = rings[r];

        for (let i = 0; i < radialSegments; i++) {
          const a = (i / radialSegments) * Math.PI * 2;

          const cos = Math.cos(a);
          const sin = Math.sin(a);

          let x = cos * ring.w * 0.5;
          let z = sin * ring.d * 0.5;

          // Front of body is -Z.
          const front = Math.max(0, -sin);
          const back = Math.max(0, sin);

          // Natural chest front projection.
          if (ring.y >= 0.73 && ring.y <= 0.92) {
            z -= profile.chestProjection * front;
          }

          // Mild abdomen curve.
          if (ring.y >= 0.40 && ring.y <= 0.66) {
            z -= profile.abdomenProjection * front;
          }

          // Pelvic/glute depth mostly to back, tiny forward curve.
          if (ring.y <= 0.30) {
            z += profile.gluteProjection * back;
            z -= profile.pelvisFrontProjection * front;
          }

          // Very slight clavicle/upper chest flattening.
          if (ring.y >= 0.90) {
            z *= 0.94;
          }

          vertices.push(
            x,
            ring.y * profile.torsoHeight,
            z
          );

          uvs.push(
            i / radialSegments,
            ring.y
          );
        }
      }

      for (let r = 0; r < rings.length - 1; r++) {
        for (let i = 0; i < radialSegments; i++) {
          const next = (i + 1) % radialSegments;

          const a = r * radialSegments + i;
          const b = r * radialSegments + next;
          const c = (r + 1) * radialSegments + i;
          const d = (r + 1) * radialSegments + next;

          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(vertices, 3)
      );

      geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(uvs, 2)
      );

      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return geometry;
    }

    // =========================================================
    // PROFILES
    // =========================================================

    const BASE_HEIGHT = 1.80;

    const starter = {
      height: 1.80,

      torsoHeight: 0.64,

      lowPelvisW: 0.28,
      lowPelvisD: 0.20,

      midPelvisW: 0.32,
      midPelvisD: 0.22,

      hipW: 0.36,
      hipD: 0.24,

      highHipW: 0.34,
      highHipD: 0.22,

      lowWaistW: 0.31,
      lowWaistD: 0.19,

      waistW: 0.30,
      waistD: 0.18,

      lowRibW: 0.33,
      lowRibD: 0.19,

      midRibW: 0.36,
      midRibD: 0.20,

      chestW: 0.39,
      chestD: 0.21,

      upperChestW: 0.405,
      upperChestD: 0.20,

      shoulderBaseW: 0.44,
      shoulderBaseD: 0.19,

      neckBaseW: 0.145,
      neckBaseD: 0.13,

      chestProjection: 0.014,
      abdomenProjection: 0.018,
      pelvisFrontProjection: 0.010,
      gluteProjection: 0.035,

      shoulderWidth: 0.46,

      upperArmTop: 0.057,
      upperArmBottom: 0.049,
      forearmTop: 0.047,
      forearmBottom: 0.039,

      handW: 0.092,
      handH: 0.142,
      handD: 0.048,

      thighTop: 0.095,
      thighMid: 0.084,
      thighBottom: 0.073,

      calfTop: 0.072,
      calfMid: 0.065,
      calfBottom: 0.050,

      footW: 0.138,
      footH: 0.082,
      footL: 0.270,

      skin: new THREE.Color(0xd8a37c),
      shirt: new THREE.Color(0x3f608f),
      pants: new THREE.Color(0x222b37)
    };

    const target = {
      height: 1.55,

      torsoHeight: 0.61,

      lowPelvisW: 0.36,
      lowPelvisD: 0.27,

      midPelvisW: 0.41,
      midPelvisD: 0.30,

      hipW: 0.47,
      hipD: 0.32,

      highHipW: 0.43,
      highHipD: 0.29,

      lowWaistW: 0.275,
      lowWaistD: 0.18,

      waistW: 0.255,
      waistD: 0.17,

      lowRibW: 0.29,
      lowRibD: 0.18,

      midRibW: 0.33,
      midRibD: 0.19,

      chestW: 0.37,
      chestD: 0.225,

      upperChestW: 0.36,
      upperChestD: 0.205,

      shoulderBaseW: 0.375,
      shoulderBaseD: 0.18,

      neckBaseW: 0.132,
      neckBaseD: 0.118,

      chestProjection: 0.058,
      abdomenProjection: 0.026,
      pelvisFrontProjection: 0.018,
      gluteProjection: 0.085,

      shoulderWidth: 0.385,

      upperArmTop: 0.049,
      upperArmBottom: 0.043,
      forearmTop: 0.041,
      forearmBottom: 0.034,

      handW: 0.083,
      handH: 0.126,
      handD: 0.043,

      thighTop: 0.125,
      thighMid: 0.108,
      thighBottom: 0.086,

      calfTop: 0.080,
      calfMid: 0.068,
      calfBottom: 0.048,

      footW: 0.128,
      footH: 0.076,
      footL: 0.245,

      skin: new THREE.Color(0xb97554),
      shirt: new THREE.Color(0x923e88),
      pants: new THREE.Color(0x2a2230)
    };

    function mix(a, b, t) {
      return a + (b - a) * t;
    }

    function profileAt(t) {
      const out = {};

      for (const key of Object.keys(starter)) {
        if (
          typeof starter[key] === "number" &&
          typeof target[key] === "number"
        ) {
          out[key] = mix(starter[key], target[key], t);
        }
      }

      return out;
    }

    // =========================================================
    // BODY SHELL
    // =========================================================

    let torsoMesh = new THREE.Mesh(
      buildBodyShell(starter),
      shirtMaterial
    );

    pelvisBone.add(torsoMesh);

    // Slightly down and behind the eyes.
    torsoMesh.position.set(0, -0.07, 0.055);

    // =========================================================
    // HEAD / NECK
    // =========================================================

    const neckMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.052, 0.064, 0.115, 18),
      skinMaterial
    );

    neckBone.add(neckMesh);
    neckMesh.position.y = -0.052;

    const headMesh = ellipsoid(skinMaterial, 28);
    headBone.add(headMesh);

    headMesh.scale.set(0.150, 0.198, 0.158);
    headMesh.position.set(0, 0.045, 0.020);

    // =========================================================
    // ARMS
    // =========================================================

    function createArm(side) {
      const sign = side === "left" ? -1 : 1;

      const shoulder = new THREE.Group();
      chestBone.add(shoulder);

      const upperArm = taperedLimb(skinMaterial, 0.057, 0.049, 0.32);
      shoulder.add(upperArm);

      const elbow = new THREE.Group();
      shoulder.add(elbow);

      const forearm = taperedLimb(skinMaterial, 0.047, 0.039, 0.29);
      elbow.add(forearm);

      const wrist = new THREE.Group();
      elbow.add(wrist);

      const hand = ellipsoid(skinMaterial, 20);
      wrist.add(hand);

      return {
        sign,
        shoulder,
        upperArm,
        elbow,
        forearm,
        wrist,
        hand
      };
    }

    const leftArm = createArm("left");
    const rightArm = createArm("right");

    // =========================================================
    // LEGS
    // =========================================================

    function createLeg(side) {
      const sign = side === "left" ? -1 : 1;

      const hip = new THREE.Group();
      pelvisBone.add(hip);

      const upperThigh = taperedLimb(pantsMaterial, 0.095, 0.084, 0.22);
      hip.add(upperThigh);

      const midThigh = new THREE.Group();
      hip.add(midThigh);

      const lowerThigh = taperedLimb(pantsMaterial, 0.084, 0.073, 0.21);
      midThigh.add(lowerThigh);

      const knee = new THREE.Group();
      midThigh.add(knee);

      const upperCalf = taperedLimb(pantsMaterial, 0.072, 0.065, 0.20);
      knee.add(upperCalf);

      const midCalf = new THREE.Group();
      knee.add(midCalf);

      const lowerCalf = taperedLimb(pantsMaterial, 0.065, 0.050, 0.20);
      midCalf.add(lowerCalf);

      const ankle = new THREE.Group();
      midCalf.add(ankle);

      const foot = ellipsoid(shoeMaterial, 20);
      ankle.add(foot);

      return {
        sign,
        hip,
        upperThigh,
        midThigh,
        lowerThigh,
        knee,
        upperCalf,
        midCalf,
        lowerCalf,
        ankle,
        foot
      };
    }

    const leftLeg = createLeg("left");
    const rightLeg = createLeg("right");

    // =========================================================
    // UPDATE BODY
    // =========================================================

    function replaceCylinder(mesh, top, bottom, length, radial = 18) {
      mesh.geometry.dispose();
      mesh.geometry = new THREE.CylinderGeometry(
        bottom,
        top,
        length,
        radial,
        5,
        false
      );
    }

    function rebuildTorso(profile) {
      const old = torsoMesh.geometry;
      torsoMesh.geometry = buildBodyShell(profile);
      old.dispose();
    }

    function applyBody(progress) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);
      const profile = profileAt(p);

      const heightScale = profile.height / BASE_HEIGHT;

      // Scale whole skeleton in Y only for height.
      skeleton.scale.set(1, heightScale, 1);

      // Lower torso slightly as body gets shorter.
      pelvisBone.position.y = mix(0.93, 0.91, p);

      rebuildTorso(profile);

      // Head/neck subtle scale.
      neckMesh.scale.set(
        mix(1.0, 0.91, p),
        1.0,
        mix(1.0, 0.91, p)
      );

      headMesh.scale.set(
        mix(0.150, 0.143, p),
        mix(0.198, 0.190, p),
        mix(0.158, 0.151, p)
      );

      // ----- Arms -----
      const upperArmLength = 0.31;
      const forearmLength = 0.285;

      function updateArm(arm) {
        arm.shoulder.position.set(
          arm.sign * profile.shoulderWidth * 0.52,
          0.018,
          0.04
        );

        replaceCylinder(
          arm.upperArm,
          profile.upperArmTop,
          profile.upperArmBottom,
          upperArmLength
        );

        arm.upperArm.position.set(
          0,
          -upperArmLength * 0.50,
          0.015
        );

        arm.elbow.position.set(
          0,
          -upperArmLength,
          0.012
        );

        replaceCylinder(
          arm.forearm,
          profile.forearmTop,
          profile.forearmBottom,
          forearmLength
        );

        arm.forearm.position.set(
          0,
          -forearmLength * 0.50,
          -0.01
        );

        arm.wrist.position.set(
          0,
          -forearmLength,
          -0.018
        );

        arm.hand.scale.set(
          profile.handW,
          profile.handH,
          profile.handD
        );

        arm.hand.position.set(
          0,
          -profile.handH * 0.48,
          -0.026
        );
      }

      updateArm(leftArm);
      updateArm(rightArm);

      // ----- Legs -----
      const upperThighLen = 0.22;
      const lowerThighLen = 0.21;
      const upperCalfLen = 0.20;
      const lowerCalfLen = 0.20;

      function updateLeg(leg) {
        // Slightly more inward than V6, so feet line up beneath hips.
        leg.hip.position.set(
          leg.sign * profile.hipW * 0.18,
          -0.09,
          0.035
        );

        replaceCylinder(
          leg.upperThigh,
          profile.thighTop,
          profile.thighMid,
          upperThighLen
        );

        leg.upperThigh.position.set(
          0,
          -upperThighLen * 0.50,
          0.025
        );

        leg.midThigh.position.set(
          0,
          -upperThighLen,
          0.018
        );

        replaceCylinder(
          leg.lowerThigh,
          profile.thighMid,
          profile.thighBottom,
          lowerThighLen
        );

        leg.lowerThigh.position.set(
          0,
          -lowerThighLen * 0.50,
          0.012
        );

        leg.knee.position.set(
          0,
          -lowerThighLen,
          0.006
        );

        replaceCylinder(
          leg.upperCalf,
          profile.calfTop,
          profile.calfMid,
          upperCalfLen
        );

        leg.upperCalf.position.set(
          0,
          -upperCalfLen * 0.50,
          0.010
        );

        leg.midCalf.position.set(
          0,
          -upperCalfLen,
          0.005
        );

        replaceCylinder(
          leg.lowerCalf,
          profile.calfMid,
          profile.calfBottom,
          lowerCalfLen
        );

        leg.lowerCalf.position.set(
          0,
          -lowerCalfLen * 0.50,
          0.005
        );

        leg.ankle.position.set(
          0,
          -lowerCalfLen,
          0
        );

        leg.foot.scale.set(
          profile.footW,
          profile.footH,
          profile.footL
        );

        leg.foot.position.set(
          0,
          -profile.footH * 0.48,
          -profile.footL * 0.33
        );
      }

      updateLeg(leftLeg);
      updateLeg(rightLeg);

      // ----- Colors -----
      skinMaterial.color.copy(starter.skin).lerp(target.skin, p);
      shirtMaterial.color.copy(starter.shirt).lerp(target.shirt, p);
      pantsMaterial.color.copy(starter.pants).lerp(target.pants, p);
    }

    // =========================================================
    // TRANSFORMATION
    // =========================================================

    let progress = 0;
    let transforming = false;
    let transformStart = 0;

    const TRANSFORM_MS = 30000;

    const status = document.getElementById("status");
    const barFill = document.getElementById("barFill");
    const transformBtn = document.getElementById("transformBtn");

    function startTransformation() {
      if (transforming || progress >= 1) return;

      transforming = true;
      transformStart =
        performance.now() - progress * TRANSFORM_MS;

      transformBtn.textContent = "TRANSFORMING";

      status.textContent =
        "Transformation started. Watch the same body reshape continuously.";
    }

    function resetTransformation() {
      transforming = false;
      progress = 0;

      applyBody(0);

      transformBtn.textContent = "TRANSFORM";
      barFill.style.width = "0%";

      status.textContent =
        "Starter form restored. Use LOOK DOWN and inspect from torso to feet.";
    }

    transformBtn.addEventListener("click", startTransformation);
    document.getElementById("resetBtn").addEventListener("click", resetTransformation);

    // =========================================================
    // CAMERA
    // =========================================================

    let yaw = 0;
    let pitch = -0.10;
    let bodyView = false;

    const sensitivity = 0.0040;

    const minPitch = THREE.MathUtils.degToRad(-89);
    const maxPitch = THREE.MathUtils.degToRad(70);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    function setPitch(value) {
      pitch = THREE.MathUtils.clamp(value, minPitch, maxPitch);
    }

    function beginLook(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function moveLook(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      setPitch(pitch - dy * sensitivity);
    }

    function endLook() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      (e) => {
        if (e.touches.length === 1) {
          beginLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      (e) => {
        if (e.touches.length === 1) {
          e.preventDefault();

          moveLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endLook);
    renderer.domElement.addEventListener("touchcancel", endLook);

    renderer.domElement.addEventListener(
      "mousedown",
      (e) => beginLook(e.clientX, e.clientY)
    );

    window.addEventListener(
      "mousemove",
      (e) => moveLook(e.clientX, e.clientY)
    );

    window.addEventListener("mouseup", endLook);

    document.getElementById("lookBtn").addEventListener(
      "click",
      () => {
        bodyView = false;
        document.getElementById("viewBtn").textContent = "BODY VIEW";

        // Not a full 90 degrees; this preserves visibility of torso + legs + feet.
        setPitch(THREE.MathUtils.degToRad(-68));
      }
    );

    document.getElementById("viewBtn").addEventListener(
      "click",
      () => {
        bodyView = !bodyView;

        document.getElementById("viewBtn").textContent =
          bodyView ? "FIRST PERSON" : "BODY VIEW";

        status.textContent =
          bodyView
            ? "Body view active. Check the full silhouette while transforming."
            : "First person restored. Use LOOK DOWN to inspect the body.";
      }
    );

    // =========================================================
    // LOOP
    // =========================================================

    applyBody(0);

    function animate(now) {
      requestAnimationFrame(animate);

      yawBone.rotation.y = yaw;

      if (!bodyView) {
        cameraPitch.rotation.x = pitch;

        if (camera.parent !== cameraPitch) {
          cameraPitch.add(camera);
          camera.position.set(0, 0, 0);
          camera.rotation.set(0, 0, 0);
        }
      } else {
        if (camera.parent !== scene) {
          scene.attach(camera);
        }

        // Cleaner body inspection view.
        camera.position.set(
          player.position.x + 1.7,
          1.33,
          player.position.z + 3.25
        );

        camera.lookAt(
          new THREE.Vector3(
            player.position.x,
            0.92,
            player.position.z
          )
        );
      }

      if (transforming) {
        progress =
          (now - transformStart) / TRANSFORM_MS;

        progress = THREE.MathUtils.clamp(
          progress,
          0,
          1
        );

        const smooth =
          progress * progress * (3 - 2 * progress);

        applyBody(smooth);

        const percent = Math.round(progress * 100);
        barFill.style.width = percent + "%";

        status.textContent =
          "Transforming... " + percent +
          "% - torso, hips, thighs, limbs, height, skin and clothing are changing.";

        if (progress >= 1) {
          transforming = false;
          transformBtn.textContent = "COMPLETE";

          status.textContent =
            "Transformation complete. The target body is fully applied.";
        }
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener(
      "resize",
      () => {
        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio, 2)
        );
      }
    );
  </script>
</body>
</html>
