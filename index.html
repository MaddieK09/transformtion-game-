<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Transformation Game Prototype V8.3</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 9px);
      left: 9px;
      right: 9px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      max-width: 500px;
      margin: 0 auto;
      padding: 10px 13px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.57);
      color: white;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .status {
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.94;
    }

    .bar {
      margin-top: 8px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
    }

    #barFill {
      width: 0%;
      height: 100%;
      background: white;
      border-radius: 999px;
    }

    #bottomUI {
      position: fixed;
      left: 7px;
      right: 7px;
      bottom: calc(env(safe-area-inset-bottom) + 9px);
      z-index: 30;
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 12px 13px;
      font-size: 14px;
      font-weight: 800;
      color: #111;
      background: white;
      min-width: 108px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    button:active {
      transform: scale(0.97);
    }

    button.secondary {
      background: rgba(255,255,255,0.85);
      min-width: 94px;
    }

    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 76px);
      left: 8px;
      right: 8px;
      text-align: center;
      color: rgba(255,255,255,0.92);
      font-size: 12px;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 2px 5px rgba(0,0,0,0.7);
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="hud">
    <div class="panel">
      <div class="title">Transformation Game - V8.3 Humanoid Sculpt</div>
      <div id="status" class="status">
        Starter form. This version uses one smooth organic body surface.
      </div>
      <div id="debugInfo" class="status" style="margin-top:4px; opacity:0.72;">
        Field elements: 0 | sculpt mode
      </div>
      <div class="bar">
        <div id="barFill"></div>
      </div>
    </div>
  </div>

  <div id="hint">
    V8.3: separated limbs, tighter field, more human silhouette
  </div>

  <div id="bottomUI">
    <button id="lookBtn" class="secondary">LOOK DOWN</button>
    <button id="viewBtn" class="secondary">BODY VIEW</button>
    <button id="transformBtn">TRANSFORM</button>
    <button id="resetBtn" class="secondary">RESET</button>
  </div>

  <div id="fatalError" style="
    display:none;
    position:fixed;
    left:12px;
    right:12px;
    top:45%;
    z-index:9999;
    padding:14px;
    border-radius:14px;
    background:#7a1111;
    color:white;
    font:700 14px/1.4 Arial,sans-serif;
    white-space:pre-wrap;
  "></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    const fatalError = document.getElementById("fatalError");

    function showFatalError(message) {
      fatalError.style.display = "block";
      fatalError.textContent =
        "V8.3 render error\n\n" +
        String(message) +
        "\n\nSend me a screenshot of this message.";
    }

    window.addEventListener("error", (event) => {
      showFatalError(event.message || event.error || "Unknown JavaScript error");
    });

    window.addEventListener("unhandledrejection", (event) => {
      showFatalError(event.reason || "Unhandled promise rejection");
    });

    import * as THREE from "three";
    import { MarchingCubes } from "three/addons/objects/MarchingCubes.js";

    // =========================================================
    // ENGINE
    // =========================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x91d5f4);

    const camera = new THREE.PerspectiveCamera(
      67,
      window.innerWidth / window.innerHeight,
      0.03,
      150
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.getElementById("game").appendChild(renderer.domElement);

    // =========================================================
    // WORLD
    // =========================================================

    scene.add(new THREE.HemisphereLight(0xffffff, 0x53616e, 2.05));

    const sun = new THREE.DirectionalLight(0xffffff, 2.4);
    sun.position.set(4, 9, 4);
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({
        color: 0x92979c,
        roughness: 0.95
      })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function worldBox(x, y, z, sx, sy, sz, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.84
        })
      );

      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      scene.add(mesh);
      return mesh;
    }

    worldBox(0, 1.5, -6.3, 10, 3, 0.22, 0xdce0e3);
    worldBox(-5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);
    worldBox(5.1, 1.5, -1.0, 0.22, 3, 10, 0xdce0e3);

    worldBox(-2.6, 0.45, -3.5, 1.45, 0.9, 0.75, 0x9b7755);
    worldBox(2.6, 0.88, -3.9, 0.72, 1.76, 0.72, 0x6d7c8f);

    // =========================================================
    // PLAYER
    // =========================================================

    const player = new THREE.Group();
    player.position.set(0, 0, 2.6);
    scene.add(player);

    const yawRoot = new THREE.Group();
    player.add(yawRoot);

    // =========================================================
    // SMOOTH ORGANIC BODY
    // =========================================================

    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: 0x40628f,
      roughness: 0.72,
      metalness: 0.0
    });

    // Marching cubes creates ONE continuous smooth surface from overlapping fields.
    // Resolution 28 is a balance between smoothness and iPhone performance.
    const body = new MarchingCubes(
      28,
      bodyMaterial,
      true,
      true,
      120000
    );

    body.enableUvs = false;
    body.enableColors = false;
    body.isolation = 92;

    // MarchingCubes lives in local -1..1-ish space after scale.
    // We shape it in normalized 0..1 field coordinates, then scale to human size.
    body.scale.set(0.92, 1.84, 0.66);
    body.position.set(0, 0.91, 0.03);

    yawRoot.add(body);

    // =========================================================
    // STARTER + TARGET
    // Values are normalized shape controls, not literal centimeters.
    // =========================================================

    const starter = {
      height: 1.80,
      shoulder: 0.50,
      chest: 0.40,
      chestDepth: 0.30,
      waist: 0.34,
      hip: 0.36,
      hipDepth: 0.31,
      thigh: 0.115,
      calf: 0.085,
      arm: 0.068,
      forearm: 0.058,
      hand: 0.070,
      foot: 0.090,
      head: 0.108,
      neck: 0.060,
      chestFront: 0.020,
      gluteBack: 0.025,
      color: new THREE.Color(0x40628f)
    };

    const target = {
      height: 1.55,
      shoulder: 0.405,
      chest: 0.36,
      chestDepth: 0.335,
      waist: 0.275,
      hip: 0.44,
      hipDepth: 0.37,
      thigh: 0.125,
      calf: 0.090,
      arm: 0.058,
      forearm: 0.050,
      hand: 0.062,
      foot: 0.082,
      head: 0.103,
      neck: 0.054,
      chestFront: 0.060,
      gluteBack: 0.055,
      color: new THREE.Color(0x914188)
    };

    function mix(a, b, t) {
      return a + (b - a) * t;
    }

    function shapeAt(t) {
      return {
        height: mix(starter.height, target.height, t),
        shoulder: mix(starter.shoulder, target.shoulder, t),
        chest: mix(starter.chest, target.chest, t),
        chestDepth: mix(starter.chestDepth, target.chestDepth, t),
        waist: mix(starter.waist, target.waist, t),
        hip: mix(starter.hip, target.hip, t),
        hipDepth: mix(starter.hipDepth, target.hipDepth, t),
        thigh: mix(starter.thigh, target.thigh, t),
        calf: mix(starter.calf, target.calf, t),
        arm: mix(starter.arm, target.arm, t),
        forearm: mix(starter.forearm, target.forearm, t),
        hand: mix(starter.hand, target.hand, t),
        foot: mix(starter.foot, target.foot, t),
        head: mix(starter.head, target.head, t),
        neck: mix(starter.neck, target.neck, t),
        chestFront: mix(starter.chestFront, target.chestFront, t),
        gluteBack: mix(starter.gluteBack, target.gluteBack, t)
      };
    }

    // =========================================================
    // METABALL HELPERS
    // =========================================================

    let fieldElementCount = 0;

    function addBall(x, y, z, size, stretch = 1.0) {
      // V8.3 tightens each metaball so neighboring anatomy can connect
      // without melting the entire body into one capsule.
      const strength = Math.max(0.16, size * stretch * 2.15);
      const subtract = 12.0;

      body.addBall(x, y, z, strength, subtract);
      fieldElementCount++;
    }

    function addChain(a, b, count, sizeA, sizeB) {
      for (let i = 0; i < count; i++) {
        const t = count === 1 ? 0 : i / (count - 1);

        addBall(
          mix(a.x, b.x, t),
          mix(a.y, b.y, t),
          mix(a.z, b.z, t),
          mix(sizeA, sizeB, t)
        );
      }
    }

    // =========================================================
    // BUILD HUMAN FIELD
    // =========================================================

    function buildHuman(progress) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);
      const s = shapeAt(p);

      body.reset();
      fieldElementCount = 0;

      // Height is handled mostly by world scale to keep all proportions coherent.
      const heightScale = s.height / starter.height;
      body.scale.y = 1.92 * heightScale;

      // Normalized center line.
      const cx = 0.50;

      // Y positions in field coordinates.
      const ankleY = 0.08;
      const calfY = 0.21;
      const kneeY = 0.34;
      const thighY = 0.47;
      const hipY = 0.58;
      const waistY = 0.67;
      const chestY = 0.78;
      const shoulderY = 0.84;
      const neckY = 0.89;
      const headY = 0.955;

      // Z: front is smaller values because camera looks toward -Z in world.
      const centerZ = 0.52;

      // ----- Head / neck -----
      addBall(cx, headY, centerZ - 0.012, s.head * 0.76);
      addBall(cx, headY - 0.025, centerZ + 0.005, s.head * 0.76);

      addChain(
        { x: cx, y: neckY, z: centerZ },
        { x: cx, y: shoulderY + 0.01, z: centerZ },
        3,
        s.neck,
        s.neck * 0.96
      );

      // ----- Shoulder / upper chest bridge -----
      addBall(cx, shoulderY, centerZ, s.chest * 0.40);

      addBall(
        cx - s.shoulder * 0.30,
        shoulderY,
        centerZ,
        s.arm * 0.90
      );

      addBall(
        cx + s.shoulder * 0.30,
        shoulderY,
        centerZ,
        s.arm * 0.90
      );

      // ----- Chest -----
      // Central volume plus left/right chest masses merged into ONE surface.
      addBall(cx, chestY, centerZ, s.chest * 0.48);

      addBall(
        cx - s.chest * 0.17,
        chestY - 0.004,
        centerZ - s.chestFront,
        s.chest * 0.31
      );

      addBall(
        cx + s.chest * 0.17,
        chestY - 0.004,
        centerZ - s.chestFront,
        s.chest * 0.31
      );

      // Ribcage lower bridge.
      addBall(cx, chestY - 0.055, centerZ + 0.005, s.chest * 0.42);

      // ----- Waist / abdomen -----
      addBall(cx, waistY + 0.03, centerZ, s.waist * 0.48);
      addBall(cx, waistY - 0.025, centerZ - 0.005, s.waist * 0.45);

      // ----- Pelvis / hips -----
      addBall(cx, hipY + 0.015, centerZ, s.hip * 0.43);

      addBall(
        cx - s.hip * 0.23,
        hipY,
        centerZ,
        s.hip * 0.34
      );

      addBall(
        cx + s.hip * 0.23,
        hipY,
        centerZ,
        s.hip * 0.34
      );

      // Back/glute fullness merges into pelvis.
      addBall(
        cx - s.hip * 0.15,
        hipY - 0.018,
        centerZ + s.gluteBack,
        s.hip * 0.30
      );

      addBall(
        cx + s.hip * 0.15,
        hipY - 0.018,
        centerZ + s.gluteBack,
        s.hip * 0.30
      );

      // ----- Legs -----
      const legX = s.hip * 0.30;

      for (const sign of [-1, 1]) {
        const x = cx + sign * legX;

        // Thigh from hip to knee.
        addChain(
          { x, y: hipY - 0.025, z: centerZ + 0.005 },
          { x, y: kneeY + 0.025, z: centerZ + 0.002 },
          5,
          s.thigh * 0.82,
          s.thigh * 0.58
        );

        // Knee.
        addBall(x, kneeY, centerZ, s.calf * 0.70);

        // Calf.
        addChain(
          { x, y: kneeY - 0.015, z: centerZ + 0.004 },
          { x, y: ankleY + 0.04, z: centerZ + 0.004 },
          5,
          s.calf * 0.82,
          s.calf * 0.50
        );

        // Foot extends forward (-Z).
        addChain(
          { x, y: ankleY, z: centerZ + 0.005 },
          { x, y: ankleY - 0.005, z: centerZ - 0.085 },
          4,
          s.foot * 0.58,
          s.foot
        );
      }

      // ----- Arms -----
      const shoulderX = s.shoulder * 0.38;
      const elbowY = 0.68;
      const wristY = 0.54;

      for (const sign of [-1, 1]) {
        const sx = cx + sign * shoulderX;

        // Upper arm angles gently inward.
        addChain(
          { x: sx, y: shoulderY - 0.005, z: centerZ },
          { x: sx + sign * 0.028, y: elbowY, z: centerZ + 0.010 },
          5,
          s.arm * 0.88,
          s.arm * 0.70
        );

        // Forearm.
        addChain(
          { x: sx + sign * 0.028, y: elbowY, z: centerZ + 0.010 },
          { x: sx + sign * 0.010, y: wristY, z: centerZ - 0.002 },
          4,
          s.forearm,
          s.forearm * 0.62
        );

        // Hand.
        addBall(
          sx + sign * 0.040,
          wristY - 0.035,
          centerZ - 0.008,
          s.hand
        );
      }

      bodyMaterial.color.copy(starter.color).lerp(target.color, p);

      // Force the isosurface to regenerate now instead of relying only on render hooks.
      body.update();

      document.getElementById("debugInfo").textContent =
        "Field elements: " + fieldElementCount +
        " | isolation: " + body.isolation;
    }

    // =========================================================
    // CAMERA / FIRST PERSON
    // =========================================================

    const cameraPivot = new THREE.Group();
    yawRoot.add(cameraPivot);
    cameraPivot.add(camera);

    let yaw = 0;
    let pitch = -0.10;
    let bodyView = false;

    const sensitivity = 0.0040;

    const minPitch = THREE.MathUtils.degToRad(-88);
    const maxPitch = THREE.MathUtils.degToRad(70);

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    function updateFirstPersonCamera(progress) {
      const s = shapeAt(progress);
      const heightScale = s.height / starter.height;

      // Eyes positioned anatomically above and in front of chest.
      // body.position.y is center-ish of MarchingCubes volume.
      cameraPivot.position.set(
        0,
        1.61 * heightScale,
        -0.08
      );
    }

    function setPitch(value) {
      pitch = THREE.MathUtils.clamp(value, minPitch, maxPitch);
    }

    function beginLook(x, y) {
      dragging = true;
      lastX = x;
      lastY = y;
    }

    function moveLook(x, y) {
      if (!dragging || bodyView) return;

      const dx = x - lastX;
      const dy = y - lastY;

      lastX = x;
      lastY = y;

      yaw -= dx * sensitivity;
      setPitch(pitch - dy * sensitivity);
    }

    function endLook() {
      dragging = false;
    }

    renderer.domElement.addEventListener(
      "touchstart",
      (e) => {
        if (e.touches.length === 1) {
          beginLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener(
      "touchmove",
      (e) => {
        if (e.touches.length === 1) {
          e.preventDefault();
          moveLook(
            e.touches[0].clientX,
            e.touches[0].clientY
          );
        }
      },
      { passive: false }
    );

    renderer.domElement.addEventListener("touchend", endLook);
    renderer.domElement.addEventListener("touchcancel", endLook);

    renderer.domElement.addEventListener(
      "mousedown",
      (e) => beginLook(e.clientX, e.clientY)
    );

    window.addEventListener(
      "mousemove",
      (e) => moveLook(e.clientX, e.clientY)
    );

    window.addEventListener("mouseup", endLook);

    document.getElementById("lookBtn").addEventListener(
      "click",
      () => {
        bodyView = false;
        document.getElementById("viewBtn").textContent = "BODY VIEW";

        // Moderate downward angle to reveal torso -> legs -> feet.
        setPitch(THREE.MathUtils.degToRad(-70));
      }
    );

    document.getElementById("viewBtn").addEventListener(
      "click",
      () => {
        bodyView = !bodyView;

        document.getElementById("viewBtn").textContent =
          bodyView ? "FIRST PERSON" : "BODY VIEW";

        status.textContent =
          bodyView
            ? "Body view active. Inspect the smooth connected silhouette."
            : "First person restored. Use LOOK DOWN to inspect your body.";
      }
    );

    // =========================================================
    // TRANSFORMATION
    // =========================================================

    let progress = 0;
    let transforming = false;
    let transformStart = 0;

    const TRANSFORM_MS = 32000;

    const status = document.getElementById("status");
    const barFill = document.getElementById("barFill");
    const transformBtn = document.getElementById("transformBtn");

    function startTransformation() {
      if (transforming || progress >= 1) return;

      transforming = true;
      transformStart =
        performance.now() - progress * TRANSFORM_MS;

      transformBtn.textContent = "TRANSFORMING";

      status.textContent =
        "Transformation started. The smooth body field is reshaping continuously.";
    }

    function resetTransformation() {
      transforming = false;
      progress = 0;

      buildHuman(0);
      updateFirstPersonCamera(0);

      transformBtn.textContent = "TRANSFORM";
      barFill.style.width = "0%";

      status.textContent =
        "Starter form restored. This version uses one smooth organic body surface.";
    }

    transformBtn.addEventListener("click", startTransformation);
    document.getElementById("resetBtn").addEventListener("click", resetTransformation);

    // =========================================================
    // LOOP
    // =========================================================

    buildHuman(0);
    updateFirstPersonCamera(0);

    function animate(now) {
      requestAnimationFrame(animate);

      yawRoot.rotation.y = yaw;

      if (transforming) {
        progress =
          (now - transformStart) / TRANSFORM_MS;

        progress = THREE.MathUtils.clamp(
          progress,
          0,
          1
        );

        const smooth =
          progress * progress * (3 - 2 * progress);

        buildHuman(smooth);
        updateFirstPersonCamera(smooth);

        const percent = Math.round(progress * 100);
        barFill.style.width = percent + "%";

        status.textContent =
          "Transforming... " + percent +
          "% - the same smooth humanoid surface is changing shape.";

        if (progress >= 1) {
          transforming = false;
          transformBtn.textContent = "COMPLETE";

          status.textContent =
            "Transformation complete. The target smooth humanoid form is fully applied.";
        }
      }

      if (!bodyView) {
        if (camera.parent !== cameraPivot) {
          cameraPivot.add(camera);
          camera.position.set(0, 0, 0);
        }

        camera.rotation.set(pitch, 0, 0);
      } else {
        if (camera.parent !== scene) {
          scene.attach(camera);
        }

        const currentShape = shapeAt(
          progress * progress * (3 - 2 * progress)
        );

        const h = currentShape.height;

        camera.position.set(
          player.position.x + 1.45,
          h * 0.70,
          player.position.z + 3.15
        );

        camera.lookAt(
          new THREE.Vector3(
            player.position.x,
            h * 0.47,
            player.position.z
          )
        );
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener(
      "resize",
      () => {
        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio, 2)
        );
      }
    );
  </script>
</body>
</html>
